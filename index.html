<title>321約翰二書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}

/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){

  if (!window.__booted && (!m || m.innerHTML.trim().length < 40)){

}, 8000);

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"在真理和愛心上","sub":"真、愛、守","lv":"A","arc":"真・愛・守","sec":[["1:1--3","愛你們是為真理的緣故：長老與蒙揀選的太太"],["1:4--6","我們若照他的命令行，這就是愛：遵行真理、彼此相愛"],["1:7--9","常守這教訓的，就有父又有子：迷惑人的與常守的"],["1:10--11","不要接他到家裡：接待、問安與有分"],["1:12--13","使你們的喜樂滿足：紙墨與當面"]],"serm":{"pts":[["真理裡的愛","1:1--4","「愛你們是為真理的緣故」——長老愛這一家，是在真理裡愛；這真理不是一套條文，是存在我們裡面、也必永遠與我們同在的；看見兒女遵行真理，他就甚歡喜"],["愛的形狀","1:5--6","「我們若照他的命令行，這就是愛」——彼此相愛不是新命令，是從起初所受的；愛有形狀，照祂的命令行；命令也有溫度，就是彼此相愛"],["為所愛的守門","1:7--13","「常守這教訓的，就有父又有子」——因為有迷惑人的出來，愛要守門：不給否認基督成了肉身的教師講台與祝福；守門不是終點，當面相見、喜樂滿足才是"]]},"q":"這個星期，你的手機裡有沒有跳出這樣一則轉發：一位講得很動人的老師，一門號稱「比教會講得更深」的課，一個請大家一起贊助的募款連結；轉發的人是你很愛的組員，底下已經有十幾個人按了讚，正等你也按一下。\n同一個晚上，也許你正為一個走遠的孩子睡不著，為不信主的先生不肯踏進教會而嘆氣，或者躺在病床上，用手機參加線上團契，覺得自己好像算不上「真的在場」。\n這一章要問的是：愛一個人，到底要不要有界線？守住一扇門，會不會讓我變成一個冷冰冰的人？而我們真正要守住的，是一套說法、一個圈子，還是那位「有父又有子」的主？","truth":"愛有形狀，命令有溫度：「我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令」（1:6）——愛被命令定義，命令被愛定義，兩隻手哪一隻都不能放。\n所以守門不是愛的反面，是愛的延伸；我們守得住，不是因為我們看得準，而是因為「常守這教訓的，就有父又有子」（1:9）——守住的是一位，擁有的是一切。","mv":{"t":"恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在！","r":"約貳1:3"},"card":["約翰二書只有一章，這一章就是全卷真・愛・守的整條路。先是真（1:1--4）：長老在真理中愛這一家，真理先住進我們裡面，兒女在真理中行走；再是愛（1:5--6）：彼此相愛是從起初的命令，照祂的命令行就是愛；最後是守（1:7--13）：因為有迷惑人的出來，愛要守門，守門卻是為了當面相見、喜樂滿足。次序不能倒：先守後愛會變成審查，有愛無守會變成人人都能進來偷羊的羊圈。全章拎起來就是一句話：一個被真理找到、被愛牽著的家，怎樣在不冷落任何人的情況下，守住那扇門。","這封信看起來是長老在叮嚀一個家，真正的主詞是神。在我們守住真理以前，真理已經先住下來：「這真理存在我們裡面，也必永遠與我們同在」（1:2）；恩惠、憐憫、平安「從父神和他兒子耶穌基督」而來，長老用的是「必」，不是「願」——這是神的應許（1:3）；那條彼此相愛的命令，是「從父所受」的（1:4）；神的兒子真的「成了肉身來」（1:7）；而那常守的人，神把父與子都給了他（1:9）。我們守的每一扇門，都是神先把那一位放進了屋裡。","1:11「就在他的惡行上有分」，「有分」原文 κοινωνεῖ（koinōnei），和「相交」κοινωνία（koinōnia）同字根。長老說，對一位否認基督的教師說一句公開的祝福，就是和他成了夥伴。這改變今天的讀法：轉發一則課程連結、在群組替一位講員掛名推薦、為他的事工捐款按讚，都不只是「分享一下」，而是一種相交——我把自己的名字和他的信息放在一起。反過來也一樣：為真理接待一位弟兄，也是「與他們一同為真理做工」（約參 1:8）。按下轉發以前，先問：我要和誰相交？","這一章照出來的我，常常只用一隻手。我可能是那位只想被喜歡的組長，誰傳來的連結都轉，誰來講都說好，以為這叫包容，其實是怕得罪人；我也可能越守越窄，把每一個提問的人都當成門外的威脅，把不信的家人也一起關在外面；我還可能是那個覺得「從起初的」太淺、想走在前頭的人，在追求更新、更深的時候，不知不覺把基督留在了後頭。三種樣子，都是把自己放在中間。","「常守這教訓的，就有父又有子」（1:9）。全章最該被記住的，是一個動作：住下來。門外的人說「我走在前頭」，好像屬靈的進步就是往前超過使徒、超過基督；長老把方向翻過來：屬靈的進步不是往前越過，是往裡住進。越過基督的人以為自己得著更多，結果「就沒有神」；留在基督裡的人以為自己懂得不多，結果有父又有子。這一句叫人不必和人比誰懂得多，只要問自己今天是不是還住在祂裡面。","這一週，打開你的手機，翻一翻這個月轉發過、收藏過的課程、講員和募款連結。挑三則，各問一句：它傳的是那位真的成了肉身、為我死而復活的基督嗎？確定的，放心轉；不確定的，先不轉，星期日以前拿去問你的組長或牧者，不要在群組裡公開點名任何人。然後做另一隻手的事：傳一則訊息給一位很久沒聯絡、或和你信念不同的家人朋友，約一個時間當面喝杯茶。守一扇門，也開一扇門。","最終整合：一個週三的晚上，九點。\n線上小組的畫面裡有十二個小方格。一格是在病房裡的林阿嬤，手機靠在水杯上，鏡頭只照到半張臉；一格是剛下班、還在捷運上的年輕人；一格暗著，只有名字。\n組長的另一個視窗裡，躺著一則下午收到的轉發：一位很紅的老師，說他帶來「比使徒更深的道」，基督只是一道屬靈的光，從來沒有真的成為會流血的人。底下寫著：歡迎大家贊助。\n組長看了很久。她沒有在群組裡罵人，也沒有點名轉發的那位姊妹。她只是沒有按下轉發，把連結存起來，準備明天私下去問、也去陪那位姊妹。\n這時，私訊跳出來。是陳弟兄：「我兒子說，他不信了。」\n她的手指停在鍵盤上，打了又刪，最後只寫：「我明天去看你。今晚我們先一起為他禱告。」\n一隻手，沒有把講台交出去；一隻手，伸向一個破碎的家。\n她把麥克風打開，帶大家念今晚的經文。林阿嬤的聲音慢了半拍，捷運上的年輕人小聲跟著，那一格暗著的畫面裡，也傳出了聲音：\n「恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在！」（1:3）\n不是「願」，是「必」。不是「與你們」，是「與我們」。\n真理和愛心這兩隻手，從來不是靠組長的手勁握住的；是那位真的成了肉身、有父又有子的主，先用祂的兩隻手，握住了病房、捷運、暗著的畫面，和一位父親的眼淚。"],"self":"這一章照出來的「有己」，是一個想用一隻手過日子的人：只要真理，就一路把人推開，拿「我守得住」當成自己比人強的證據；只要愛，就甚麼都點頭，其實是怕被人說不夠包容、怕失去人緣。兩種樣子的中心，都是我的形象。\n有己也會穿上「進步」的衣服：覺得從起初的太舊太淺，想站到基督前面去定義神；或者在孩子還沒信主、團契只能在線上的時候，把自己當成失敗者，忘了真理不是靠我抓住的，是祂先住進來、必永遠同在的。","t321":{"k":"耶穌是我的榜樣：約翰說「道成了肉身，住在我們中間，充充滿滿地有恩典有真理」（約 1:14）——真理和愛心這兩隻手，最先是在一個有血有肉的人身上同時握住的。祂和稅吏罪人一同吃飯，被人議論「這個人接待罪人，又同他們吃飯」（路 15:2）；祂對那個被拖來的婦人說「我也不定你的罪。去吧，從此不要再犯罪了」（約 8:11），一句話裡兩隻手都在。祂敞開餐桌，卻從不讓人篡改父的話；祂守住真理，卻從不拿真理推開罪人。我學的不是長老的辨識力，是那位真的成了肉身來、在人中間活出真理和愛心的主。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是 1:9 原文 προάγων「走在前頭」的位置：我不站到基督前面去定義神，不把自己的領悟、流行的說法、更新更深的道放在祂的教訓之上；分辨的尺不是我的喜好，是「耶穌基督是成了肉身來的」（1:7）。第二個是「門口裁判」的位置：誰可以被我愛、誰該被我冷落，不由我的好惡決定；長老關上的只是講台與背書，不是餐桌與關心。可以自己檢查：我轉發、推薦、拒絕一個人的理由，是因為他傳不傳基督，還是因為他是不是我這一掛的人？","p":"建立屬神的體系：這封信是一個家寫給另一個家的，「你那蒙揀選之姊妹的兒女都問你安」（1:13）——體系是家與家、小組與小組之間的網絡，它的考驗是那扇門：接待誰，不接待誰。一群人要一起守，不是靠一個人的眼力：同工會可以定下講員與課程邀請的原則，在小組推課程、為事工轉發募款以前，先由兩三位同工一起帶著禱告分辨；同時也定下開門的原則：為主名出外的弟兄要接待、要送行（約參 1:5--8）。國度321空中團契散在各國，也可以這樣走：線上把真理送到每一格畫面裡，實體探訪與相聚使喜樂滿足；為兒女流淚的父母，有一群人陪著禱告。"},"grp":["【一、破冰】你家的門鈴或手機，最常為誰響？說一個你很樂意開門的人，和一個你一看到來電顯示就想假裝沒聽見的對象（推銷電話也算）。","【二、扎心】經文說：「我們若照他的命令行，這就是愛」（1:6）。你比較容易只用哪一隻手——為了不得罪人甚麼都點頭，還是為了守住對的而把人推開？說出最近一次具體的場景：在家裡、在群組裡，還是在教會的哪一個場合？","【三、福音】讀 1:3：「恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在！」（1:3）長老用的是「必」，不是「願」，而且把自己也放在「我們」裡。如果憐憫是先給了我這個也曾走錯路的人，這會怎樣改變我守門的語氣？又會怎樣安慰一位覺得自己守不住的人？","【四、行動】說出這一週你要做的兩件事：一件是守——哪一則連結、哪一個邀請，你決定先不轉、先去問誰（說出名字或職分）；一件是開——哪一位不信的家人、離開教會的朋友或很久沒見的組員，你要在哪一天、用甚麼方式聯絡他或去看他。","【五、代禱】為三種人指名禱告：一位兒女還沒信主、或已經離開信仰的父母，求主安慰他，也親自去找那個孩子；一位因病、因工作、因距離只能在線上參加團契的弟兄姊妹，求主使他知道自己沒有被關在喜樂外面；一位正被「更新更深」的說法吸引的朋友，求主用憐憫把他帶回那位成了肉身的基督面前。"],"prac":{"main":"這一週，我先被那位「必常與我們同在」的主握住，再學習兩隻手一起用：守住基督，也不冷落任何人。","items":["對神：每天早上讀 1:1--3 一次，讀到「必常與我們同在」就停下來，向主說：「謝謝你先住進我裡面，不是我先抓住你。」然後求祂指出，今天我比較容易放掉的是真理那隻手，還是愛心那隻手。","對自己：寫下一件你最近因為「怕得罪人」而說好、其實心裡不安的事，再寫下一件你因為「我是對的」而把人推開的事。在兩件事旁邊各寫一句：這件事裡，我真正想保護的是基督的名，還是我自己的形象？","對人：這週主動聯絡一位和你信念不同、或已經離開教會的家人朋友，不為說服他，只為關心他；如果你是兒女未信的父母，這週為孩子做一件不帶說教的愛的小事，然後把他交在神手裡。","對生活：清點一次手機裡的轉發與收藏，對每一則課程、講員、募款連結問一句：它傳的是成了肉身的基督嗎？不確定的先不轉，私下去問組長或牧者；不在群組公開點名、不貼標籤。","對使命：在小組或同工會裡提出一個具體安排：講員與課程邀請由兩三位同工一起禱告分辨，同時也定下接待為主名出外的弟兄的方式；並為小組裡一位只能在線上參加的人，安排這個月一次實體探訪。"]},"safe":["① 先講 321「讓耶穌作王、聖經是我的準則」，再拿 1:9「常守這教訓」當插圖，證明我們的理念是對的；或把整封信講成一堂「建立界線的管理課」。","約翰二書的次序是先有真理住進來（1:2）、先有從父神和祂兒子來的恩惠憐憫平安（1:3），才有照命令行、才有守門；321 只能在末端認出：讓耶穌作王，是因為「有父又有子」的那一位先把自己給了我們。把經文當理念的插圖，會眾記得的是一套方法，不是那位主。","檢驗標準：講完 1:9，會眾記得的第一個畫面，是一張 321 的圖表，還是那位真的成了肉身、常守祂就有父又有子的主？","② 用 1:10「不要接他到家裡」叫人冷落不信的家人、慕道友或離開教會的人：「他不信主，你就不要讓他進你家，也不要跟他打招呼。」","10--11 節的對象是 7、9 節定義的人——否認耶穌基督成了肉身、出去傳揚的巡迴教師；「接到家裡」是給他講台、住處、盤纏，「問安」是公開祝福與背書。主和罪人一同吃飯（路 15:2）；同一位長老在約參 1:5--8 要人接待為主名出外的弟兄：「所以我們應該接待這樣的人，叫我們與他們一同為真理做工」（約參 1:8）——二書關門、三書開門，標準是傳不傳基督（全卷立場見〈接待、問安與界線：10--11 節在第一世紀是甚麼意思，今天該怎樣應用？〉、〈約翰一、二、三書的關係：二書關門、三書開門，是同一個標準嗎？〉）。","檢驗標準：一位先生還沒信主的姊妹聽完，是更知道今晚可以照常為他煮飯、陪他說話，還是開始害怕和自己的丈夫同桌？","③ 把「不要問他的安」延伸成斷絕一切往來：不去不信的親人的婚禮、喪禮，不和拜拜的長輩吃年夜飯，不跟別的宗教的同事打招呼。","原文「問安」χαίρειν 在這裡是對一位傳另一個基督的教師公開祝福、送行與背書，不是街上點頭、不是家族的相聚；長老禁的是在他的「惡行上有分」（1:11），不是禁止愛鄰舍。把守門講成斷絕，福音就從家族裡被關了出去。","檢驗標準：一位家族裡唯一信主的人聽完，是更知道怎樣在年夜飯桌上帶著真理和愛心坐下，還是更想用信仰當理由逃離家人？","④ 用 1:7 把「敵基督」「迷惑人的」貼在某位政治人物、某個國家、某個宗派或某個群體身上，或據此推算末日的日子。","長老說「許多」，卻沒有點任何一個人的名字；分辨的尺是基督論：「認耶穌基督是成了肉身來的」（約壹 4:2）。主耶穌自己也被人貼過「那誘惑人的」標籤（太 27:63）；把這一節變成政治或宗派的武器，就把一把尺變成了一份名單（全卷立場見〈分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？〉）。","檢驗標準：講完 1:7，會眾帶回家的是一個問題——「他傳的基督是真的成了肉身的那一位嗎？」——還是一份可以去攻擊別人的標籤名單？","⑤ 只講一半：「真理最重要，人的感受不重要」；或反過來：「愛就是包容一切，誰來都歡迎，不必分辨真理。」","長老的問安是「在真理和愛心上」（1:3），而 1:6 把兩者綁成一個結：照祂的命令行就是愛，命令就是在愛裡行。講真理而看不見人，會把教會變成審判台；講愛而不講照祂的命令行，會讓所愛的人毫無保護（全卷立場見〈真理與愛：可以只用一隻手嗎？〉）。","檢驗標準：講完這一段，會眾是更清楚、也更溫柔，還是只剩其中一樣——更清楚卻更冷，或更溫柔卻更模糊？","⑥ 用 1:8「不要失去你們所做的工」嚇人：「你若接待錯了人，你的救恩就沒了」；或教人「多做工就多換賞賜」。","8 節講的是工作的成果與賞賜，不是得救本身：工程若被燒了，「他就要受虧損，自己卻要得救」（林前 3:15）。確據建立在基督完成的工作上，賞賜也不是交易；製造失去救恩的恐懼，等於把一封叫人安穩的信講成叫人顫抖的信（全卷立場見〈賞賜與確據：8 節「不要失去你們所做的工」，是說會失去救恩嗎？〉）。","檢驗標準：一位敏感、常常懷疑自己得救的弟兄聽完，是更安穩在基督裡、更願意謹慎事奉，還是帶著失去救恩的恐懼回家？","⑦ 用 1:9「凡越過基督的教訓」壓制提問：「你問這麼多，就是越過了；讀神學、查原文、問為甚麼，都是想走在前頭。」","9 節越過的是基督論的核心——父與子、道成肉身，不是一切提問、研究、聖經學的進展或不同的解經意見；長老自己在這封信裡也是用理由說服人。問問題不是越過，離開基督才是（全卷立場見〈分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？〉）。","檢驗標準：一位帶著真實疑問來參加小組的慕道友聽完，是更敢把問題說出來，還是學會了閉嘴？","⑧ 拿 1:9「常守這教訓的」替自己封王：「只有我們這一派守住純正的教訓，其他教會、其他解經都是越過。」","常守的是基督的教訓，不是某一位領袖、某一個宗派的全部意見；把次要的解經分歧都說成越過基督，就是站到基督前面去定義誰屬神——這正是「走在前頭」的另一種樣子。任何人都不能以「我守住純正教訓」壟斷屬靈權柄。","檢驗標準：講完這一段，會眾是更謙卑地留在基督裡，還是更驕傲地覺得只有我們這一群人對？","⑨ 用 1:1「蒙揀選的太太」替女性事奉下定論：「你看，約翰寫信給一位女領袖，可見女性可以作牧師」；或反過來：「她只是一位接待人的太太，女性的本分就是開放家庭。」","「太太」有三讀並陳：一間地方教會的擬人（和合本註腳「或譯：教會」，本講義傾向此讀）、一位姊妹與她的家、一個人名；這一節不為女性事奉的任何定論背書或反對，性別與事奉的討論回指哥林多前書與提摩太前書講義的議題頁（全卷立場見〈作者、收信人與處境：長老、蒙揀選的太太與巡迴教師各是誰？〉）。","檢驗標準：一位在教會服事的姊妹聽完，記得的是這一家如何被長老在真理裡愛著，還是又被捲進一場與經文無關的辯論？","⑩ 用 1:12「不願意用紙墨……當面談論」貶低線上團契：「網路聚會不算數，不能來實體的，就是不夠愛主。」","長老自己正在用紙墨傳真理——這封信本身就是遠距的牧養；紙墨是橋，不是次等，「當面」是盼望與邀請，不是門檻。因病、因工作、因距離不能到場的人，沒有少得真理，也沒有被關在喜樂外面；這一節對國度321空中團契這樣散在各國的群體特別要講對。","檢驗標準：一位只能躺在病床上用手機參加線上聚會的長輩聽完，是覺得自己被算進「我們」裡，還是覺得自己是次等的會友？","⑪ 用 1:4「我見你的兒女，有照……遵行真理的」責備父母：「孩子沒有走在真理中，是你們家庭祭壇沒有做好。」","4 節是長老的歡喜，不是父母的成績單；原文「你的兒女中有」只說長老遇見了一些，沒有一句責備那位母親的話。信仰不是父母遺傳給兒女的，是神親自去找人；兒女還沒信主或離開信仰的父母需要的是安慰、盼望和一群人陪著代禱，不是定罪。","檢驗標準：一位為走遠的孩子流淚多年的母親聽完，是更有盼望地繼續為他禱告，還是更確定自己是個失敗的父母？","⑫ 用處境取消原則：「這是第一世紀巡迴傳道人的事，今天沒有人上門借住，跟我們無關」；或把處境硬搬：「今天任何陌生傳道人來訪，都不准讓他住一晚。」","書信三問要走完：處境是家庭教會靠接待巡迴教師傳福音，「接到家裡」等於給講台（《十二使徒遺訓》11 章已為接待立規矩）；原則是不給否認基督的教師平台與祝福、卻要接待為主名出外的弟兄；今天的落點是講台、課程邀請、小組推薦、轉發募款、以教會名義背書——原則照守，落點隨處境（全卷立場見〈接待、問安與界線：10--11 節在第一世紀是甚麼意思，今天該怎樣應用？〉）。","檢驗標準：會眾聽完，是知道這兩節今天落在自己的群組、講台與奉獻上，還是覺得它要嘛太遙遠、要嘛被拿來拒絕一切陌生人？","⑬ 把整章講成長老的分辨力示範：「你看約翰多有眼光，一眼就看穿假教師，你們也要練成屬靈的偵探。」","長老守得住，不是因為他眼力過人，是因為「常守這教訓的，就有父又有子」（1:9）——焦點在那位有父又有子的主，不在長老的辨識力。把分辨講成一門技術，會眾學到的是懷疑人，失去的是那位被守住的基督。","檢驗標準：會眾聽完，是更佩服長老的辨識力、更想去抓假教師，還是更愛那位真的成了肉身來的主？","⑭ 把 1:7 的「迷惑人的」和被迷惑的人混為一談：「參加過那個團體的人都是敵基督，不要理他們。」","1:7 指的是出去傳揚、否認基督成了肉身的人；被他們帶錯路的，許多是羊，不是帶錯路的人。長老在要人守門之前，先在問安裡放了憐憫（1:3）——守門的人自己也是靠憐憫站立的，門外被帶錯路的羊，仍有回家的路。","檢驗標準：一位曾經被異端團體吸引、今天剛回來坐在後排的人聽完，是覺得門開著，還是覺得自己被貼上了標籤？","⑮ 用 1:11「問他安的，就在他的惡行上有分」定人的罪：「你轉發過那位講員的影片，你已經在他的惡行上有分，你被污染了。」","「有分」是要人在背書以前分辨，不是事後給人定罪；不知情地轉發或聽過一堂課，需要的是更正與停止，不是羞辱。把這一節變成追究過去的工具，會讓人不敢承認、不敢提問，反而更難回到真理裡。","檢驗標準：一位剛發現自己轉發過錯誤教導的弟兄聽完，是知道可以安心更正、被憐憫接住，還是嚇得甚麼都不敢說？","⑯ 用 1:5「從起初所受的命令」反對一切新的形式：「從起初就沒有線上聚會、沒有新詩歌、沒有新譯本，所以這些都是走在前頭。」","長老說「從起初」的，是內容——彼此相愛的命令、成了肉身的基督；不是聚會的形式與工具。長老自己就用紙墨這個工具把真理送到遠方；把形式的更新說成越過基督，是把真理的界線畫錯了地方。","檢驗標準：會眾聽完，是更清楚甚麼是一字不能改的福音核心，還是把自己習慣的聚會方式當成了真理？"]}],"txt":{"1":["作長老的寫信給蒙揀選的太太和她的兒女，就是我誠心所愛的；不但我愛，也是一切知道真理之人所愛的。","愛你們是為真理的緣故，這真理存在我們裡面，也必永遠與我們同在。","恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在！","我見你的兒女，有照我們從父所受之命令遵行真理的，就甚歡喜。","太太啊，我現在勸你，我們大家要彼此相愛。這並不是我寫一條新命令給你，乃是我們從起初所受的命令。","我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令。","因為世上有許多迷惑人的出來，他們不認耶穌基督是成了肉身來的；這就是那迷惑人、敵基督的。","你們要小心，不要失去你們所做的工，乃要得著滿足的賞賜。","凡越過基督的教訓不常守著的，就沒有神；常守這教訓的，就有父又有子。","若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安；","因為問他安的，就在他的惡行上有分。","我還有許多事要寫給你們，卻不願意用紙墨寫出來，但盼望到你們那裡，與你們當面談論，使你們的喜樂滿足。","你那蒙揀選之姊妹的兒女都問你安。"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,</p><p lang=\"grc\">διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθʼ ἡμῶν ἔσται εἰς τὸν αἰῶνα·</p>","lit":"<p>那長老，寫給蒙揀選的女主人和她的兒女——就是我在真理中所愛的；不只是我，也是一切已經認識了那真理的人，</p><p>是因著那真理，就是那住在我們裡面、也必永遠與我們同在的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὁ πρεσβύτερος</td><td>Ho presbyteros</td><td>那位長老</td><td>有冠詞：讀信的人都知道是誰</td></tr><tr><td>ἐκλεκτῇ κυρίᾳ</td><td>eklektē kyria</td><td>給蒙揀選的女主人</td><td>◆ 三讀：一間教會／一位姊妹／人名</td></tr><tr><td>οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ</td><td>hous egō agapō en alētheia</td><td>我在真理中所愛的</td><td>和合本「誠心」；追蹤一、二第一站</td></tr><tr><td>οἱ ἐγνωκότες τὴν ἀλήθειαν</td><td>hoi egnōkotes tēn alētheian</td><td>已經認識那真理的人</td><td>完成式分詞：認識了，至今仍認識</td></tr><tr><td>τὴν μένουσαν ἐν ἡμῖν</td><td>tēn menousan en hēmin</td><td>那住在我們裡面的</td><td>追蹤三第一站：與 1:9 μένων 同字</td></tr><tr><td>μεθʼ ἡμῶν ἔσται εἰς τὸν αἰῶνα</td><td>meth' hēmōn estai eis ton aiōna</td><td>必永遠與我們同在</td><td>未來式：不是盼望，是應許</td></tr></table>","gram":"<p><strong>Ὁ πρεσβύτερος（Ho presbyteros） 有冠詞。</strong>不是「一位長老」，是「那位長老」：收信的人一看就知道是誰，不必再報名字。πρεσβύτερος（presbyteros） 本來是「年長的人」，也是教會職分的稱呼；作者沒有稱自己是使徒。彼得寫信時也自稱「同作長老的」（彼前 5:1）。本系列沿用約翰一書講義的立場：作者是使徒約翰；另並陳帕皮亞（優西比烏《教會史》3.39 所引）提到的長老約翰說，以及約翰群體說，詳見議題頁。</p><p><strong>ἐκλεκτῇ κυρίᾳ（eklektē kyria） 有三種讀法。</strong>κυρίᾳ（kyria） 是 κύριος（kyrios） 的陰性，「女主人、夫人」；和合本註腳：太太，或譯：教會；下同。①<strong>一間地方教會的擬人</strong>：13 節問安的是「你那蒙揀選之姊妹的兒女」（1:13），姊妹本人沒有出聲，最像一間姊妹教會；全信在單數 σε（se） 與複數 ὑμᾶς（hymas） 之間來回轉換（單數在 4、5、13 節，複數在 6、8、10、12 節），像是對一個群體說話；新約也有把教會說成蒙揀選的女子的筆法：「在巴比倫與你們同蒙揀選的教會」（彼前 5:13），弗 5:25--32 又稱教會是基督的新婦。②<strong>一位姊妹與她的家</strong>：字面最自然；她的家就是聚會的地方，這使我們想起「在你家的教會」（門 1:2），也想起徒 12:12 馬可的母親馬利亞的家。③<strong>人名</strong>：Κυρία（Kyria） 或 Ἐκλέκτη（Eklektē）；難處在 13 節，若 Ἐκλέκτη（Eklektē） 是名字，她的姊妹也得叫同一個名字。</p><p>本講義傾向①，但三讀都能在講台上用，不作裁判。這一節也不拿來替女性事奉的任何定論背書，或用來反對。</p><p><strong>ἐν ἀληθείᾳ（en alētheia） 和合本譯作「誠心」。</strong>它可以是副詞片語「真誠地」，也可以是「在真理的範圍裡」。後半句 τὴν ἀλήθειαν（tēn alētheian） 帶冠詞，是「那真理」；1:2 又接著說 διὰ τὴν ἀλήθειαν（dia tēn alētheian）。同一個字在兩節裡出現三次，很難只讀成「真心」。本講義兩者並取：愛是真誠的，也是在真理裡的。οἱ ἐγνωκότες（hoi egnōkotes） 是完成式分詞，認識已經發生，結果至今仍在。μένουσαν（menousan） 是現在分詞，真理一直住著；ἔσται（estai） 是未來式直說語氣，陳述一件必成的事。</p>","exp":"<p>〔約壹〕約壹 2:24--27（約翰一書講義第 2 章）</p><p>「作長老的寫信給蒙揀選的太太和她的兒女，就是我誠心所愛的」（1:1）。全卷第一個動詞就是愛。可是長老立刻替這份愛定了位：它是「在真理中」的，而且「不但我愛，也是一切知道真理之人所愛的」（1:1）。</p><p>這句話把一件很平常的事說得很不平常。這一家人，長老未必天天見；那「一切知道真理之人」，彼此也多半不認識。是甚麼把一群素昧平生的人連在一起？不是血緣，不是同鄉，是同一個真理。真理在這裡不是一道把人隔開的牆，是一條把人串起來的線。一位老牧者（相傳晚年在以弗所），一個在別城的家庭聚會，還有散在各地、互相不知道名字的信徒，因為認識了同一位，就成了同一家。</p><p>「愛你們是為真理的緣故，這真理存在我們裡面，也必永遠與我們同在」（1:2）。次序很要緊：不是我們先抓住了真理，是真理先住進來。μένουσαν（menousan） 和 9 節「常守」的 μένων（menōn） 是同一個字。等到 9 節要人「常守」的時候，讀信的人要記得：我們能住在真理裡，是因為真理先住在我們裡面。守，是回應一位已經住下來的；不是靠自己的手勁抓住一套條文。</p><p>「一切知道真理之人」也是一句很寬的話。它沒有說「一切和我們同一派的人」，也沒有說「一切我認識的人」。凡認識了這真理的，都在這份愛裡。這使真理的圈子比任何一個地方教會都大，也比任何一個人的朋友名單都大。一個人如果說他愛真理，卻只愛自己圈子裡的人，就還沒有讀懂這一節。</p><p>「必永遠與我們同在」這句話，使我們想起主在樓上說的：「叫他永遠與你們同在」（約 14:16），接著稱祂為「真理的聖靈」（約 14:17）。長老在這裡沒有提聖靈的名，我們只說使我們想起。可是那個方向是一樣的：真理不是我們隨身攜帶、可能遺失的行李，是一位要永遠同住的。</p><p>這位「太太」究竟是誰，原文觀察已經並陳三讀。講台上不必替會眾裁判：若讀成一間地方教會，這兩節是長老寫給一整個聚會的情書，會眾就是她的兒女；若讀成一位姊妹與她的家，這兩節是對一個敞開家門、讓教會在裡面聚集的家庭的肯定。兩種讀法說的是同一件事：一群被真理找到的人，被長老在真理裡愛著。不論哪一種讀法，焦點都不在這位太太的身分，而在那個把她和「一切知道真理之人」連在一起的真理。</p><p>一個被真理找到的家，愛就有了根；一份在真理裡的愛，也就不會只是情緒。321 說改變觀點：「也必永遠」把眼光從今天的聚會、今天的人數，挪到永遠去。</p>"},{"a":3,"z":3,"star":2,"grk":"<p lang=\"grc\">ἔσται μεθʼ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.</p>","lit":"<p>必與我們同在的：恩典、憐憫、平安，從父神，也從耶穌基督——父的兒子，在真理和愛裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἔσται μεθʼ ἡμῶν</td><td>estai meth' hēmōn</td><td>必與我們同在</td><td>未來式直說語氣：應許，不是願望</td></tr><tr><td>χάρις ἔλεος εἰρήνη</td><td>charis eleos eirēnē</td><td>恩典、憐憫、平安</td><td>◆ 約翰著作只有這裡有 ἔλεος</td></tr><tr><td>παρὰ θεοῦ πατρός</td><td>para theou patros</td><td>從父神</td><td>◆ 經文鑑別：RP 第二個 παρὰ 後加「主」</td></tr><tr><td>τοῦ υἱοῦ τοῦ πατρός</td><td>tou huiou tou patros</td><td>那父的兒子</td><td>這個說法新約只在這裡</td></tr><tr><td>ἐν ἀληθείᾳ καὶ ἀγάπῃ</td><td>en alētheia kai agapē</td><td>在真理和愛裡</td><td>章題；全卷兩隻手交會</td></tr></table>","gram":"<p><strong>這是一句陳述，不是一句祝願。</strong>保羅的問安多半沒有動詞，和合本補成「願……歸與你們」：「願恩惠、平安從我們的父神並主耶穌基督歸與你們」（羅 1:7）。長老卻寫了一個未來式直說語氣的 ἔσται（estai）：恩惠、憐憫、平安「必」與我們同在。而且是 μεθʼ ἡμῶν（meth' hēmōn），「我們」，長老把自己也算在裡面。</p><p><strong>ἔλεος（eleos）「憐憫」在書信問安裡很少見。</strong>保羅只在寫給提摩太的兩封信加上它：「願恩惠、憐憫、平安從父神和我們主基督耶穌歸與你」（提前 1:2），提後 1:2 相同；另見猶 2。約翰的著作，福音書、三封書信、啟示錄，ἔλεος（eleos） 只出現在這一節。憐憫是向軟弱的、不配的人彎下腰來。一封等一下要人守門的信，問安裡先放了憐憫。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 παρὰ θεοῦ πατρός（para theou patros）, καὶ παρὰ Ἰησοῦ Χριστοῦ（kai para Iēsou Christou），和合本「從父神和他兒子耶穌基督」照這個讀法；RP 在第二個 παρὰ（para） 之後多一個 κυρίου（kyriou），作「從主耶穌基督」。κυρίου（kyriou） 很可能是抄寫者照保羅書信「主耶穌基督」的慣用語補上的；較短的讀法有較早的抄本支持。兩讀都把父與子並列，意思不受影響，本講義從 SBLGNT 與和合本。</p></blockquote><p>兩個 παρὰ（para） 並列，父與子同為恩典的源頭，不是一主一從。τοῦ υἱοῦ τοῦ πατρός（tou huiou tou patros）「那父的兒子」新約只在這裡出現，等於先把 9 節「有父又有子」的伏筆埋下。句末 ἐν ἀληθείᾳ καὶ ἀγάπῃ（en alētheia kai agapē） 是全卷的兩隻手：真理與愛第一次並排出現。</p>","exp":"<p>「恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在」（1:3）。這是全卷的章題，也是本章的第一座高峰。</p><p>長老還沒有開始警告，就先把三樣東西放在桌上：恩惠，是不配得而得的；憐憫，是軟弱時被扶起來；平安，是與神和好之後心裡的安穩。這三樣都不是收信的人掙來的，都是「從父神和他兒子」來的。等一下要談的守門、分辨、不接待，都必須站在這個地基上。一個不記得自己是靠憐憫站立的人，守門很快就會變成審查。</p><p>為甚麼偏偏在這封信裡加上憐憫？也許正因為這是一封要人分辨的信。分辨的人最容易忘記自己也曾經走錯過路；被迷惑的人當中，也有許多是被帶錯路的羊，不是帶錯路的人。長老先把憐憫放在問安裡，等於提醒那一家：守門的時候，心裡要留著憐憫的位置，對被帶錯路的羊，門外仍有回家的路。</p><p>「必常與我們同在」是一個應許。保羅的祝願像是在禱告中把恩典遞過去；長老的陳述像是在說：這件事已經定了。對一個門口常有陌生人敲門、常要做艱難判斷的家來說，這句話是先給的定心丸：你們不是靠自己的辨識力存活，是靠一位必與你們同在的恩典。</p><p>「父神和他兒子」兩個源頭並列，已經在對付 7 節那些不認耶穌基督成了肉身的人。子不是次一等的使者，祂與父同為恩惠的源頭。所以 9 節說，沒有子，就沒有神；有子，就連父也有了。</p><p>最後是「在真理和愛心上」。這兩個字以後會一直並肩走：有真理沒有愛，是一把刀；有愛沒有真理，是一團霧。長老在問安裡就把兩隻手牽在一起。321 說讓耶穌得榮耀：兩個 παρὰ（para） 並列，問安的第一句就把子放在父的旁邊。</p><p>還要留意長老把自己放在哪裡：「必常與我們同在」。他不是站在恩典的供應端，把恩惠分給收信的人；他和他們一起站在領受的那一邊。一個要求別人守門的人，先承認自己同樣需要憐憫。321 說無己：連問安，長老都把自己包含進去。</p>"},{"a":4,"z":4,"star":1,"grk":"<p lang=\"grc\">Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.</p>","lit":"<p>我非常歡喜，因為我找到你的兒女中有在真理中行走的，正如我們從父那裡領受了命令。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐχάρην λίαν</td><td>Echarēn lian</td><td>我非常歡喜</td><td>追蹤四第一站：與 10 節 χαίρειν、12 節 χαρὰ 同字根</td></tr><tr><td>εὕρηκα</td><td>heurēka</td><td>我找到了</td><td>完成式：遇見了，至今記得</td></tr><tr><td>ἐκ τῶν τέκνων σου</td><td>ek tōn teknōn sou</td><td>從你的兒女中</td><td>◆ 部分詞：「你的兒女中有些」</td></tr><tr><td>περιπατοῦντας ἐν ἀληθείᾳ</td><td>peripatountas en alētheia</td><td>在真理中行走的</td><td>追蹤一第四站：真理是走出來的</td></tr><tr><td>καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός</td><td>kathōs entolēn elabomen para tou patros</td><td>正如我們從父領受了命令</td><td>追蹤二：命令從父來</td></tr></table>","gram":"<p><strong>ἐκ τῶν τέκνων σου（ek tōn teknōn sou） 是部分詞。</strong>ἐκ（ek） 加屬格，意思是「你的兒女中有些」，不是「你所有的兒女」。這個「有些」怎麼讀，有兩派：①只有部分兒女遵行真理，暗示有人已經被迷惑，正好接上 7 節；②長老只是說他自己遇見的那幾位，沒有暗示其他人不好。經文本身沒有說其餘的兒女怎樣了。本講義兩讀並陳，講台不由這一個介系詞推論「其他兒女都離開了」。</p><p>Ἐχάρην（Echarēn） 是不定過去式，λίαν（lian）「非常」加重語氣。χαίρω（chairō） 這個字根要記住：10 節的「問安」χαίρειν（chairein）、12 節的「喜樂」χαρὰ（chara） 都是它。εὕρηκα（heurēka） 是完成式，「我發現了」，遇見的那一刻到今天還在長老心裡。περιπατοῦντας（peripatountas） 是現在分詞，「行走」是持續的生活樣式，不是一次的表現。καθὼς（kathōs） 一句說明真理的方向：這條路是「從父」領受的命令。</p>","exp":"<p>「我見你的兒女，有照我們從父所受之命令遵行真理的，就甚歡喜」（1:4）。長老一生見過許多事，最讓他歡喜的，不是教會的規模，是看見年輕的一代在真理中行走。在另一封信裡他說得更直接：「我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的」（約參 1:4）。</p><p>「遵行」原文是「行走」。真理不只是在心裡相信的，是用腳走出來的：怎樣說話，怎樣做生意，怎樣對待家人，怎樣在沒人看見的時候做選擇。1:2 說真理住進來，1:4 說真理走出去。住在裡面的，總會在路上被看見。</p><p>這一節很容易被讀成一張成績單：兒女遵行真理的父母得高分，兒女還沒信主、或離開了信仰的父母不及格。經文沒有這樣說。這是長老的歡喜，不是父母的成績單。ἐκ（ek） 那個「有些」只說長老遇見了一些；其餘的兒女怎樣，經文沒有說，我們也不替經文補上。長老沒有一句責備母親的話。</p><p>為兒女的信仰流淚的父母，可以從這一節得著安慰，而不是定罪。信仰不是父母遺傳給兒女的，是神親自找到人。父母能做的，是愛、是活出來、是代禱，然後把孩子交在那位「從父」賜下命令、也親自尋找人的神手裡。今天還沒有走在真理中的孩子，不是故事的結尾。長老的歡喜是一個盼望：總有一天，你也會聽見那個消息。</p><p>這一節也讓我們看見：信仰在家裡傳承，靠的是「行走」，不是訓話。孩子先看見的是父母怎樣走路：怎樣面對失敗，怎樣說對不起，怎樣在困難裡仍然禱告。長老在兒女身上看見的「行走」，多半也是從那個家的日常裡學來的。可是同一個家的孩子，仍會走出不同的路；父母的忠心不能保證結果，結果在神手裡。</p><p>長老說「我見」，原文是「我找到了」。他不是去查帳，是在路上遇見。也許是哪一位年輕人來到以弗所，也許是在別處的聚會裡碰見，長老一看就認出：這是那一家的孩子，他走在真理裡。屬靈長輩的眼睛，最該留意的不是誰還沒做到，是誰已經在走。看見了，就說出來；說出來，就是祝福。</p><p>321 的 235，「3」是屬靈的父母兒女。屬靈父母的喜樂，在兒女走在真理裡；他們的重擔，在還沒走上這條路的兒女身上，那就交給禱告。</p>"},{"a":5,"z":6,"star":3,"grk":"<p lang=\"grc\">καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν καινὴν γράφων σοι ἀλλὰ ἣν εἴχομεν ἀπʼ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.</p><p lang=\"grc\">καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ἡ ἐντολή ἐστιν, καθὼς ἠκούσατε ἀπʼ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.</p>","lit":"<p>現在我求你，女主人，不是像寫一條新命令給你，乃是我們從起初就有的那一條：好叫我們彼此相愛。</p><p>這就是愛：好叫我們照著他的命令行走；這就是那命令，正如你們從起初所聽見的：好叫你們在其中行走。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐρωτῶ σε</td><td>erōtō se</td><td>我求你</td><td>請求、懇求的字，不是發令</td></tr><tr><td>οὐχ ὡς ἐντολὴν καινὴν</td><td>ouch hōs entolēn kainēn</td><td>不是像一條新命令</td><td>這使我們想起約 13:34</td></tr><tr><td>ἀπʼ ἀρχῆς</td><td>ap' archēs</td><td>從起初</td><td>5、6 節各一次：真理不是越新越好</td></tr><tr><td>ἵνα ἀγαπῶμεν ἀλλήλους</td><td>hina agapōmen allēlous</td><td>好叫我們彼此相愛</td><td>「我們」：長老也在裡面</td></tr><tr><td>αὕτη ἐστὶν ἡ ἀγάπη</td><td>hautē estin hē agapē</td><td>這就是愛</td><td>◆ 第一個 αὕτη：愛＝照命令行</td></tr><tr><td>αὕτη ἡ ἐντολή ἐστιν</td><td>hautē hē entolē estin</td><td>這就是那命令</td><td>◆ 第二個 αὕτη：命令＝在其中行</td></tr><tr><td>ἐν αὐτῇ περιπατῆτε</td><td>en autē peripatēte</td><td>你們在其中行走</td><td>αὐτῇ 陰性：指愛，還是命令？</td></tr></table>","gram":"<p><strong>ἐρωτῶ（erōtō） 不是發號施令。</strong>ἐρωτάω（erōtaō） 原意是「問」，在新約也常作「請求、懇求」（約 14:16 主向父「求」用的就是它）；保羅勸人時多用 παρακαλῶ（parakalō）。有人認為 ἐρωτάω（erōtaō） 帶著親近、平等的語氣，這個分別不宜說死，但它確實是請求，不是發令。長老有資格下命令，卻選了一個請求的字，然後再一次稱她 κυρία（kyria）。他要求的事也不新：οὐχ ὡς ἐντολὴν καινὴν（ouch hōs entolēn kainēn），「不是一條新命令」，而是 ἣν εἴχομεν ἀπʼ ἀρχῆς（hēn eichomen ap' archēs），「我們從起初就有的那一條」。ἀπʼ ἀρχῆς（ap' archēs） 在 5、6 節各出現一次，正好對著 9 節那些「走在前頭」的人：真理的價值不在它多新。</p><p><strong>1:6 的兩個 αὕτη（hautē） 互為鏡像。</strong></p><blockquote><p>αὕτη ἐστὶν ἡ ἀγάπη（hautē estin hē agapē）, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ（hina peripatōmen kata tas entolas autou）——這就是愛：照他的命令（複數）行。<br>αὕτη ἡ ἐντολή ἐστιν（hautē hē entolē estin）……ἵνα ἐν αὐτῇ περιπατῆτε（hina en autē peripatēte）——這就是那命令（單數）：在它裡面行。</p></blockquote><p>第一句用命令定義愛，第二句用愛定義命令。問題在 ἐν αὐτῇ（en autē）：αὐτῇ（autē） 是陰性，ἀγάπη（agapē） 與 ἐντολή（entolē） 兩個名詞都是陰性，文法上兩者都可以。①指「愛」：命令就是叫你們在愛中行，多數解經家這樣讀；②指「命令」：你們要照這命令行，和合本「所聽見當行的，就是這命令」意譯了這一句，較接近②。本講義認為兩讀殊途同歸：這一節故意把愛與命令綁成一個結，從哪一頭拉，另一頭都跟著動。愛被命令定義，命令被愛定義。複數的「命令」收在單數的「那命令」裡：許多條誡命，總歸一條愛。</p><p>◆ RP 第二句詞序作 ἐστιν ἡ ἐντολή（estin hē entolē），不影響意思。</p>","exp":"<p>〔約壹〕約壹 5:2--3（約翰一書講義第 5 章）</p><p>「太太啊，我現在勸你，我們大家要彼此相愛。這並不是我寫一條新命令給你，乃是我們從起初所受的命令」（1:5）。主在最後的晚餐說：「我賜給你們一條新命令，乃是叫你們彼此相愛」（約 13:34），本系列約翰福音講義第 13 章講過這一句。到長老寫信的時候，這條「新命令」已經成了「從起初」的命令。它沒有過期，只是不再是新聞；約翰一書說得更妙：「不是一條新命令，乃是你們從起初所受的舊命令」（約壹 2:7），下一節又說它是新的。舊，是因為從起初就有；新，是因為每一天都要重新活一次。</p><p>長老說「我們大家」，把自己也放進去。他不是站在台上要台下的人相愛，是和他們一起被這條命令管著。這是請求，不是訓話。</p><p>「我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令」（1:6）。這是全卷的樞紐。我們常以為愛是一種感覺，命令是一種限制，兩者天生互相拉扯。長老把它們綁在一起：愛有形狀，就是照祂的命令行；命令有溫度，就是彼此相愛。約翰一書說：「我們遵守神的誡命，這就是愛他了」（約壹 5:3）。</p><p>這一節是 7 節以後一切警告的地基。7 節一開頭就是「因為」：為甚麼要照命令行？因為有迷惑人的出來。所以後面的守門不是愛的反面，是愛的延伸。一份沒有形狀的愛，擋不住任何東西，最後連所愛的人都保護不了；一套沒有溫度的命令，守得再嚴，也只是一堵牆，牆裡的人彼此冷淡。真理與愛不能只用一隻手。</p><p>「行」這個字在 4 節與 6 節出現三次：在真理中行，照命令行，在其中行。約翰不把信仰描寫成一個站著不動的立場，而是一條每天要走的路。愛也一樣，它不是一次的宣告，是一步一步的行走：今天怎樣對待那位難相處的弟兄，明天怎樣回應那位總是遲到的同工。命令告訴我們往哪裡走，愛使我們走得下去。</p><p>這也解釋了長老為甚麼用「求」而不用「命令」。一條叫人相愛的命令，若用壓的方式頒布，本身就自相矛盾。長老用請求的語氣傳一條命令，命令的內容與傳達的方式就合而為一了。</p><p>講真理的時候要看見人，講愛的時候要講到「照他的命令行」。這是本卷的底線，也是這一節的意思。321 說 920：「我們大家」裡，沒有一個人被留在外面；每一個人也都被同一條命令管著，包括寫信的長老。</p>"},{"a":7,"z":7,"star":1,"grk":"<p lang=\"grc\">ὅτι πολλοὶ πλάνοι ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.</p>","lit":"<p>因為許多迷惑人的出到世界上去了，就是那些不承認耶穌基督在肉身中來的；這就是那迷惑人的，也就是那敵基督。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὅτι</td><td>hoti</td><td>因為</td><td>接回 6 節：警告是愛的延伸</td></tr><tr><td>πολλοὶ πλάνοι ἐξῆλθον</td><td>polloi planoi exēlthon</td><td>許多迷惑人的出去了</td><td>◆ 經文鑑別：RP 作 εἰσῆλθον「進入」</td></tr><tr><td>οἱ μὴ ὁμολογοῦντες</td><td>hoi mē homologountes</td><td>那些不承認的</td><td>ὁμολογέω：說一樣的話、公開承認</td></tr><tr><td>Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί</td><td>Iēsoun Christon erchomenon en sarki</td><td>耶穌基督在肉身中來</td><td>◆ 現在分詞；約壹 4:2 用完成式</td></tr><tr><td>ὁ πλάνος καὶ ὁ ἀντίχριστος</td><td>ho planos kai ho antichristos</td><td>那迷惑人的、那敵基督</td><td>單數帶冠詞：指一類人</td></tr></table>","gram":"<p><strong>ὅτι（hoti） 把 7 節綁回 6 節。</strong>為甚麼要照命令行、在愛中行？因為有許多 πλάνοι（planoi） 出來了。πλάνος（planos） 是「使人走錯路的」，與 4、6 節的「行走」περιπατέω（peripateō） 正好成對：一邊在真理中走，一邊把人帶離那條路。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 ἐξῆλθον（exēlthon）「出去了」，和合本「出來」照這個讀法；RP 作 εἰσῆλθον（eisēlthon）「進入」世界。ἐξῆλθον（exēlthon） 與約壹 2:19「他們從我們中間出去」、約壹 4:1「已經出來了」用同一個動詞，較合約翰的用語；εἰσῆλθον（eisēlthon） 可能是抄寫者因為後面的 εἰς τὸν κόσμον（eis ton kosmon） 而改。本講義從 SBLGNT 與和合本。</p></blockquote><p><strong>ἐρχόμενον（erchomenon） 是現在分詞。</strong>約壹 4:2 說同一件事用的是完成式分詞 ἐληλυθότα（elēlythota），「已經來了」。這裡的現在分詞有三種讀法：①指道成肉身，現在分詞強調「在肉身中來的這一位」是持續的身分，祂成了肉身，至今仍是那一位，多數解經家這樣讀；②指將來在肉身中再來，少數學者主張；③當作無時間性的稱號，「那在肉身中來者」。本講義從①，並陳②③。οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος（houtos estin ho planos kai ho antichristos） 是單數帶冠詞，意思不是指某一個特定人物，而是「這種人，就是那迷惑人的、那敵基督的」：凡這樣否認的，都屬於那一類。ἀντίχριστος（antichristos） 一字，新約只出現在約翰書信（約壹 2:18、22；4:3；約貳 7）。</p>","exp":"<p>〔約壹〕約壹 4:1--3（約翰一書講義第 4 章）</p><p>「因為世上有許多迷惑人的出來，他們不認耶穌基督是成了肉身來的；這就是那迷惑人、敵基督的」（1:7）。全卷地勢在這裡掉進最深的谷。長老不是在談一般的錯誤，是在談那個最核心的問題：耶穌基督是誰。</p><p>這些人不是從外面打進來的。約翰一書說：「他們從我們中間出去」（約壹 2:19）。他們曾經坐在同一張桌子邊，現在要挨家挨戶，以巡迴教師的身分被人接待。經文沒有點出他們屬哪一派；從 7 節看，他們否認的核心是神的兒子真的穿上了會累、會餓、會流血的肉身。他們很可能不否認耶穌，也不否認有一位基督，卻不肯承認兩者是同一位、成了肉身的那一位。</p><p>分辨的標準在這裡寫得清清楚楚，是基督論：「凡靈認耶穌基督是成了肉身來的，就是出於神的」（約壹 4:2）。不是政治立場，不是國籍，不是宗派，也不是誰的講道風格我們不喜歡。這一節不給人拿去把「敵基督」貼在任何政治人物、國家、宗派或群體身上，也不給人拿去算日子。貼標籤從來很容易：連主耶穌都被祭司長叫作「那誘惑人的」（太 27:63），用的正是 πλάνος（planos） 這個字。</p><p>為甚麼「成了肉身」這麼要緊？因為救恩就在肉身裡成就。一位沒有真的成為人的基督，不能真的替人受死；一位沒有真的受死的基督，也沒有真的復活。否認肉身，看起來只是把基督講得更屬靈、更高超，其實是把十字架抽空。迷惑人的往往不是把基督講得太低，是講得太「高」，高到不必碰觸人的血肉與苦難。長老要守的，正是那一位真的來到我們中間的主。</p><p>長老說「許多」，卻沒有點任何一個人的名。他給的是一把尺，不是一份名單。尺可以量每一個來敲門的教師，也可以量我們自己的講台；名單卻只會讓人忙著指認別人。這把尺很短，只量一件事：你所傳的耶穌基督，是不是那一位成了肉身來的。</p><p>這一節的重心不在敵人有多少，在我們所信的是誰。一位真的來過、有血有肉的基督，就是信仰的中心。321 說耶穌是我的榜樣：榜樣不是一個理念，是一位真的成了肉身、走過這條路的人。若祂沒有真的來，我們就只剩一套理想；祂真的來了，所以我們有一位可以跟隨的主。</p>"},{"a":8,"z":9,"star":3,"grk":"<p lang=\"grc\">βλέπετε ἑαυτούς, ἵνα μὴ ἀπολέσητε ἃ εἰργασάμεθα ἀλλὰ μισθὸν πλήρη ἀπολάβητε</p><p lang=\"grc\">πᾶς ὁ προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.</p>","lit":"<p>你們要看顧自己，好叫你們不失去我們所做成的，乃要得著完滿的工價。</p><p>凡走在前頭、不住在基督的教訓裡的，就沒有神；那住在這教訓裡的，這人就有父，也有子。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>βλέπετε ἑαυτούς</td><td>blepete heautous</td><td>看顧你們自己</td><td>先看自己，不是先看別人</td></tr><tr><td>ἃ εἰργασάμεθα</td><td>ha eirgasametha</td><td>我們所做成的</td><td>◆ 經文鑑別：和合本「你們所做的」</td></tr><tr><td>μισθὸν πλήρη ἀπολάβητε</td><td>misthon plērē apolabēte</td><td>得著完滿的工價</td><td>μισθός：工價、賞賜；不是救恩</td></tr><tr><td>ὁ προάγων καὶ μὴ μένων</td><td>ho proagōn kai mē menōn</td><td>那走在前頭、不住下的</td><td>◆ 經文鑑別：RP 作 παραβαίνων「越過」</td></tr><tr><td>ἐν τῇ διδαχῇ τοῦ Χριστοῦ</td><td>en tē didachē tou Christou</td><td>在基督的教訓裡</td><td>◆ 屬格：關於基督的／基督所教的</td></tr><tr><td>θεὸν οὐκ ἔχει</td><td>theon ouk echei</td><td>就沒有神</td><td>自以為得著更多，其實一無所有</td></tr><tr><td>καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει</td><td>kai ton patera kai ton huion echei</td><td>就有父，也有子</td><td>追蹤三的翻轉：住得穩的擁有一切</td></tr></table>","gram":"<p><strong>1:8 的經文鑑別。</strong></p><blockquote><p>◆ SBLGNT 作 ἵνα μὴ ἀπολέσητε ἃ εἰργασάμεθα（hina mē apolesēte ha eirgasametha），「你們不要失去我們所做成的」，意思是不要讓長老和同工們在你們身上的勞苦落空；Treg 與 NIV 作 εἰργάσασθε（eirgasasthe），「你們所做的」，和合本正文「你們所做的工」照這個讀法，和合本註腳：有古卷：我們。RP 把三個動詞都改成第一人稱：ἀπολέσωμεν（apolesōmen）……εἰργασάμεθα（eirgasametha）……ἀπολάβωμεν（apolabōmen）。「我們」夾在兩個「你們」中間，是較難、也較不整齊的讀法，抄寫者容易把它改齊；這常被視為取「我們」的理由。兩讀意思相近：都在談工作的成果與賞賜。本講義原文從 SBLGNT，講台照和合本讀。</p></blockquote><p>μισθός（misthos） 是工價、賞賜；πλήρη（plērē） 是「完滿的」。<strong>這一節講的是賞賜，不是得救。</strong>救恩是白白賜下的，不是工價；賞賜是工作的成果。保羅也作同樣的分別：「人在那根基上所建造的工程若存得住，他就要得賞賜」（林前 3:14），工程被燒了，「自己卻要得救」（林前 3:15）。</p><p><strong>1:9 的經文鑑別與文法。</strong>SBLGNT、WH、Treg、NA28 作 προάγων（proagōn），「走在前頭、往前帶」；RP 作 παραβαίνων（parabainōn），「越過、犯界」。和合本「越過」兩讀都容得下。προάγων（proagōn） 很可能帶著諷刺：那些人自稱進步、走在前面，超越了使徒的教導。一個冠詞 ὁ（ho） 管兩個分詞 προάγων καὶ μὴ μένων（proagōn kai mē menōn）：走在前頭與不住下，是同一群人、同一個動作的兩面，往前跨一步，就是離開了原地。</p><p>τοῦ Χριστοῦ（tou Christou） 的屬格有兩讀：受詞屬格「關於基督的教訓」，主詞屬格「基督所教導的教訓」。在約翰的著作裡，基督所教的正是關於祂自己是誰，兩者互相包含，本講義並取。RP 在後半句第二個 διδαχῇ（didachē） 之後也加上 τοῦ Χριστοῦ（tou Christou），意思不變。</p>","exp":"<p>〔約壹〕約壹 2:22--24（約翰一書講義第 2 章）</p><p>「你們要小心，不要失去你們所做的工，乃要得著滿足的賞賜」（1:8）。長老的第一個提醒，不是叫他們去看門外的人，是看自己：βλέπετε ἑαυτούς（blepete heautous）。主在橄欖山上說過：「但你們要謹慎」（可 13:9），用的是同一個字。守門之前先守心。</p><p>這一節不是在製造失去救恩的恐懼。長老擔心的是工作的成果：長老和同工們的勞苦、這家人多年的服事、在真理中養大的兒女，不要因為接了錯的人而被拆掉。救恩建立在基督已經完成的工作上，不是建立在我們的表現上；本系列約翰一書講義的全卷立場「罪與確據」講過，確據落在基督身上。也不要把這一節讀成用工作去換賞賜：賞賜是主的恩典加在忠心之上，不是交易。</p><p>「凡越過基督的教訓不常守著的，就沒有神；常守這教訓的，就有父又有子」（1:9）。地勢在 7、8 節的谷底之後，又升起一座高峰。那些人說自己走在前面，看得更遠、懂得更多。長老的判斷很冷靜：往前走過了基督，不是多得了甚麼，而是「就沒有神」。約翰一書說：「凡不認子的，就沒有父；認子的，連父也有了」（約壹 2:23）。</p><p>這裡的「越過」要讀準。越過的是基督論的核心：父與子，道成肉身。越過不是提問。問問題不是越過，研究、查考、聖經學的進展、不同的解經意見，都不是越過；離開基督才是。本書信沒有叫人停止思考，它叫人不要把基督丟在後頭。同樣，也沒有任何人可以拿「我守住了純正教訓」來壟斷屬靈權柄、壓住別人的追問。守住的是基督，不是某個人的立場。</p><p>「常守」也不是原地不動。住在一間房子裡的人，天天在裡面生活、整理、修補、接待客人；住在基督的教訓裡，也是天天在裡面長大，越認識越深。往下扎根和往前越過，是兩個不同的方向：前者在基督裡越走越深，後者走出了基督。</p><p>「就沒有神」這句話很重。那些人並沒有說自己不信神，他們大概自認為比別人更懂神。長老的判斷是：一個人對神的認識若跨過了子，他手裡剩下的就不是神，只是自己對神的想像。神是藉著子被認識的，沒有一條繞過基督、更直接的路。這是約翰福音的老信息，在這封短信裡被縮成一句話。</p><p>本節的焦點也不在長老的辨識力，在「有父又有子」的那一位。不是走得最遠的擁有最多，是住得最穩的擁有一切。μένων（menōn）「常守」與 1:2「存在我們裡面」是同一個字：真理先住進來，我們就在祂裡面住下。</p><p>321 說謙卑，回到本位：驕傲最愛穿「進步」的衣服，站到基督前面去定義神；謙卑是留在祂的教訓裡，不搶在祂前頭。讓耶穌作王，守住基督，就有了一切。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·</p><p lang=\"grc\">ὁ λέγων γὰρ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.</p>","lit":"<p>若有人到你們那裡，卻不帶著這教訓來，不要接他進家裡，也不要對他說「願你喜樂」；</p><p>因為那對他說「願你喜樂」的，就在他那些惡的工作上有分。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἴ τις ἔρχεται πρὸς ὑμᾶς</td><td>ei tis erchetai pros hymas</td><td>若有人到你們那裡來</td><td>現在式：正在來的巡迴教師</td></tr><tr><td>ταύτην τὴν διδαχὴν οὐ φέρει</td><td>tautēn tēn didachēn ou pherei</td><td>不帶著這教訓</td><td>「這教訓」＝9 節基督的教訓</td></tr><tr><td>μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν</td><td>mē lambanete auton eis oikian</td><td>不要接他進家裡</td><td>◆ 家庭教會：給他講台與住處</td></tr><tr><td>χαίρειν αὐτῷ μὴ λέγετε</td><td>chairein autō mē legete</td><td>不要對他說「願你喜樂」</td><td>◆ 追蹤四：公開的祝福與背書</td></tr><tr><td>κοινωνεῖ</td><td>koinōnei</td><td>有分、成為夥伴</td><td>與 κοινωνία「相交」同字根</td></tr><tr><td>τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς</td><td>tois ergois autou tois ponērois</td><td>在他那些惡的工作上</td><td>工作：他出去傳的那一套</td></tr></table>","gram":"<p><strong>先看門外是誰。</strong>εἴ τις ἔρχεται πρὸς ὑμᾶς（ei tis erchetai pros hymas）：ἔρχεται（erchetai） 是現在式，一個正在路上、往這家走來的人；ὑμᾶς（hymas） 是複數，面對他的是整個聚會。他的特徵是 ταύτην τὴν διδαχὴν οὐ φέρει（tautēn tēn didachēn ou pherei），φέρει（pherei） 是「帶來」：巡迴教師帶著信息進門。所以這人不是一個路過的鄰居，是 7、9 節定義的那種教師，不認耶穌基督是成了肉身來的，帶著另一個基督要人接待。</p><p><strong>μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν（mē lambanete auton eis oikian） 的處境是家庭教會。</strong>第一世紀沒有給基督徒住的旅店文化，福音靠巡迴傳道人一家一家傳開；他們吃住在信徒家，在那家的聚會裡講道，離開時帶著盤纏與推薦信上路（這使我們想起約參 1:6）。所以 οἰκίαν（oikian） 不只是一棟房子，很可能就是聚會的家：把他接進來，就是給他講台。早期的《十二使徒遺訓》第 11 章已經在為接待立規矩：凡來的使徒要接待，只住一天，必要時兩天，住到第三天就是假先知。</p><p><strong>χαίρειν（chairein） 問安，字面是「願你喜樂」。</strong>這是希臘人見面與寫信時的問候語，使徒會議的信就用它開頭（徒 15:23）。在這裡它不是街上點個頭，是當著會眾的面祝福、接納、送行，等於背書。這個字與 4 節「歡喜」、12 節「喜樂」同字根：長老要把喜樂留給真理，不給那位否認基督的教師。</p><p><strong>κοινωνεῖ（koinōnei） 解釋了理由。</strong>1:11 用 γὰρ（gar） 接上：問他安的，「就在他的惡行上有分」。κοινωνέω（koinōneō） 與 κοινωνία（koinōnia）「相交」同字根，接待等於成為同工、成為夥伴。約翰三書用正面說同一件事：接待為主名出外的人，「叫我們與他們一同為真理做工」（約參 1:8）。接待從來不是中立的，尤其接的是一位要在聚會裡講道的教師。</p>","exp":"<p>「若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安」（1:10）。這是全卷最容易講錯的兩節，要先把對象講清楚。</p><p>所禁的是：給一位否認耶穌基督成了肉身、出去傳揚另一個基督的教師平台、講台、住處、推薦與公開背書。不是叫我們冷落還沒信主的家人，也不是叫我們不理慕道朋友、離開了教會的弟兄姊妹、別的宗教的人，或信念不同的鄰居同事。對這些人，主耶穌給的榜樣正好相反：法利賽人議論祂說：「這個人接待罪人，又同他們吃飯」（路 15:2）。同一張餐桌，主開給罪人；長老關上的，是講台。</p><p>這一點，約翰三書替我們作了最好的註腳。同一位長老，在另一封信裡要人開門：「所以我們應該接待這樣的人，叫我們與他們一同為真理做工」（約參 1:8）；他也責備那位「不接待我們」（約參 1:9）的丟特腓，連接待弟兄的人都被他趕出教會。二書叫人關門，三書叫人開門。標準不是認不認識、喜不喜歡、是不是同一個宗派，是這人傳的是不是基督。</p><p>「因為問他安的，就在他的惡行上有分」（1:11）。家門開給誰，就是和誰一起做工。今天落在哪裡？不邀這樣的教師上講台，不在小組裡推他的課程，不替他轉發募款，不以教會的名義為他背書。這是對所愛的那一家負責：羊圈的門若誰都能進，羊就保不住。</p><p>守門也有它的心腸。7 節說得清楚，這是愛的延伸，不是愛的反面；1:3 的憐憫仍然在問安裡。守門的人不靠自己的眼力驕傲，是因為所愛的那位「有父又有子」的主，值得被完整地傳講。一扇門若只會關，那家很快就沒有客人；若只會開，那家很快就沒有了真理。長老兩封短信放在一起，門才是一扇真正的門。</p><p>今天的「家」也不只是一棟房子。一個小組的聊天群組、一個教會的網站、一場線上聚會的邀請名單、一則被轉發的課程連結，都可能是今天的「接到家裡」。分辨的問題沒有變：我們把誰放到會眾面前，替誰的信息蓋上教會的印？這需要智慧，也需要謙卑，最好由教會的同工一起判斷，而不是一個人憑印象下結論。</p><p>還有一層要說清楚：這兩節談的是一個家庭教會對一位巡迴教師的接待，不是一個人在街上、在辦公室、在家族聚會裡對另一個人的態度。在那些地方，我們向所有人說平安，請鄰居吃飯，陪同事走過難關，在餐桌上和不信的家人同歡同哭。這一切 10 節都沒有禁止。若有人用這一節叫人冷落家人，就把長老的一扇講台的門，誤讀成了一堵封住人的牆。</p><p>321 說建立屬神的體系：體系是家與家之間的網絡，它的考驗就在門口，接待誰，祝福誰，替誰背書。</p>"},{"a":12,"z":13,"star":2,"grk":"<p lang=\"grc\">Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ .</p><p lang=\"grc\">Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ἐκλεκτῆς</p>","lit":"<p>我有許多事要寫給你們，卻不願意藉著紙和墨；乃是盼望到你們那裡，口對口地說話，好叫你們的喜樂得以充滿。</p><p>你那蒙揀選的姊妹的兒女問候你。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὰ χάρτου καὶ μέλανος</td><td>dia chartou kai melanos</td><td>藉著紙和墨</td><td>χάρτης：一張莎草紙，新約只在這裡</td></tr><tr><td>ἐλπίζω γενέσθαι πρὸς ὑμᾶς</td><td>elpizō genesthai pros hymas</td><td>我盼望到你們那裡</td><td>◆ RP 作 ἐλθεῖν</td></tr><tr><td>στόμα πρὸς στόμα λαλῆσαι</td><td>stoma pros stoma lalēsai</td><td>口對口地說話</td><td>◆ 和合本「當面談論」</td></tr><tr><td>ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ</td><td>hina hē chara hymōn peplērōmenē ē</td><td>好叫你們的喜樂得以充滿</td><td>◆ NA28、RP 作 ἡμῶν；追蹤四終點</td></tr><tr><td>τῆς ἀδελφῆς σου τῆς ἐκλεκτῆς</td><td>tēs adelphēs sou tēs eklektēs</td><td>你那蒙揀選的姊妹</td><td>姊妹本人沒有問安</td></tr></table>","gram":"<p><strong>紙和墨。</strong>χάρτου（chartou） 的字典形是 χάρτης（chartēs），一張莎草紙，新約只在這裡出現。學者常指出，這封信的長度大約剛好寫滿一張常見尺寸的莎草紙。μέλανος（melanos） 是墨，約參 1:13 也用了（和合本作「筆墨」），保羅也說哥林多人是基督的信，「不是用墨寫的，乃是用永生神的靈寫的」（林後 3:3）。和合本「寫出來」三個字是小字補字，原文沒有。</p><p><strong>στόμα πρὸς στόμα（stoma pros stoma） 直譯「口對口」</strong>，和合本譯作「當面談論」。這使我們想起民 12:8 神論摩西說：「我要與他面對面說話」（民 12:8），七十士譯本那裡正作 στόμα κατὰ στόμα（stoma kata stoma），口對口。那是神與摩西之間最親近的說話方式。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg 作 ἡ χαρὰ ὑμῶν（hē chara hymōn），「你們的喜樂」，和合本照這個讀法；NA28 與 RP 作 ἡμῶν（hēmōn），「我們的喜樂」。兩字在當時發音幾乎一樣，抄寫時極易互換；約壹 1:4 也有「我們／你們」的異文。兩讀都美：喜樂是見面雙方一起的。本講義從 SBLGNT 與和合本。另外 SBLGNT 作 γενέσθαι πρὸς ὑμᾶς（genesthai pros hymas）「來到你們那裡」，RP 作 ἐλθεῖν（elthein），意思相同。</p></blockquote><p>πεπληρωμένη ᾖ（peplērōmenē ē） 是完成式被動分詞加假設語氣：喜樂被充滿，而且保持在充滿的狀態。被動語態提醒我們：喜樂是被賜下、被充滿的，不是自己擠出來的。</p><p><strong>1:13 的 ἐκλεκτῆς（eklektēs）。</strong>問安的是「姊妹」τῆς ἀδελφῆς（tēs adelphēs） 的兒女，姊妹本人沒有出聲。若這是一位婦人，她為甚麼不問安？若這是一間姊妹教會，就很自然：會眾向會眾問安。這是 1:1 教會讀法的理由之一。σε（se） 又回到單數，首尾都以那位「太太」為對象。◆ RP 句末加 Ἀμήν（Amēn），SBLGNT 與和合本都沒有「阿們」。</p>","exp":"<p>「我還有許多事要寫給你們，卻不願意用紙墨寫出來，但盼望到你們那裡，與你們當面談論，使你們的喜樂滿足」（1:12）。全卷地勢最高的一點在這裡，不在 9 節的辯論，在 12 節的見面。</p><p>長老還有許多話。他知道有些事寫不清楚：一句警告在紙上可能顯得冷，當面說卻能帶著眼淚；一個難處寫在信裡可能被誤會，面對面就能一邊說一邊看見對方的臉。所以他把剩下的話留給見面。在約翰三書他也這樣說：「但盼望快快地見你，我們就當面談論」（約參 1:14）。</p><p>可是這一節不能拿來貶低線上團契、遠距牧養，或因病、因工作、因距離不能到場的弟兄姊妹。長老自己正在用紙墨傳真理：這封信本身就是一份遠距事工，把 1 到 11 節的真理一字不漏地送到那家去。紙墨是橋，不是次等；它把真理送到，也把盼望送到。「當面」是盼望與邀請，不是門檻。沒能到場的人，沒有因此少得了真理，也沒有被關在喜樂外面。這一節對國度321空中團契特別親切：線上把真理送到，見面使喜樂滿足，兩者都是同一份愛。</p><p>「使你們的喜樂滿足」這句話，把全卷的「喜樂」一條線收起來了。4 節長老「甚歡喜」，10 至 11 節不要對否認基督的人說「願你喜樂」，到 12 節，喜樂要被充滿。約翰一書的開頭也說：「使你們的喜樂充足」（約壹 1:4）；主也說要「叫你們的喜樂可以滿足」（約 16:24）。中文讀不出這幾個字的連結，原文卻是一條線：守門不是終點，見面才是；守住的喜樂，最後要在相見時滿出來。</p><p>也要留意這份喜樂是誰的。和合本照 SBLGNT 讀「你們的喜樂」，另一讀是「我們的喜樂」。長老盼望見面，不是為了自己被歡迎，是為了那一家的喜樂被充滿；可是另一讀也提醒我們，牧養從來不是單向的：去看人的人，自己也被看見的那一刻充滿了。真理把兩邊連起來，喜樂在兩邊同時滿出來。</p><p>「你那蒙揀選之姊妹的兒女都問你安」（1:13）。信的最後一句，又回到家與家之間。這一家蒙揀選，那一家也蒙揀選；兩家的兒女彼此問安。前面不給迷惑人的那句「願你喜樂」，在這裡毫不吝嗇地給了弟兄姊妹。</p><p>「口對口」這個說法也值得多停一下。民數記用它描寫神與摩西的親密，長老用它描寫自己與這一家的盼望。他不是要去開會、去審查，是要去說話，而且是近到可以看見對方嘴唇的距離。全信前面有許多分辨與界線，最後落在這樣近的距離。守門，原來是為了有一天可以把門大大打開，讓所愛的人進來。</p><p>12 與 13 節也讓我們看見那一家的外面。長老在一處，收信的家在一處，那位「姊妹」的家又在另一處。三個地方，靠著信、靠著巡迴的弟兄、靠著問安連起來。這正是 10 節的門為甚麼要守：這張網是用真理織起來的，也只有真理能使它不破。網上的每一個家，都是另一個家的親人。</p><p>321 說人比事重要：事可以寫，人要見。用心靠聖靈：真理寫在紙上，喜樂要心對心。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《在真理和愛心上》"],["p","弟兄姊妹平安。今天，我想請你和我一起，停在一扇門前面，停久一點。"],["q","小亞細亞，一座城裡的窄巷，黃昏。"],["p","巷底一戶人家，今晚聚會，燈剛點上。"],["q","這時候，有人敲門。"],["p","門外是一個陌生人，穿著旅行斗篷，鞋上都是灰。"],["p","他口才很好，經文背得比誰都熟。"],["p","他說：你們聽的是起初的、淺的。我帶來比使徒更深的道。我走在前頭。"],["p","他只要一件事：今晚讓我在你們家講一講。"],["p","門內，一位姊妹站在門邊，手放在門閂上。"],["p","另一隻手，拿著長老剛寄到的信，墨跡還新。"],["q","畫面，就停在這裡。"],["p","門閂在她手上。信，也在她手上。"],["p","她要不要開門？"],["p","說要開，沒有錯。當時的客店名聲不好，傳道人多半住在信徒家裡，福音是靠一扇一扇打開的門傳開的。"],["p","說不開，也要想一想：同一扇門外，也可能站著一位為主名出外的弟兄，餓著肚子。"],["p","開錯了，羊被偷走。關錯了，弟兄餓著走。"],["p","她手裡那封信，正好就是為這一刻寫的。"],["p","信裡有三種人：寫信的長老，收信的太太和她的兒女，還有門外的人。"],["p","這一章有三個字：真，愛，守。"],["p","我們走三步：真理裡的愛；愛的形狀；為所愛的守門。"],["q","第一步：真理裡的愛。"],["q","「作長老的寫信給蒙揀選的太太和她的兒女，就是我誠心所愛的」（1:1）"],["p","「作長老的」，原文有冠詞：那位長老。不用報名字，收信的人都知道是誰。"],["p","「蒙揀選的太太」是誰？和合本的註腳說：太太，或譯：教會。"],["p","可能是一間教會，也可能是一位姊妹與她的家，也有人說是名字。"],["p","我們傾向教會的讀法，但不必裁判。也不拿這一節替女性事奉的任何立場背書或反對。"],["p","三種讀法說的是同一件事：一群被真理找到的人，被長老愛著。"],["p","請你聽那兩個字：誠心。原文是「在真理中」。"],["q","我在真理中所愛的。"],["p","這份愛是真誠的，也是在真理裡的。兩樣都要。"],["q","「不但我愛，也是一切知道真理之人所愛的。」（1:1）"],["p","這些人，彼此多半叫不出名字。我們分散在好幾個國家，許多人也從沒見過面。"],["p","是甚麼把素昧平生的人連成一家？不是血緣，不是同鄉，是同一個真理。"],["p","真理在這裡不是一道把人隔開的牆，是一條把人串起來的線。"],["p","說愛真理，卻只愛自己圈子的人，還沒讀懂這一節。"],["q","「愛你們是為真理的緣故，這真理存在我們裡面，也必永遠與我們同在。」（1:2）"],["p","「存在」，原文是住下來，和第九節「常守」同一個字。"],["p","次序很要緊。不是我們先抓住了真理，是真理先住進我們裡面。"],["p","「必永遠與我們同在」，這使我們想起主在樓上說的話："],["q","「叫他永遠與你們同在」（約 14:16）"],["p","主接著稱祂是真理的聖靈。真理住下來，就不走了。"],["q","「恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在！」（1:3）"],["p","保羅的問安，中文常譯作「願」。長老寫的是：必。這不是一句祝願，是一個應許。"],["p","而且是「與我們」。長老和大家一起站在領受的這一邊。"],["p","中間那個詞，憐憫，在約翰的著作裡只出現這一次。"],["q","一封要人守門的信，問安裡，先放了憐憫。"],["p","為甚麼？因為守門的人，最容易忘記自己也曾經走錯過路。"],["p","一個不記得自己是靠憐憫站立的人，守門很快就會變成審查。"],["p","再看：從父神，和他兒子耶穌基督。原文是兩個「從」，並排站著。"],["p","這一句，其實已經在回答門外那個人了。他說他有更深的道；可是恩典的源頭，是父，也是子。"],["q","在真理和愛心上。"],["p","這是今天的題目，也是這封信的兩隻手。"],["p","有真理沒有愛，是一把刀。有愛沒有真理，是一團霧。"],["q","「我見你的兒女，有照我們從父所受之命令遵行真理的，就甚歡喜。」（1:4）"],["p","「甚歡喜」。請你記住這個「喜」字，等一下它還會出現三次。"],["p","「我見」，原文是：我找到了。他不是去查帳，是在路上遇見。"],["p","「遵行」，原文是行走。真理不只是在心裡相信的，是用腳走出來的。"],["p","第二節，真理住進來。第四節，真理走出去。"],["p","原文那個「有」，意思是：你的兒女中有些。長老只說他遇見的；其餘的，經文沒有說。"],["p","可是長老沒有一句責備那位母親的話。"],["q","這是長老的歡喜，不是父母的成績單。"],["p","也許你的孩子還沒有信主，或者曾經信，後來走開了。"],["p","信仰不是父母遺傳給兒女的，是神親自去找人。"],["p","你能做的，是愛他，是活出來給他看，是為他代禱。結果，在神的手裡。"],["p","今天還沒有走在真理中的孩子，不是故事的結尾。"],["p","長老的歡喜，是留給你的盼望。總有一天，你也會聽見那個消息。"],["p","姊妹讀到這裡，抬頭看了一眼門。敲門聲，又響了一次。"],["p","長老愛這一家，這是確定的。可是愛，到底長甚麼樣子？"],["q","第二步：愛的形狀。"],["q","「太太啊，我現在勸你，我們大家要彼此相愛。」（1:5）"],["p","「勸」，原文是一個請求的字，不是發令。"],["p","長老有資格下命令。他選擇開口求。"],["p","還有「我們大家」。他把自己也放進去。"],["q","「這並不是我寫一條新命令給你，乃是我們從起初所受的命令。」（1:5）"],["p","這使我們想起主在最後的晚餐說的話："],["q","「我賜給你們一條新命令，乃是叫你們彼此相愛」（約 13:34）"],["p","舊，是因為從起初就有。新，是因為每一天都要重新活一次。"],["p","門外那個人說：我帶來比使徒更深、更新的道。"],["p","長老說：我沒有新的給你。我給你的，是從起初的。"],["p","「從起初」，在第五節、第六節各出現一次。真理不是越新越好。"],["q","「我們若照他的命令行，這就是愛。」（1:6）"],["p","我們常以為，愛是一種感覺，命令是一種限制，兩個天生就互相拉扯。"],["p","原文這一節有兩個「這就是」，像一面鏡子，照過來，又照過去。"],["p","這就是愛：照他的命令行。這就是命令：在其中行。"],["q","愛有形狀。它的形狀，就是照祂的命令行。"],["q","命令有溫度。它的溫度，就是彼此相愛。"],["q","「你們從起初所聽見當行的，就是這命令。」（1:6）"],["p","一份沒有形狀的愛，擋不住任何東西。到最後，連所愛的人都保護不了。"],["p","一套沒有溫度的命令，守得再嚴，也只是一堵牆。牆裡面的人，彼此冷淡。"],["p","有人以為，愛就是甚麼都點頭，甚麼都說好，誰來都可以。"],["p","那是一團霧。"],["p","也有人以為，只要說對就好，人的眼淚不重要。"],["p","那是一把刀。"],["p","長老兩樣都不要：講真理時看見人，講愛時講到照祂的命令行。"],["p","「行」字在四、六節出現三次。"],["p","信仰不是一個站著不動的立場，是一條每天要走的路。"],["p","命令告訴我們往哪裡走。愛，使我們走得下去。"],["p","好，愛有了形狀。可是下一句，長老的語氣變了。"],["p","第七節的第一個字是：因為。"],["q","第三步：為所愛的守門。"],["q","「因為世上有許多迷惑人的出來，他們不認耶穌基督是成了肉身來的」（1:7）"],["p","為甚麼要照命令行？因為有迷惑人的出來了。"],["p","所以接下來的提醒，不是愛的反面，是愛的延伸。"],["p","「迷惑人的」，原文是使人走錯路的人。"],["p","他們是從哪裡來的？約翰一書說："],["q","「他們從我們中間出去」（約壹 2:19）"],["p","他們曾坐在同一張桌邊，現在挨家挨戶敲門。"],["p","他否認甚麼？不認耶穌基督是成了肉身來的。"],["p","他也許很尊敬耶穌，可是他不接受，神的兒子真的穿上了會累、會餓、會流血的身體。"],["p","他把基督講得很屬靈、很高超，高到不必碰觸人的血肉和苦難。"],["p","可是一位沒有真的成為人的基督，不能真的替人死。十字架，就被抽空了。"],["q","「這就是那迷惑人、敵基督的。」（1:7）"],["p","請留意：長老說「許多」，卻沒有點任何一個人的名字。"],["p","他給的是一把尺，不是一份名單。"],["p","所以不可以拿這一節，把「敵基督」貼在任何人物、國家、宗派身上，也不算日子。"],["p","貼標籤很容易。連主耶穌都被叫作「那誘惑人的」（太 27:63）。"],["q","「你們要小心，不要失去你們所做的工，乃要得著滿足的賞賜。」（1:8）"],["p","「要小心」，原文是：看顧你們自己。守門以前，先看自己。"],["p","長老和同工的勞苦，這一家多年的服事，不要因為接錯了人被拆掉。"],["p","這裡講的是賞賜，不是得救。"],["p","救恩是白白賜下的，建立在基督完成的工作上。賞賜也不是交易。"],["p","保羅說，人的工程若被燒了，他要受虧損，"],["q","「自己卻要得救」（林前 3:15）"],["p","沒有人需要帶著失去救恩的恐懼回家。確據在基督身上。"],["q","「凡越過基督的教訓不常守著的，就沒有神」（1:9）"],["p","「越過」，原文有一個讀法是：走在前頭。"],["p","這正是門外那個人的口氣。長老很冷靜地回答：往前走過了基督，不是多得了甚麼，而是，就沒有神。"],["p","越過的，是基督的核心：父與子，道成肉身。"],["q","問問題，不是越過。離開基督，才是。"],["p","查考、研究、讀神學、不同的解經看法，都不是越過。"],["p","這封信沒有叫你停止思考。它叫你不要把基督丟在後頭。"],["p","也沒有人可以拿「我守住了純正教訓」壟斷權柄。"],["q","「常守這教訓的，就有父又有子。」（1:9）"],["p","「常守」，又是第二節那個字：住下來。"],["p","真理先住進我們裡面，我們就在祂的教訓裡住下來。"],["q","不是走得最遠的擁有最多，是住得最穩的擁有一切。"],["p","門外那個人說，他帶來更多。可是他手裡沒有子。沒有子，就沒有父。"],["p","門裡那位姊妹，覺得自己懂得不多。可是她有子。有子，就連父也有了。"],["p","有父，又有子。弟兄姊妹，還缺甚麼呢？"],["q","「若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安」（1:10）"],["p","請先看門外是誰。這是一位巡迴教師：否認耶穌基督成了肉身，出去傳另一個基督。"],["p","不是路過的鄰居，不是來借東西的朋友。當時，家就是教會聚會的地方。"],["p","接他進家，就是給他講台、住處、盤纏和推薦。"],["p","早期的《十二使徒遺訓》已經立了規矩：來的使徒住一天，必要時兩天；住到第三天，就是假先知。"],["p","再看「問安」。原文是當時的一句問候語，字面就是：願你喜樂。就是第四節那個「喜」。"],["p","這不是街上點頭，是當眾祝福、送行，等於背書。"],["q","「因為問他安的，就在他的惡行上有分。」（1:11）"],["p","「有分」，和「相交」是同一個字根。接待一位教師，就是成為他的夥伴。"],["p","不邀他上講台，不在小組推他的課程，不替他轉發募款，不以教會名義背書。"],["p","今天，一個群組、一則轉發的連結，也可能是講台。"],["p","可是請你聽清楚：這兩節，不是叫你冷落任何人。"],["p","不是叫你不理沒信主的家人，躲開慕道的朋友，或和離開教會的人斷了來往。"],["p","也不是叫你對不同信念的鄰居同事冷著臉。"],["q","「這個人接待罪人，又同他們吃飯。」（路 15:2）"],["p","同一張餐桌，主開給罪人。長老關上的，是講台。"],["p","而且同一位長老，在另一封信裡，是叫人開門的："],["q","「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（約參 8）"],["q","二書關門，三書開門。"],["p","標準不是認不認識，是他傳的是不是基督。這種判斷，最好由同工一起，帶著禱告來做。"],["p","只會關的門，沒有客人；只會開的門，沒有真理。"],["p","回到開場那一扇門。姊妹讀到這裡，她知道了。"],["p","她不必恨他，可以為他禱告。可是今晚的講台，她不能交給他。"],["p","她關上門，不是因為她比別人聰明。是因為她所愛的那一位，值得被完整地傳講。"],["p","可是如果信寫到這裡就結束，我們會以為，這是一封關門的信。"],["p","長老還有最後一段。"],["q","「我還有許多事要寫給你們，卻不願意用紙墨寫出來，但盼望到你們那裡，與你們當面談論」（1:12）"],["p","一張莎草紙寫滿了。長老放下筆。"],["p","有些話寫不清楚。一句提醒寫在紙上可能顯得冷，當面說，卻能帶著眼淚。"],["p","「當面談論」，原文是：口對口。"],["p","這使我們想起，神說到摩西的時候："],["q","「我要與他面對面說話」（民 12:8）"],["p","那是神與摩西之間，最親近的說話。長老要去，不是去審查，是去說話，近到看得見對方的臉。"],["p","我們是一個空中團契。聽到這一節，有人心裡可能一緊：那我們算不算？"],["p","請你看長老自己在做甚麼。他正在用紙墨傳真理。"],["p","這封信本身，就是遠距的牧養。真理靠一張紙，送到了那一家。"],["q","紙墨是橋，不是次等。"],["p","因病、因工作、因距離不能到場的人，沒有少得真理，也沒有被關在喜樂外面。"],["p","「當面」是盼望，是邀請，不是門檻。"],["p","線上把真理送到，見面使喜樂滿足。兩樣，都是同一份愛。"],["q","「使你們的喜樂滿足。」（1:12）"],["p","還記得那個「喜」字嗎？"],["p","第四節，長老看見兒女行在真理裡，就甚歡喜。"],["p","第十、十一節，不要對否認基督的教師說：願你喜樂。"],["p","第十二節，喜樂要被充滿。"],["p","中文讀不出來，原文卻是同一條線。"],["p","長老不給迷惑人的那一句「願你喜樂」，不是因為他吝嗇喜樂。"],["p","是因為他要把喜樂留給真理，留到見面那一天，滿滿地給。"],["p","「滿足」，原文是被充滿，而且一直保持充滿。喜樂不是我們擠出來的，是被賜下的。"],["q","「你那蒙揀選之姊妹的兒女都問你安。」（1:13）"],["p","前面不給迷惑人的那一句問安，在這裡，毫不吝嗇地給了弟兄姊妹。"],["q","黃昏的那一扇門，我們再看最後一眼。"],["p","門外的腳步聲，走遠了。院子裡，燈還亮著。"],["p","姊妹回到桌邊，把信從頭念給大家聽。念到最後一段，有人笑了出來：長老要來了。"],["q","守門不是終點，見面才是。"],["p","弟兄姊妹，今天你是哪一個？"],["p","也許你像那位長老，心裡掛著一些人，想寫，想說，想見。"],["p","也許你像那一家，門口常有人敲門：一個課程連結，一段轉發的影片，一位很會講的老師。"],["p","也許你曾在門外走錯過路。記得第三節的憐憫：仍有回家的路。"],["p","可是讀完這封信，請你不要更佩服長老的眼力。"],["p","長老能守門，是因為門裡面，住著一位。"],["p","那一位，真的成了肉身，來到我們中間。會累，會餓，在十字架上為我們流了血。"],["p","有祂，就有父又有子。"],["p","我們說耶穌是我的榜樣。榜樣不是一個理念，是一位真的來過、有血有肉的人。"],["p","守住這一位，就擁有一切。這就是讓耶穌作王。"],["p","這個禮拜想一想：你的家、你的群組、你的講台，讓誰進來？又有誰，你很久沒見了？"],["p","打一通電話，寫一封信。若是可以，去見他一面。"],["p","為了那一天，使你們的喜樂滿足。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"作者、收信人與處境：長老、蒙揀選的太太與巡迴教師各是誰？","r":"1:1--1；1:13；約參 1","ch":[],"why":"一、一位長老、一個家、一扇不斷有人敲的門——本講義的全卷立場之一（沿用約翰一書講義的議題「作者、年代與處境」，本卷補）。約翰二書只有十三節，卻有三個人物都沒有名字：寫信的「作長老的」、收信的「蒙揀選的太太」、門外那些來來去去的巡迴教師。若不在開卷講定這三者，全卷會被講偏：有人把整封信變成作者考據，有人用「太太」一詞替女性事奉的爭論找證據，更多人看不見第一世紀家庭教會的處境，就把 10--11 節直接搬到今天的餐桌上，叫人冷落自己的家人。","pos":[["【一】經文問的是甚麼","","<p>信一開頭就是三個沒有名字的身分：「作長老的寫信給蒙揀選的太太和她的兒女」（1:1）。寫信的人不稱使徒，只稱「那位長老」——原文 Ὁ πρεσβύτερος 有冠詞，讀者一看就知道是誰。收信的是一位 κυρία（主 κύριος 的陰性，「女主人、夫人」），和合本在這一節有註腳：「太太：或譯：教會；下同」。信末又說「你那蒙揀選之姊妹的兒女都問你安」（1:13）——問安的是姊妹的兒女，姊妹本人沒有出聲。</p><p>處境要先擺出來。第一世紀小亞細亞的家庭教會沒有給基督徒住的旅店文化，福音靠巡迴傳道人一家一家傳開，他們吃住、講台、送行的盤纏都靠接待的家供應。早期的《十二使徒遺訓》（Didache）第 11 章就為此立了規矩：來的使徒要接待，但只住一天，必要時兩天，住到第三天就是假先知；離開時只帶夠用的餅，若要錢，就是假先知。<strong>經文問的是：這位長老是誰？蒙揀選的太太是一位婦人還是一間教會？門口敲門的是些甚麼人，這家人該怎樣分辨？</strong></p>"],["使徒約翰說（長老就是西庇太的兒子約翰）","","<p>從愛任紐起，教會的傳統把約翰二書歸給使徒約翰：他晚年住在以弗所一帶，被各教會敬重為「那位長老」。這派的理由在經文裡：二書與約翰一書、約翰福音的用字幾乎一樣——「真理」「從起初」「彼此相愛」「常守」「認耶穌基督是成了肉身來的」（1:7；約壹 4:2）；三書的開頭又和二書幾乎同一句：「作長老的寫信給親愛的該猶，就是我誠心所愛的」（約參 1）。使徒自稱長老也有先例，彼得說自己是「與我同作長老的人」（彼前 5:1）。一位見過、聽過、摸過生命之道的老人，不必再報頭銜。</p><p><strong>難處：</strong>信裡沒有一個字自稱使徒；若真是使徒，面對迷惑人的挨家挨戶進門，為甚麼不用使徒的權柄？三書裡的丟特腓甚至「不接待我們」（約參 9），似乎不太把這位長老放在眼裡。支持者的回答是：長老一詞本身就帶著年紀與權威，不必再加；但這個難處仍要誠實擺出來。</p>"],["長老約翰說（帕皮亞提到的另一位約翰）","","<p>第二世紀初的帕皮亞（Papias）說，他向那些跟過主的人打聽，問安得烈、彼得、腓力、多馬、雅各、約翰、馬太說過甚麼，又問亞里斯丟和「長老約翰」說些甚麼。優西比烏在《教會史》3.39 引了這段話，並且認為名單裡有兩個約翰：一位是使徒，一位是「長老約翰」；他又提到以弗所有兩座都稱為約翰的墳墓。這派主張約翰二書、三書（甚至啟示錄）是這位長老約翰寫的——他自稱「作長老的」，正好合他的稱號。</p><p><strong>難處：</strong>帕皮亞那段話也可以讀成同一位約翰被提了兩次（先在使徒名單裡，再作為仍在世、還能被請教的見證人）；「兩個約翰」是優西比烏的解讀，他本人對啟示錄另有看法。而且長老約翰除了這段話，在早期文獻裡幾乎沒有自己的面貌，要把三封書信掛在他名下，根據相當單薄。</p>"],["約翰群體說（一位領袖、一個圈子）","","<p>二十世紀許多學者提出：約翰福音與約翰書信出自一個以使徒約翰的見證為核心的信徒群體，書信的作者是這個群體裡一位受敬重的領袖，被稱作「那位長老」。這派留意到約翰一書說「他們從我們中間出去，卻不是屬我們的」（約壹 2:19）——群體正在經歷一次分裂，二書正是分裂之後寫給一個姊妹教會的信。這派的優點是把處境讀得很具體：一個圈子、幾個家庭教會、一條巡迴的路線。</p><p><strong>難處：</strong>這個「群體」是從經文重建出來的，它的成員、地點與歷史都是推論，推論一層疊一層，很容易讓重建的圖畫比經文本身說得還多。而且無論作者是使徒本人還是他的門下，信的信息並不因此改變：真理、愛、守住那位成了肉身來的主。</p>"],["收信人三讀（一間教會／一位姊妹與她的家／人名）","","<p><strong>①一間地方教會的擬人。</strong>理由：13 節「你那蒙揀選之姊妹的兒女」像一間姊妹教會在問安，所以姊妹本人沒有出聲；全信在單數「你」（1:4、5、13）與複數「你們」（1:6、8、10、12）之間轉換，像是對一間教會和她的會眾說話；彼得也寫「在巴比倫與你們同蒙揀選的教會問你們安」（彼前 5:13），新約又把教會比作基督的新婦（弗 5:25--32）。難處：書信開頭用擬人並不常見。</p><p><strong>②一位姊妹與她的家。</strong>字面最自然：她家就是聚會的地方，這使我們想起保羅寫給「在你家的教會」（門 1:2）、徒 12:12 馬可的母親馬利亞的家。難處：若 13 節的「姊妹」也是一位婦人，為甚麼問安的是她的兒女，不是她本人？</p><p><strong>③人名 Κυρία（Kyria）或 Ἐκλέκτη（Electa）。</strong>κυρία 在當時的書信裡可作人名。難處：若 Electa 是名字，13 節「蒙揀選之姊妹」的姊妹也成了同名的 Electa，兩姊妹同名，不太自然。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者沿用約翰一書講義的議題「作者、年代與處境」——寫信的「長老」是使徒約翰；帕皮亞提到的「長老約翰」說（優西比烏《教會史》3.39）與約翰群體說並陳，不裁判。講台可以寫「長老說」「約翰說」，但焦點不在長老的辨識力，在那位「有父又有子」的主（1:9）。</strong></p><p><strong>收信人三讀並陳，本講義傾向第一讀（一間教會的擬人），但三讀都能在講台上用</strong>——無論她是一間教會，還是一位打開家門接待教會的姊妹，這封信都落在一個家門口。<strong>本講義不用「蒙揀選的太太」替女性事奉的任何定論背書，也不用它反對</strong>；那一題請回到哥林多前書講義、提摩太前書講義各自的全卷立場。</p><p>處境照「書信」三問讀：①受信人遇到甚麼？一個家庭教會，門口不斷有巡迴教師來來去去；有人自稱「走在前頭」，否認耶穌基督成了肉身。②長老從福音推出甚麼原則？在真理中愛；照祂的命令行就是愛；常守基督的教訓就有父又有子；不給否認基督的教師平台與祝福；喜樂在當面相見時滿足。③今天這原則落在哪裡？家、小組、講台與課程的邀請、轉發與推薦、線上團契、為兒女流淚的父母。</p>"],["【四】這件事該不該影響你的信心","","<p>長老是使徒本人還是另一位約翰、太太是一間教會還是一位姊妹，這些討論不該動搖你的信心。各派都同意：這是一位被眾教會敬重的老牧者，寫給一個他「誠心所愛的」家（1:1），而愛的理由他自己說了——「愛你們是為真理的緣故」（1:2）。</p><p>真正該問的是：<strong>我家的門口，今天有誰在敲門？</strong>有的是為主名出外的弟兄，需要一碗飯、一張床；有的人帶來的，卻是另一個基督。這封信沒有叫我們把門焊死，是教我們認得那位真正住進來的——「這真理存在我們裡面，也必永遠與我們同在」（1:2）。在我們學會守門之前，真理已經先住進來了。</p>"]],"con":[],"say":"本講義的全卷立場：沿用約翰一書講義的議題「作者、年代與處境」——「長老」是使徒約翰，並陳帕皮亞提到的長老約翰說（優西比烏《教會史》3.39）與約翰群體說；「蒙揀選的太太」三讀並陳（一間教會的擬人／一位姊妹與她的家／人名），傾向教會讀法，三讀都能在講台上用，不裁判，也不替女性事奉的任何定論背書或反對。處境是第一世紀靠家庭教會接待的巡迴教師。","care":"席上會有家裡就是聚會地點、累到不敢說的接待家庭；有一聽到「作者有爭議」就不安的長輩；也有在女性事奉的爭論裡受過傷、一聽到「太太」二字就繃緊的姊妹。牧者要讓接待的家知道，長老寫這封信是為了保護他們，不是加重他們的擔子；對不安的長輩，指給他看 1:2 的真理住在我們裡面；不要在講台上把「蒙揀選的太太」拿來證明姊妹可以或不可以作甚麼，也不要把作者考據講成信心的考試。"},{"id":"ISS00_2","t":"真理與愛：可以只用一隻手嗎？","r":"1:1--6；1:3；1:6","ch":[],"why":"二、真理與愛是同一個結，不是天平的兩端——本講義的全卷立場之二（本卷新立）。約翰二書前六節，「真理」出現五次、「愛」出現四次，幾乎每一節都把兩者綁在一起；第 6 節更直接給愛下了定義。可是教會歷史上最常見的兩種病，正好是把這個結剪開：一邊高舉真理，講到最後只剩下審查與定罪；一邊高舉愛，講到最後甚麼都可以、誰都不能說不。有真理沒有愛是一把刀，有愛沒有真理是一團霧。這一題必須在開卷講定，否則 7--11 節的警告會被讀成愛的反面。","pos":[["【一】經文問的是甚麼","","<p>先數一數這兩個字怎樣出現：「就是我誠心所愛的；不但我愛，也是一切知道真理之人所愛的」（1:1）；「愛你們是為真理的緣故」（1:2）；恩惠、憐憫、平安「在真理和愛心上必常與我們同在」（1:3）；長老看見兒女遵行真理，「就甚歡喜」（1:4）；然後是「我們大家要彼此相愛」（1:5）。到了第 6 節，兩隻手交握成一個結：「我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令」（1:6）。</p><p>原文兩個 αὕτη（「這就是」）互為鏡像：愛就是照祂的命令行；命令就是在「它」裡面行——ἐν αὐτῇ 是陰性，可以指愛，也可以指命令。緊接著第 7 節用「因為」（ὅτι）開頭，把警告接在愛的後面。<strong>經文問的是：真理與愛，誰先誰後？可以只要一個嗎？為甚麼一封要人守門的信，先花了六節講愛？</strong></p>"],["真理優先說（先守住純正，關係以後再談）","","<p>許多重視教義的教會這樣讀：迷惑人的已經進門了（1:7），長老最在乎的是「常守這教訓」（1:9）；愛必須建立在真理上，所以先把界線畫清楚，關係可以等一等。這派引猶大書勸人要為從前一次交付聖徒的真道竭力地爭辯（猶 3），也指出長老愛人的理由正是「為真理的緣故」（1:2）。這派的優點是嚴肅：它知道錯誤的教導真的會傷人，不肯為了氣氛和諧讓羊圈的門大開。</p><p><strong>難處：</strong>長老自己的次序剛好相反——他先寫了六節的愛，才寫到迷惑人的；他的勸勉是「我現在勸你」（1:5），原文 ἐρωτάω 是請求、懇求的字，不是上對下的命令。只剩真理的守門，很快就變成冷冰冰的審查：每一個敲門的人都先被當成嫌犯，連自己家裡的兒女也活在被檢查的恐懼裡。</p>"],["愛優先說（愛是最大的，教義的分別是次要的）","","<p>另一派強調約翰著作的核心是愛：神就是愛，主留下的是一條「新命令，乃是叫你們彼此相愛」（約 13:34）；長老在這封信裡也說「這並不是我寫一條新命令給你」（1:5），他真正要的是「我們大家要彼此相愛」（1:5）。這派主張教義的分別常常傷了和氣，基督徒應當以愛包容一切不同。這派的優點是溫暖：它記得教會首先是一個家，不是一間審判庭。</p><p><strong>難處：</strong>同一位長老緊接著就說「不要接他到家裡」（1:10），可見他所說的愛有形狀、有邊界。第 6 節不讓愛變成一種沒有內容的感覺——愛是「照他的命令行」。只剩愛的羊圈，是一個人人都能進來偷羊的羊圈；那些否認基督成了肉身的教師，最先受害的正是「太太和她的兒女」。</p>"],["平衡說（真理與愛各佔一半，看情況調配）","","<p>第三種常見的說法是取中間：有時候要多一點真理，有時候要多一點愛，牧者要懂得拿捏比例。這派的優點是務實，也看見了前兩派各自的危險，願意在真實的牧養處境裡求智慧；保羅說「惟用愛心說誠實話」（弗 4:15），似乎也是在兩者之間求一個平衡。</p><p><strong>難處：</strong>「各佔一半」的圖像仍然把兩者當成彼此競爭的東西，好像多愛一點就要少一點真理。約翰二書的寫法不是天平，是一個結：每一節都是百分之百的真理、百分之百的愛。第 6 節說愛被命令定義，命令又被愛定義，兩者拆不開；弗 4:15 也不是一半愛心、一半誠實，而是用愛心的方式說出整全的誠實話。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：真理與愛不能只用一隻手。全卷在 1:3 交會——「在真理和愛心上」；在 1:6 打成一個結——「我們若照他的命令行，這就是愛」。愛被命令定義，命令被愛定義；有真理沒有愛是一把刀，有愛沒有真理是一團霧。</strong></p><p>這個結決定了全卷的次序：<strong>真（1--4）→ 愛（5--6）→ 守（7--13）</strong>，次序不可顛倒。先是真理住進我們裡面（1:2），我們才守得住（1:9）；守的動力是愛，不是怕。第 7 節的「因為」把警告接在愛的後面——長老要人守門，正因為他愛這一家人；警告是愛的延伸，不是愛的反面。</p><p>所以本講義寫作與講台的規矩是：<strong>講真理的每一段都要看見人，講愛的每一段都要講到「照他的命令行」。</strong>這不是一個方法，是一個人——「道成了肉身，住在我們中間，充充滿滿地有恩典有真理」（約 1:14）。我們不是在兩個原則之間求平衡，是在跟隨那位本身就是真理、又親自來愛我們的主。</p>"],["【四】這件事該不該影響你的信心","","<p>教會之間對「教義與關係哪一個先」有真誠的分歧，有的傳統重教義，有的傳統重團契，這不該動搖你的信心。各派都同意：主耶穌自己從來沒有用其中一隻手。</p><p>但有一件事該問自己：<strong>我比較常用哪一隻手？</strong>若你總是對的，身邊的人卻一個一個退開，也許你手上拿的是刀；若你人人都喜歡，卻從來不敢說一句不，也許你走在霧裡。長老在問安裡先放了「憐憫」（1:3）——一封要人守門的信，最先給的是憐憫。兩隻手都不夠的時候，憐憫已經先「必常與我們同在」。</p>"]],"con":[],"say":"本講義的全卷立場：真理與愛不能只用一隻手——全卷在 1:3「在真理和愛心上」交會，在 1:6「我們若照他的命令行，這就是愛」打成一個結；愛被命令定義，命令被愛定義。有真理沒有愛是一把刀，有愛沒有真理是一團霧；次序是真、愛、守，警告是愛的延伸。","care":"席上會有被「純正教義」的名義審查、定罪過，從此一聽到「真理」就想逃的人；也有在「愛就好」的教會裡，被人情綁住、被錯誤的教導誤導多年卻沒有人敢提醒的人。牧者對前者，要先讓他經歷一個不用通過考試的家；對後者，要溫柔而清楚地把話說明白。不要在講台上說「我只是說真話，你受傷是你的問題」，也不要說「只要有愛，信甚麼都一樣」；兩句話各砍掉一隻手，傷的都是坐在席上的人。"},{"id":"ISS00_3","t":"接待、問安與界線：10--11 節在第一世紀是甚麼意思，今天該怎樣應用？","r":"1:10--11；約參 5--10；路 15:2","ch":[],"why":"三、所禁的是平台與背書，不是冷落一個人——本講義的全卷立場之三（本卷新立，接約翰一書講義的議題「愛、界線與和好」）。10--11 節是全卷最容易講錯的兩節。它被拿來叫信徒不跟信別的宗教的家人吃飯、不和離開教會的朋友打招呼、在街上對鄰居冷臉；也有人因為怕講錯，乾脆跳過這兩節，結果讓教會的講台與群組對甚麼教導都敞開。這一題必須在開卷講定：對象是誰、「接到家裡」與「問安」在第一世紀是甚麼意思、今天落在哪裡，而且要和同一位長老在約翰三書說的「接待」一起讀。","pos":[["【一】經文問的是甚麼","","<p>經文說：「若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安；」（1:10）「因為問他安的，就在他的惡行上有分。」（1:11）「到你們那裡」的 ἔρχεται 是現在式：一個正在來的人；「傳」原文是 φέρει「帶著」——一位帶著信息來的教師；「你們」是複數，對整個聚會說話。「這教訓」接回第 9 節：「常守這教訓的，就有父又有子」（1:9），也就是第 7 節定義的——那些「不認耶穌基督是成了肉身來的」（1:7）。</p><p>「問他的安」原文是 χαίρειν，希臘人見面與寫信開頭的問候語，字面是「願你喜樂」；使徒會議的信就用這個字開頭（徒 15:23）。「有分」κοινωνεῖ 和「相交」κοινωνία 同一個字根。<strong>經文問的是：不要接誰？「接到家裡」是請吃一頓飯，還是給一個講台？「問安」是街上點頭，還是公開的祝福？今天可不可以跟信仰不同的人打招呼？</strong></p>"],["嚴格隔離說（對異端的人連招呼都不打）","","<p>這是教會歷史上很早就有的讀法。愛任紐在《駁異端》1.16.3 引用 1:11，勸信徒遠離當時的異端教師；他在同書 3.3.4 又記下一則從士每拿的坡旅甲那裡傳下來的故事：使徒約翰在以弗所進澡堂，看見異端教師克林妥（Cerinthus）在裡面，就沒有洗澡跑了出來，怕澡堂塌下來。這派主張：對傳另一個基督的人，不往來、不問候、不同桌，才是對真理忠心。它的優點是嚴肅看待 1:11 的「有分」——錯誤的教導會傳染，界線不是小事。</p><p><strong>難處：</strong>這則故事是轉述的傳聞，而且它講的是對一位異端教師的態度，不是對一般人。若把這種讀法推到極處，就會叫人冷落不信的家人、慕道友、在信仰上掙扎的人——可是主耶穌被人議論說「這個人接待罪人，又同他們吃飯」（路 15:2）。隔離說若沒有分辨對象，傷到的往往不是迷惑人的教師，而是最需要被愛的人。</p>"],["家庭教會講台說（「接到家裡」是給他聚會的平台）","","<p>另一派從處境讀：第一世紀的「家」常常就是聚會的地方，這使我們想起「在你家的教會」（門 1:2）；百基拉、亞居拉聽見亞波羅講道，「就接他來，將神的道給他講解更加詳細」（徒 18:26）。巡迴教師被接進家，就得到食宿、講台，離開時還帶著盤纏與推薦。所以 10 節禁止的是正式的接待——讓他在聚會裡教導、用教會的名義送他上路；χαίρειν 也不是街上的點頭，而是公開的祝福與接納，等於背書。這派的優點是讀出了經文的處境與份量。</p><p><strong>難處：</strong>若只看「家」與「講台」，容易讓人以為只要不在聚會場地裡，就甚麼都可以——私下替他推薦、在群組轉發他的課程、用個人名義替他募款，好像都不算。而且這派有時忽略了 1:11 的嚴肅：問安之所以危險，是因為它讓人在他的惡行上「有分」。</p>"],["核心否認者說（只限真正否認基督論核心的人）","","<p>第三派著重對象：10 節的「不是傳這教訓」不是指任何一點教義上的不同，而是第 7 節定義的人——否認耶穌基督是成了肉身來的，並且出去傳揚的教師；第 9 節說他們「越過基督的教訓」，結果是「就沒有神」（1:9）。所以這兩節不適用於宗派之間的分歧、不同的解經意見、在信仰上有疑問的人。這派的優點是保護了教會的合一：它不讓 10--11 節變成各宗派彼此不打招呼的理由。</p><p><strong>難處：</strong>若只畫出核心這條線，卻沒有說清楚所禁的是甚麼行為，一樣可能被讀成「對這些人要冷臉」；而且怎樣算「否認核心」，需要教會在真理上下功夫分辨，不能任由一個人說了算（見〈分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？〉）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：合取後兩派——對象是 7、9 節定義的人：否認耶穌基督成了肉身、出去傳揚另一個基督的教師；所禁的是給他平台、講台、背書、推薦與募款的協助；「接到家裡」是給他講台與住處，「問安」是公開的祝福。不是冷落不信的家人、慕道友、離開教會的弟兄姊妹、別的宗教或不同信念的鄰居同事。</strong></p><p>今日的應用要具體：不邀他上講台、不在小組推他的課程、不替他轉發募款、不以教會名義為他背書。但照樣可以和他同桌吃飯、照樣在病床旁為他禱告、照樣在街上微笑——主與稅吏罪人一同吃飯（這使我們想起路 15:2）；我們學的是祂。第一世紀的人看門，是看誰要拿走這家的講台；今天的門，常常是一個講台的邀請、一則轉發、一個推薦。</p><p><strong>二書必須和三書一起讀。</strong>同一位長老在約翰三書稱讚該猶接待為主名出外的弟兄：「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（約參 8）又責備丟特腓「他自己不接待弟兄，有人願意接待，他也禁止」（約參 10）。二書叫人關門，三書叫人開門；標準不是認不認識、喜不喜歡，是傳不傳基督。<strong>正因為人重要，所以不讓迷惑人的人進門傷害「太太和她的兒女」——愛那一家人，就守住那扇門。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>教會之間對 10--11 節該嚴到甚麼程度有不同的看法，這不該動搖你的信心。各派都同意：這兩節要保護的，是一個家庭教會的講台與那裡的兒女，不是要叫基督徒變得冷漠。</p><p>但有一件事該問自己：<strong>我家的門，是對誰關、對誰開？</strong>若我對信仰不同的家人冷臉，卻替一個否認基督的網紅轉發課程，我正好把門開反了。長老要我們關上的是講台，不是飯桌；要我們開的是為真理做工的門，而且要開得比丟特腓寬。那位「接待罪人，又同他們吃飯」的主，就是我們守住的那一位。</p>"]],"con":[],"say":"本講義的全卷立場：10--11 節的對象是否認耶穌基督成了肉身、出去傳揚的教師；所禁的是給他平台、講台、背書、推薦與募款協助，χαίρειν 問安是公開祝福。不是冷落不信的家人、慕道友、離開教會的人或鄰舍——主與稅吏罪人同席（路 15:2）。必須與約翰三書的「接待」（約參 5--8）合看：二書關門、三書開門，標準是傳不傳基督。","care":"席上會有配偶、父母還沒信主，曾被人勸「不要跟他們太親近」而夾在中間痛苦的人；有家人加入了別的宗教或新興團體、不知道還能不能回家吃年夜飯的人；也有自己曾經離開教會，正在猶豫要不要回來、怕被冷眼的人。牧者要清楚告訴他們：這兩節不是叫你冷落家人，照樣去愛、照樣同桌、照樣代禱。不要在講台上說「異端連招呼都不能打」，不要點名任何人或團體，也不要讓離開的人在門口就先感到被審判。"},{"id":"ISS00_4","t":"分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？","r":"1:7--9；約壹 4:2；約壹 2:22--23","ch":[],"why":"四、分辨的標準是一位：耶穌基督是成了肉身來的——本講義的全卷立場之四（沿用約翰一書講義的議題「分辨：誰是敵基督、假先知？」、彼得後書講義對假教師的處理）。「迷惑人的」「敵基督」是最容易被濫用的兩個詞：歷史上它們被貼在皇帝、主教、政治人物、國家、宗派身上，也被拿來算末日的時間表；在小群體裡，它們又常被用來排除意見不同的人。第 7 節其實已經給了清楚的標準，第 9 節又把「越過」說明為離開基督的教訓。這一題要講定：標準是甚麼、核心與次要怎樣分、為甚麼問問題不等於越過。","pos":[["【一】經文問的是甚麼","","<p>經文說：「因為世上有許多迷惑人的出來，他們不認耶穌基督是成了肉身來的；這就是那迷惑人、敵基督的。」（1:7）接著：「凡越過基督的教訓不常守著的，就沒有神；常守這教訓的，就有父又有子。」（1:9）πλάνος「迷惑人的」是使人走錯路的人，和本卷一再出現的「行」（περιπατέω，1:4、6）成對比：一邊在真理中走，一邊把人帶錯路。「越過」在 SBLGNT 作 προάγων，字面是走在前頭、往前帶領，可能帶著諷刺——自稱比使徒的教導更進步的人；RP 作 παραβαίνων，越過、犯界。</p><p>這個標準和約翰一書一致：「凡靈認耶穌基督是成了肉身來的，就是出於神的；」（約壹 4:2）「不認父與子的，這就是敵基督的。」（約壹 2:22）不同的是，約壹 4:2 用完成式分詞 ἐληλυθότα，二書 1:7 用現在分詞 ἐρχόμενον。<strong>經文問的是：這個現在分詞指甚麼？誰算「迷惑人的」？哪些分歧是核心，哪些是次要？問問題算不算「越過」？</strong></p>"],["道成肉身說（現在分詞強調「在肉身中來的這一位」）","","<p>多數解經家認為 1:7 的 ἐρχόμενον ἐν σαρκί 指道成肉身，與約壹 4:2 同一個意思；現在分詞不是指「正在來」，而是強調這一位的身分：耶穌基督就是那「在肉身中來的」，這不是一件過去發生、後來就脫下的事，而是祂持續的身分——復活的主仍有身體。對手的錯誤在於把「耶穌」與「基督」拆開，或否認神的兒子真的成了血肉之軀。這派的優點是讓二書與約翰一書彼此印證，也讓第 9 節「有父又有子」有了具體內容。</p><p><strong>難處：</strong>若真與約壹 4:2 同義，為甚麼作者換了時態？這個問題沒有確定的答案；這派的回答是，約翰著作常用現在分詞表達身分與本質，但這只是解釋，不是證明，要誠實承認它是一個推論。</p>"],["再來說（指將來在肉身裡再來）","","<p>少數解經家把現在分詞讀成將來的意思：「那要在肉身裡來的」，指主的再來；迷惑人的否認的，是主將來要帶著身體再來。這派指出希臘文的現在分詞確實可以指即將發生的事，而且約翰一書也盼望「主若顯現，我們必要像他」（約壹 3:2）。這派的優點是提醒我們：基督論不只關乎過去，也關乎將來——那位升天的主，要照樣回來。</p><p><strong>難處：</strong>約翰書信對手的問題，從約翰一書看，集中在耶穌與基督的身分、父與子的關係（約壹 2:22--23），沒有清楚的線索顯示他們特別否認再來。而且若讀成再來，第 7 節與約壹 4:2 的平行就斷了。</p>"],["稱號說（「那要來的」是一個沒有時間性的稱號）","","<p>還有一種讀法把 ἐρχόμενον 看成稱號：「那在肉身中來者」，就像福音書裡「那要來的」是彌賽亞的稱號；現在分詞不指時間，只指這一位是誰。至於對手是誰，學者常提到兩類：一是後來被稱為「幻影說」的思想（基督只是看起來有身體）；一是愛任紐描述的克林妥一派（耶穌只是人，基督在受洗時降在他身上、受難前離開）。這派的優點是不硬套時態，讓經文自己說話。</p><p><strong>難處：</strong>稱號說和道成肉身說其實相距不遠，差別在於是否強調時間；至於對手的身分，經文沒有點名，幻影說與克林妥都是後來的資料與推論，把二書的對手直接等同於其中一派，是替經文多說了話。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：1:7 從道成肉身說，並陳再來說與稱號說；對手的身分不定論。分辨的標準是基督論——「認耶穌基督是成了肉身來的」（約壹 4:2）；第 9 節越過的是基督論的核心：父與子的關係、道成肉身。</strong>沿用約翰一書講義的議題「分辨：誰是敵基督、假先知？」，凡約翰一書詳講過的敵基督討論，本卷不重複，只講二書多出來的那一筆：這些人正挨家挨戶要求進門。</p><p><strong>核心與次要要分清楚。</strong>核心是那位「有父又有子」的主（1:9）——祂是誰、祂真的成了肉身來。洗禮的方式、聖餐的理解、末世的時序、教會的治理，是真誠的信徒彼此有分歧的地方，要「凡事察驗；善美的要持守」（帖前 5:21），卻不是 1:7 的標準。<strong>問問題不是越過，離開基督才是。</strong>提問、研究、聖經學的進展、不同的解經意見都不是「越過」；庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），被稱為賢良。也不讓任何人以「我守住純正教訓」壟斷屬靈權柄。</p><p><strong>不貼標籤、不算日子。</strong>本講義不把「迷惑人的」「敵基督」貼在任何政治人物、國家、宗派或群體身上；1:7 的單數帶冠詞是說「凡這樣否認的，都屬於那一類」，不是在指認某一個人物。要記得，連主耶穌都被人叫作「那誘惑人的」（太 27:63）——貼標籤從來容易，分辨才需要真理與愛。</p>"],["【四】這件事該不該影響你的信心","","<p>現在分詞怎麼讀、二書的對手是哪一派，學者有不同的看法，這不該動搖你的信心。各派都同意：耶穌基督真的成了肉身來，祂是父的兒子，這是基督信仰不能退讓的中心。</p><p>真正該問的是：<strong>我分辨的眼睛，是盯著別人，還是盯著基督？</strong>焦點不在迷惑人的有多少，在我們有的是誰——「常守這教訓的，就有父又有子」（1:9）。不是走得最遠的擁有最多，是住得最穩的擁有一切。認得真鈔的人，不是背熟了每一種假鈔，是摸熟了真的。</p>"]],"con":[],"say":"本講義的全卷立場：沿用約翰一書講義的議題「分辨：誰是敵基督、假先知？」——分辨的標準是基督論：「認耶穌基督是成了肉身來的」（約壹 4:2）；1:7 現在分詞從道成肉身說，並陳再來說與稱號說；9 節越過的是父與子、道成肉身的核心，不是提問、研究與不同的解經意見。不把「迷惑人的」「敵基督」貼在任何人物、國家、宗派或群體身上，也不算日子。","care":"席上會有曾被人指著鼻子說「你是迷惑人的」而離開教會的人；有一聽到「敵基督」就整夜睡不著、到處找末日徵兆的長輩；也有正在讀神學、心裡有很多問題，怕一開口就被當成異端的年輕人。牧者要讓他們知道，標準是基督，不是某個人的好惡；問題可以帶到小組來慢慢談。不要在講台上點名任何人物、宗派或群體，不要放末日時間表，也不要用「你這樣問就是越過」堵住一個正在尋找的人。"},{"id":"ISS00_5","t":"賞賜與確據：8 節「不要失去你們所做的工」，是說會失去救恩嗎？","r":"1:8--8；林前 3:14--15","ch":[],"why":"五、8 節講的是工作的成果與賞賜，不是得救本身——本講義的全卷立場之五（沿用約翰一書講義的議題「罪與確據」）。「不要失去你們所做的工」一句，最容易在敏感的良心裡變成恐懼：我是不是會失去救恩？也有人把「滿足的賞賜」講成一張功德表，好像做得越多，天上的帳戶越豐厚。這一節還有一個經文異文：是「你們所做的工」，還是「我們所做的工」？異文與神學要一起講清楚，才不會讓一句保護人的話，變成壓在人身上的擔子。","pos":[["【一】經文問的是甚麼","","<p>經文說：「你們要小心，不要失去你們所做的工，乃要得著滿足的賞賜。」（1:8）「要小心」原文 Βλέπετε ἑαυτούς，直譯「看顧你們自己」——先看自己，不是先看別人。μισθός 是工價、賞賜，πλήρης 是完滿的。這一節緊接在第 7 節的迷惑人的之後、第 9 節的「越過」之前，是夾在警告中間的一句勸勉。</p><p>這一節有異文。SBLGNT 作 εἰργασάμεθα「我們所做的」——不要讓我們（長老與同工）在你們身上的勞苦落空；和合本正文「你們所做的工」與 Tregelles 的 εἰργάσασθε 相合，和合本在這裡有註腳「有古卷：我們」；拜占庭傳統（RP）甚至把動詞也改成「我們不要失去……我們得著」。<strong>經文問的是：失去的是甚麼？是救恩，是賞賜，還是使徒的勞苦？這一句是要人害怕，還是要人珍惜？</strong></p>"],["失去救恩說（被迷惑而離開，就失去得救）","","<p>有些傳統把這一節讀得很重：一個信徒若被迷惑人的帶走，越過基督的教訓，就「沒有神」（1:9），也就失去了一切，包括救恩。這派引希伯來書的嚴厲警告，主張這些警告是真實的，不能輕看。這派的優點是嚴肅：它不讓人以為信主之後怎樣活都無所謂，也看見迷惑人的帶來的危險是真的。</p><p><strong>難處：</strong>經文用的字是「工」與「賞賜」，不是「得救」或「永生」；若長老要說失去救恩，他有現成的詞可用。約翰一書寫信的目的，正是「要叫你們知道自己有永生」（約壹 5:13）；主也說「誰也不能從我手裡把他們奪去」（約 10:28）。把 8 節讀成失去救恩，會在最敏感的良心裡製造長期的恐懼——這正是本講義要擋下的誤讀。</p>"],["賞賜說（失去的是工作的成果與完滿的賞賜）","","<p>多數解經家讀成賞賜：信徒的根基是基督，建在根基上的工作會被試驗——「人在那根基上所建造的工程若存得住，他就要得賞賜」（林前 3:14）；工程若被燒了，他要受虧損，「自己卻要得救」（林前 3:15）。8 節的「滿足的賞賜」就是這個意思：不要讓被迷惑耽誤了你本來可以得的完滿。這派的優點是分清了得救與賞賜，也保住了警告的份量。</p><p><strong>難處：</strong>賞賜說若講不好，會變成功德論：做得越多，賞賜越多，好像天國是一間按件計酬的工廠。而且「賞賜」究竟是甚麼，新約沒有開一張清單，講台不宜替經文畫出天上的等級表。</p>"],["使徒勞苦說（SBLGNT「我們所做的」：不要讓同工的勞苦落空）","","<p>若照 SBLGNT 讀「我們所做的」，這一節的重心就移到傳道者身上：長老和他的同工在這個家庭教會裡流淚撒種，他們不要這些勞苦被迷惑人的毀掉；信徒若守住，長老和信徒一同得著完滿的賞賜。這使我們想起保羅對加拉太人的心腸：「惟恐我在你們身上是枉費了工夫」（加 4:11）。這派的優點是溫暖：長老不是站在外面恐嚇，而是把自己的心血也押在這一家人身上。</p><p><strong>難處：</strong>異文的判斷並不一致，和合本正文採「你們」；而且「我們／你們」兩讀的意思其實相近，都在講工作的成果與賞賜，不能只憑一個異文就把整節的重心定死。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用約翰一書講義的議題「罪與確據」——確據建立在基督的工作上，賞賜與我們的忠心相關。8 節講的是工作的成果與賞賜，不是得救本身；賞賜不等於得救。</strong>異文「我們／你們所做的工」兩讀並陳：講台照和合本讀「你們」，原文注釋交代 SBLGNT 的「我們」；兩讀意思相近——一個說你們自己的工，一個說長老在你們身上的工，都是一場不要被偷走的收成。</p><p><strong>本講義不製造失去救恩的恐懼，也不教靠工作換賞賜。</strong>「因為那已經立好的根基就是耶穌基督，此外沒有人能立別的根基。」（林前 3:11）根基是基督立的，不是我們立的；建在上面的工程，是對恩典的回應，不是買天國的價錢。8 節的「要小心」是愛的提醒，就像父母說「過馬路要小心」——不是說你已經不是我的孩子，是因為你是我的孩子。而第 9 節緊接著就把確據交在一位身上：「常守這教訓的，就有父又有子。」（1:9）</p>"],["【四】這件事該不該影響你的信心","","<p>神學傳統之間對「信徒能不能失去救恩」有長久的分歧，這不該動搖你的信心；不論站在哪一個傳統，8 節本身講的是賞賜，各派讀這一節都不需要拿救恩來恐嚇人。</p><p>若你是一個良心特別敏感的人，請聽見這一句：<strong>你的確據不在你做了多少，在祂做成了甚麼。</strong>「如今，那些在基督耶穌裡的就不定罪了。」（羅 8:1）8 節不是要你數算自己夠不夠，是要你珍惜手上那份被恩典託付的工——那份工值得守，因為給你這份工的主，已經先守住了你。</p>"]],"con":[],"say":"本講義的全卷立場：沿用約翰一書講義的議題「罪與確據」——確據建立在基督的工作上，賞賜與忠心相關。8 節講的是工作的成果與賞賜，不是得救本身（林前 3:14--15）；異文「我們／你們所做的工」兩讀並陳，講台照和合本。不製造失去救恩的恐懼，也不教靠工作換賞賜。","care":"席上會有良心特別敏感、常常懷疑自己還算不算得救的人；有曾經被錯誤教導帶走一段時間、回來後一直怕「已經失去了」的人；也有服事多年、身心俱疲，覺得自己的工都白做了的同工。牧者對第一、二種人，要把確據放回基督身上，陪他讀約壹 5:13；對第三種人，讓他知道長老說的是「不要失去」，不是「你已經失去」。不要用 8 節嚇人留在教會，也不要用「賞賜」催逼人多做服事；若焦慮已影響睡眠與生活，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS00_6","t":"寫作年代與地點：約翰二書寫於何時、何地？","r":"1:1--13","ch":[],"why":"六、約翰二書在何時、何地寫成？——全卷通用題。這封信沒有提到任何地名、人名或歷史事件，年代與地點只能從傳統與信的內容推斷。這一題不影響信息本身，但影響讀者怎樣想像那扇門：是使徒晚年在以弗所一帶，看著自己親手建立的家庭教會網絡被分裂衝擊？還是更早的時候？講清楚哪些是傳統、哪些是推論、哪些經文沒有說，正是在示範誠實讀經。","pos":[["【一】經文問的是甚麼","","<p>信裡沒有地名，也沒有可以定年的事件。我們只知道幾件事：作者是一位被眾家庭教會敬重的「長老」（1:1）；他盼望親自去探望收信的教會（1:12），可見兩地有一段路程，但不算太遠；已經有「許多迷惑人的出來」（1:7），這與約翰一書描述的分裂相近——「他們從我們中間出去，卻不是屬我們的」（約壹 2:19）。<strong>經文問的是：這些線索夠不夠定出年代與地點？傳統的說法根據在哪裡？</strong></p><p>也要知道這題的份量：約翰二書的信息——真理、愛、守住那位成了肉身來的主——不因為它寫在主後六十年代還是九十年代而改變。這一題是讓讀者看見處境，不是讓處境決定信息。</p>"],["以弗所晚期說（約主後 85--95 年）","","<p>傳統的說法是：使徒約翰晚年住在以弗所，照管小亞細亞一帶的眾教會，約翰一、二、三書都是這段時期寫的。愛任紐說約翰在以弗所一直活到羅馬皇帝圖拉真（Trajan）的時代，教會的傳統一向把約翰的晚年事工放在以弗所。這派也從內容推論：約翰書信所對付的、否認耶穌基督成了肉身的教導，與第一世紀末到第二世紀初小亞細亞的處境相合；而且三封信用字與約翰福音相近，應屬同一時期。這派的優點是有早期教父的傳統支持，也和信的內容彼此呼應。</p><p><strong>難處：</strong>這主要建立在教會傳統上，經文本身沒有提到以弗所；「與約翰福音同時期」也要先接受約翰福音成書較晚的看法。對手的教導究竟在甚麼時候出現，學者也沒有一致的定論。</p>"],["較早說（主後 70 年以前）","","<p>少數學者（如英國的羅賓遜 J. A. T. Robinson）主張新約各卷大多寫於主後 70 年聖殿被毀以前，約翰書信也包括在內。理由之一是：如此重大的事件，新約書卷沒有一處明說它已經發生。這派的優點是提醒我們不要把「晚期」當成定論，也重新檢查許多被視為理所當然的年代推論。</p><p><strong>難處：</strong>約翰書信本來就不談聖殿與猶太的事，用「沒有提到聖殿被毀」來定年，對這三封信說服力有限；而且主張越早，就越難解釋信中那種群體已經分裂、迷惑人的「從我們中間出去」的成熟處境。多數學者沒有採納這個說法。</p>"],["存疑說（經文沒有說，就不要定）","","<p>還有許多學者採取保留的態度：既然信中沒有任何可以定年、定地的線索，最誠實的做法是說「大約第一世紀後半，小亞細亞一帶的可能最大」，然後停下來。這派的優點是謙卑，不讓推論冒充成經文的明說，也讓讀者把注意力放回信的內容。</p><p><strong>難處：</strong>若一切都說「不知道」，讀者就很難想像那扇門的處境；而早期教會的傳統雖然不等於經文，也不是毫無根據的猜測。存疑的態度要和尊重傳統一起拿捏。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採傳統的說法——約主後 85--95 年，以弗所一帶，與約翰一書相近；較早說與存疑說並陳，不據此建立任何解經結論。</strong>講台可以說「傳統認為」，不說「經文說」。</p><p>這樣定位，讓我們看見一幅具體的畫面：一位年老的牧者，見過主、聽過主、摸過主（約壹 1:1），如今看著自己一生建立的家庭教會網絡，被一群「從我們中間出去」的人衝擊；他先用一張莎草紙寫信，把最要緊的話送到——「卻不願意用紙墨寫出來，但盼望到你們那裡，與你們當面談論」（1:12）。年代與地點是背景，前景永遠是那位「有父又有子」的主（1:9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約許多書卷的年代都有討論，這是歷史研究的正常狀態，不是聖經的破洞。約翰二書的信息不靠一個確定的年份成立。</p><p>但這一題可以給你一份安慰：<strong>這封信是一位老人寫的。</strong>不論是六十年代還是九十年代，長老都已經跟隨主很多年了；他到老還在寫「我們大家要彼此相愛」（1:5），到老還盼望見面。信心不是年輕人的激情，是一生在真理中行走、到老還在愛人的路。</p>"]],"con":[],"say":"本講義的全卷立場：採傳統說法——約主後 85--95 年，以弗所一帶，與約翰一書相近；較早說（主後 70 年以前）與存疑說並陳。經文本身沒有地名與可定年的事件，講台說「傳統認為」，不據此建立解經結論。","care":"席上會有一聽到「學者對年代有爭論」就以為聖經靠不住的初信者；也有喜歡考據、把年代問題當成辯論題目的弟兄。牧者要讓前者知道，年代未定不等於內容不可信；讓後者知道，考據是好的，但不要讓它取代這封信要我們做的事。不要在講台上把傳統說成經文的明說，也不要嘲笑持不同年代看法的人；這一題點到為止，把時間留給 1:6 的愛。"},{"id":"ISS00_7","t":"約翰一、二、三書的關係：二書關門、三書開門，是同一個標準嗎？","r":"1:10--11；約參 5--10","ch":[],"why":"七、二書關門、三書開門，是同一位長老、同一個標準——全卷通用題。約翰二書很少單獨被讀懂：它的用字幾乎全部來自約翰一書，它的處境又和約翰三書成了一對鏡子。二書叫一個家不要接待傳另一個基督的教師；三書卻稱讚該猶接待為主名出外的弟兄，責備丟特腓不肯接待。若只讀二書，會把門關得太緊；若只讀三書，會把門開得太大。這一題要講清楚三封信的關係與先後，更要講清楚那扇門的標準。","pos":[["【一】經文問的是甚麼","","<p>先看二書與一書的重疊：「從起初」（1:5、6；約壹 2:7）、「彼此相愛」（1:5；約壹 3:11）、「認耶穌基督是成了肉身來的」（1:7；約壹 4:2）、「敵基督」（1:7；約壹 2:18、22）、「使你們的喜樂滿足」（1:12；約壹 1:4）。再看二書與三書的重疊：開頭都是「作長老的寫信給……就是我誠心所愛的」（1:1；約參 1），長老都為兒女在真理中行而歡喜（1:4；約參 3--4），結尾都說「不願意用紙墨」、盼望「當面談論」（1:12；約參 13--14）。</p><p>最有意思的是那扇門：二書說「不要接他到家裡」（1:10），三書說「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（約參 8）<strong>經文問的是：三封信的先後與關係是甚麼？同一位長老，為甚麼一封叫人關門、一封叫人開門？標準是甚麼？</strong></p>"],["一書在先說（二書是一書濃縮給一個家的版本）","","<p>多數學者認為約翰一書在先：它是寫給一群教會的長篇牧函，全面處理分裂、敵基督、罪與確據；二書則把一書的信息濃縮成一張莎草紙，寄給一個具體的家庭教會，提醒她在門口守住同樣的標準。這派的優點是解釋了二書為甚麼像一書的摘要，也讓兩封信彼此照明：一書講原則，二書講那扇門。</p><p><strong>難處：</strong>用字相近並不能證明先後；一封短信也可能是先寫的，後來才展開成長篇。而且二書沒有提到一書，兩封信的關係仍是推論。</p>"],["二書在先說（二書是早期的警告，一書是後來的全面處理）","","<p>也有學者認為二書較早：迷惑人的剛開始出現，長老先寫一封短信提醒一個家庭教會；後來分裂擴大，「他們從我們中間出去」（約壹 2:19），長老才寫了一書作全面的處理。這派的優點是看見處境的發展：問題從一扇門開始，後來才成了整個群體的危機。</p><p><strong>難處：</strong>二書 1:7 說「有許多迷惑人的出來」，已經和一書「現在已經有好些敵基督的出來了」（約壹 2:18）的規模相近，看不出是剛開始的樣子；這派的重建也和前一派一樣，只能是推論。</p>"],["約參 9 那封信說（二書就是三書提到的那封信）","","<p>三書說：「我曾略略地寫信給教會，但那在教會中好為首的丟特腓不接待我們。」（約參 9）有學者主張，這封「略略地寫」給教會的信就是約翰二書——長老寫信給那間教會（蒙揀選的太太），教導接待的標準，卻被丟特腓擋下來；所以長老轉而直接寫信給該猶。這派的優點是把三封信串成一個故事，也把二書「教會」讀法與三書的處境連起來。</p><p><strong>難處：</strong>二書的內容是警告不要接待傳另一個基督的人，三書裡丟特腓的問題卻是不接待長老所差的弟兄，兩件事方向相反，很難說是同一封信引起的；而且經文沒有說約參 9 那封信寫了甚麼。多數學者沒有採納，本講義只作為一說並陳。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三封信出自同一位長老，寫於相近的時期；先後採一書在先說，二書在先說與「約參 9 那封信」說並陳，不定論。最要緊的不是先後，是那扇門：二書叫人關門，三書叫人開門；標準不是認不認識、喜不喜歡，是傳不傳基督。</strong></p><p>二書關的是給「不認耶穌基督是成了肉身來的」（1:7）教師的講台與祝福；三書開的是給「為主的名出外，對於外邦人一無所取」（約參 7）的弟兄的接待與送行。丟特腓的錯，正好是把該開的門關了：「他自己不接待弟兄，有人願意接待，他也禁止，並且將接待弟兄的人趕出教會。」（約參 10）所以這扇門有兩種壞法：一種是把甚麼人都放進講台，一種是把為真理做工的弟兄擋在門外。</p><p>三封信的關係另見約翰一書講義的議題「約翰一、二、三書是甚麼關係？」。本講義的約翰三書講義尚未製作，這裡只引出處；兩卷完成後，這一題會在兩卷之間互相指引。互見〈接待、問安與界線：10--11 節在第一世紀是甚麼意思，今天該怎樣應用？〉。</p>"],["【四】這件事該不該影響你的信心","","<p>三封信的先後，學者沒有定論，這不該動搖你的信心。三封信的聲音是一致的：在真理中愛人、為兒女在真理中行而歡喜、盼望當面相見。</p><p>但有一件事該問自己：<strong>我比較像二書裡那個需要學會關門的家，還是像三書裡那個需要學會開門的教會？</strong>有人太容易被人情說服，甚麼講員都請；有人太容易懷疑，連為主奔走的弟兄也不接待。同一位長老兩邊都說，因為他看的不是門，是那位進門的主。</p>"]],"con":[],"say":"本講義的全卷立場：約翰一、二、三書出自同一位長老、寫於相近時期；先後採一書在先說，並陳二書在先說與「約參 9 那封信」說。二書關門、三書開門（約參 5--8），標準不是認不認識，是傳不傳基督；丟特腓的錯正是把該開的門關了（約參 10）。","care":"席上會有曾經被教會領袖擋在門外、像約參 10 那些被「趕出教會」的人；也有接待過講員、後來才發現對方的教導有問題，一直自責的接待家庭。牧者要讓前者知道，長老在三書裡為他們說話；讓後者知道，分辨是一起學的，不是一個人扛的。不要在講台上把三書的丟特腓對號入座到某位同工身上，也不要只講二書的關門而不講三書的開門。"},{"id":"ISS00_8","t":"這封短信為甚麼被收進正典？","r":"1:1--13","ch":[],"why":"八、一張莎草紙的信，怎樣成了聖經？——全卷通用題。約翰二書只有十三節，是新約第二短的書；作者只稱自己「長老」，收信人沒有名字，內容大多在約翰一書裡已經講過。早期教會對二書、三書確實有過遲疑，優西比烏甚至把它們列在「有爭議的」書卷裡。這一題要誠實講出這段歷史：只講確定的史實，不誇大，也不掩蓋；讓會眾知道，正典不是一夜之間從天上掉下來的名單，而是教會在長期的閱讀與分辨中認出來的。","pos":[["【一】經文問的是甚麼","","<p>約翰二書本身沒有說它是寫給全教會的經典；它是一封寫給一個家的短信：「作長老的寫信給蒙揀選的太太和她的兒女」（1:1），結尾是一句問安（1:13）。它沒有使徒的署名，沒有長篇的教義，連長老自己都說「我還有許多事要寫給你們，卻不願意用紙墨寫出來」（1:12）。</p><p>可是它的內容又和約翰一書、約翰福音同一個聲音：真理、愛、從起初的命令、「認耶穌基督是成了肉身來的」（1:7；約壹 4:2）。<strong>經文問的是：這樣一封私人短信，為甚麼被教會保存、抄寫、在聚會中誦讀，最後被認定為正典？早期的遲疑是甚麼？教會又是根據甚麼接納它？</strong></p>"],["遲疑的聲音（篇幅短、作者自稱長老、流傳不廣）","","<p>早期確實有遲疑。優西比烏在《教會史》3.25 把「所謂的約翰二書、三書」列在「有爭議的」書卷中，說它們是否出自福音書的作者約翰，還是另一位同名的人，尚有不同的意見——但他同時說明這些書卷是許多人所熟知的。他在 6.25 又引俄利根的話：約翰留下一封篇幅很短的書信，或許還有第二、第三封，因為不是所有人都承認後兩封是真的。敘利亞教會早期通行的別西大譯本（Peshitta），也沒有收入約翰二書、三書。</p><p>遲疑的理由不難理解：信很短，流傳的機會少；作者只稱「長老」，引起「是哪一位約翰」的問題；內容大多與一書重疊，看起來沒有獨立的份量。<strong>但要注意：</strong>這些遲疑關乎作者與流傳，從來沒有人指出它的教導與使徒的信仰有甚麼衝突。</p>"],["接納的理由（同一個聲音、早期的引用、教會普遍使用）","","<p>另一方面，二書很早就被引用。愛任紐在第二世紀末的《駁異端》裡，引用 1:11（1.16.3）和 1:7（3.16.8），並且認為那是主的門徒約翰的話。穆拉托利殘篇（傳統定在第二世紀末，也有學者主張更晚）提到大公教會接納「上述約翰的兩封書信」，至於是哪兩封，學者有不同的解讀。到了第四世紀，亞他那修在主後 367 年的第三十九封節期書信裡列出新約二十七卷，約翰的三封書信都在其中；主後 397 年的迦太基會議也照樣承認。</p><p>接納的理由也很清楚：它與約翰一書同一個聲音、同一個標準；它被各地教會長期誦讀；它所傳的正是「有父又有子」的信仰。<strong>難處：</strong>這些引用與名單之間有空隙，某些地區接受得較晚；接納是一個漸進的過程，不是某一次會議突然決定的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約翰二書是正典，與新約其他書卷有同等的權威。早期的遲疑是真實的歷史，本講義照實陳列——優西比烏列為「有爭議的」書卷、俄利根提到不是所有人都承認；也照實陳列接納的過程——愛任紐的引用、穆拉托利殘篇、亞他那修的書目、迦太基會議。</strong></p><p>遲疑的焦點在作者與流傳，不在內容；而教會最後普遍接納它，是因為在長期的閱讀中認出
