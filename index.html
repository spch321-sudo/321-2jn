了同一位牧者的聲音、同一個基督論的標準。<strong>教會沒有「製造」正典，是「認出」正典。</strong></p><p>這封短信被收進來，對教會是一份禮物：約翰一書講原則，二書把原則放在一扇家門口；沒有它，我們少了一個教會怎樣在不冷落任何人的情況下守門的範例，也少了一句對所有遠距牧養特別親切的話——紙墨是橋，見面使喜樂滿足（1:12）。</p>"],["【四】這件事該不該影響你的信心","","<p>知道早期教會對二書有過遲疑，不該動搖你的信心，反而應該讓你安心：教會不是照單全收，是認真地分辨過、討論過，才確認了這些書卷。一個經過檢驗的結論，比從來沒有被問過的結論更可靠。</p><p>而且這一題本身就是二書的信息：<strong>分辨不是懷疑，是愛。</strong>早期教會守住正典的門，和蒙揀選的太太守住家門，是同一種忠心。一張差點被遺落的莎草紙，今天在世界各地被誦讀——那位說「使你們的喜樂滿足」的主，沒有讓這封小信遺失。</p>"]],"con":[],"say":"本講義的全卷立場：約翰二書是正典。早期的遲疑照實陳列——優西比烏《教會史》3.25 列為「有爭議的」書卷、俄利根提到不是人人承認；接納的過程也照實陳列——愛任紐引用、穆拉托利殘篇、亞他那修 367 年書目、397 年迦太基會議。遲疑在作者與流傳，不在內容；教會是認出正典。","care":"席上會有讀過網路文章、聽說「聖經是後來的人投票決定的」而動搖的年輕人；也有從來沒聽過正典歷史、一聽到「有爭議的書卷」就嚇一跳的長輩。牧者對前者要誠實地講歷史，不要說「那都是騙人的」，陪他看接納的過程；對後者要安撫，讓他知道教會的分辨正是為了保護我們。不要把正典的歷史講成陰謀，也不要把它講成沒有任何討論；只講確定的史實，不確定的就說不確定。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:1--13","ch":[],"why":"九、在根基上站穩，在枝節上並陳——全卷通用題。約翰二書只有十三節，卻碰到一連串爭議：作者是哪一位約翰、太太是教會還是婦人、現在分詞怎麼讀、8 節的異文、9 節的「越過」、10--11 節的接待、寫作年代、三封信的先後、正典的歷史。對許多信徒來說，這麼短的一封信有這麼多「學者認為」，本身就令人不安；也有人反過來，把每一個爭議都當成戰場。這一題要說明：哪些可以並陳，哪些不能退讓，以及為甚麼誠實面對爭議，本身就是在學習這封信的功課。","pos":[["【一】經文問的是甚麼","","<p>這封信本身就在示範怎樣面對分歧。長老沒有回應迷惑人的每一個論點，他只抓住一個標準：「他們不認耶穌基督是成了肉身來的」（1:7）；又說「常守這教訓的，就有父又有子」（1:9）。可是同一封信也很謙卑：他承認「我還有許多事要寫給你們」（1:12），沒有假裝一張紙能把話說盡。</p><p><strong>經文問的是：面對這麼多爭議，信徒該怎樣自處？哪些分歧是可以彼此尊重、慢慢討論的，哪些是長老說「就沒有神」（1:9）的界線？研究與提問，會不會讓人越讀越不信？</strong></p>"],["迴避說（這些事不必知道，單純信就好）","","<p>教會裡常見的反應是：這些爭議會絆倒人，最好不要在講台上提，信徒只要單純地信就好。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們信心不是靠學問得來的；保羅也勸「信心軟弱的，你們要接納，但不要辯論所疑惑的事」（羅 14:1）。</p><p><strong>難處：</strong>正是因為教會沒有講清楚，10--11 節才會被拿來叫人冷落家人，「敵基督」才會被貼在各種人身上，8 節才會被拿來嚇人。沒有講過的經文，最容易被誤用的人搶先解釋；而且把提問的人看成不屬靈，正是本講義要擋下的誤讀——問問題不是越過，離開基督才是。</p>"],["全盤懷疑說（爭議這麼多，聖經就不可靠）","","<p>另一種反應走向另一端：連作者是誰、哪一個異文是原文都有爭議，那麼整本聖經都只是人的意見。這派的優點是誠實地面對了問題，不肯用信仰的口號掩蓋困難。</p><p><strong>難處：</strong>這派把「不確定的枝節」與「不確定的根基」混為一談。約翰二書的異文（1:3、7、8、9、12、13）沒有一處改變信息的核心；作者的討論在使徒與另一位約翰之間，不在一位真實的見證人與一個捏造者之間；正典的歷史顯示的是教會認真的分辨，不是隨意的拼湊。把每一個討論都當成整體崩塌的證據，本身也是一種沒有經過分辨的結論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。</strong>全卷的爭議，本講義已在各題交代：〈作者、收信人與處境：長老、蒙揀選的太太與巡迴教師各是誰？〉、〈真理與愛：可以只用一隻手嗎？〉、〈接待、問安與界線：10--11 節在第一世紀是甚麼意思，今天該怎樣應用？〉、〈分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？〉、〈賞賜與確據：8 節「不要失去你們所做的工」，是說會失去救恩嗎？〉、〈寫作年代與地點：約翰二書寫於何時、何地？〉、〈約翰一、二、三書的關係：二書關門、三書開門，是同一個標準嗎？〉、〈這封短信為甚麼被收進正典？〉。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。</p><p>但有幾件事，全卷沒有任何一個爭議動搖過：<strong>恩惠、憐憫、平安從父神和祂兒子耶穌基督而來（1:3）；「我們若照他的命令行，這就是愛」（1:6）；耶穌基督是成了肉身來的（1:7）；「常守這教訓的，就有父又有子」（1:9）；而且長老盼望「使你們的喜樂滿足」（1:12）。</strong>這是約翰二書的根基，也是本講義全卷的根基。</p>"],["【四】這件事該不該影響你的信心","","<p>派別之爭不該影響你的信心。問問題不是不信；長老自己也說還有許多事沒有寫，他沒有假裝一張紙說得盡一切。</p><p>但有一件事該影響你：<strong>讀完這封信，我守住的是一套答案，還是一位主？</strong>答案可以有討論，那一位不會改變——「這真理存在我們裡面，也必永遠與我們同在」（1:2）。爭議可以慢慢想，喜樂卻不必等到所有問題都解決；那位成了肉身來的主，已經先來到我們的門口。</p>"]],"con":[],"say":"本講義的全卷立場：約翰二書的爭議都發生在「怎樣理解」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。恩惠憐憫平安從父與子而來、照祂的命令行就是愛、耶穌基督是成了肉身來的、常守這教訓的就有父又有子，這些沒有一個爭議動搖過。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人；有一聽到「學者有爭論」就不安的長輩；還有曾經被人用這封信傷過——被叫去冷落家人、被貼上「迷惑人的」標籤、被用 8 節恐嚇——因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，先陪他；對第二種人，指給他看 1:2 與 1:3；對第三種人，讓他知道傷他的是人錯用了經文，不是那位「有父又有子」的主。疑惑若伴隨長期失眠或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"「蒙揀選的太太」是一位婦人、一間教會，還是人名？","r":"1:1--1；1:5；1:13；彼前 5:13；門 1:2","ch":[1],"why":"約翰二書第一句就把讀者擋在門口：收信的「蒙揀選的太太」到底是誰？讀成一位姊妹，這封信就是寫給一個打開家門接待教會的家；讀成一間教會，整封信就是長老寫給一個會眾的牧函。這一題決定我們怎樣聽 4 節的「兒女」、10 節的「家」、13 節的「姊妹」，也常常被人順手拿來替女性事奉的爭論添一筆——所以要先把三種讀法誠實擺出來。","pos":[["【一】經文問的是甚麼","","<p>信的開頭是「作長老的寫信給蒙揀選的太太和她的兒女」（1:1）。「太太」原文 κυρία，是「主」κύριος 的陰性，意思是「女主人、夫人」；和合本在這裡有註腳：太太，或譯：教會；下同。5 節長老又一次稱她「太太啊」，信末說「你那蒙揀選之姊妹的兒女都問你安」（1:13）——問安的是姊妹的兒女，姊妹本人沒有出聲。全信又在單數的「你」（4、5、13 節）與複數的「你們」（6、8、10、12 節）之間來回。經文問的是：長老說話的對象，是一個人、一個家，還是一整個會眾？</p>"],["一間地方教會的擬人（本講義傾向的讀法）","","<p>這一讀認為「蒙揀選的太太」是一間地方教會，「她的兒女」是會眾，13 節的「姊妹」是長老所在的那間姊妹教會。理由有三：13 節姊妹本人不問安、只有她的兒女問安，放在兩間教會之間最自然；單數「你」與複數「你們」的轉換，像是一面對著教會、一面對著她的會眾說話；新約也有這種筆法——「在巴比倫與你們同蒙揀選的教會問你們安」（彼前 5:13），保羅又把教會說成基督的新婦（弗 5:25--32）。整封信的內容——彼此相愛、分辨教師、接待誰——也是一整個會眾的事。</p><p><strong>難處：</strong>私人書信開頭用擬人並不常見；「太太」「兒女」「姊妹」連用三個家人稱謂都當比喻，要讀者在一封短信裡一路轉譯，並不是最簡單的讀法。如果長老要寫給一間教會，為甚麼不像約翰三書那樣直接說「教會」（約參 9）？</p>"],["一位姊妹與她的家","","<p>這一讀照字面：收信的是一位在信仰上受敬重的婦人，她的兒女就是她的孩子，她的家很可能就是聚會的地方。這在第一世紀很常見——保羅寫信問候「在你家的教會」（門 1:2），彼得出監後去的是「馬可的約翰、他母親馬利亞家」，那裡「有好些人聚集禱告」（徒 12:12）。照這一讀，10 節「不要接他到家裡」就格外具體：這位姊妹的家門，正是巡迴教師要進來講道的門。</p><p><strong>難處：</strong>若 13 節的「姊妹」也是一位婦人，為甚麼問安的是她的兒女、不是她本人？而 6、8、10、12 節的複數「你們」，也不太像只對一位母親和幾個孩子說話；信裡要她分辨教師、守住聚會的講台，比較像是對一個群體下的託付。</p>"],["人名說（Kyria 或 Electa）","","<p>第三讀把其中一個字當作名字：κυρία 在當時的書信裡可以作人名「居里亞」，所以有人讀成「寫給蒙揀選的居里亞」；也有人把 ἐκλεκτή「蒙揀選的」讀成人名「伊勒克塔」，譯成「寫給伊勒克塔夫人」。古代教父中已有人這樣讀，它的好處是讓這封信落在一個有名有姓的人身上。</p><p><strong>難處：</strong>若「伊勒克塔」是名字，13 節「你那蒙揀選之姊妹」的姊妹也用同一個字，兩姊妹同名，很不自然；若「居里亞」是名字，5 節「太太啊」的呼喚就成了直呼其名，但同一個字在 1 節與「蒙揀選的」連用，比較像稱謂而不是名字。支持這一讀的學者現在很少。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義傾向第一讀（一間教會的擬人），三讀並陳、不作裁判；三讀都能在講台上用。</strong>無論她是一間教會，還是一位打開家門讓教會聚集的姊妹，這封信都落在一個家門口：門裡有被愛的兒女，門外有不斷來敲門的人。講台可以說「這位太太——很可能是一間教會」，不可以說「經文明說是教會」或「經文明說是一位婦人」。</p><p>這一節也<strong>不拿來替女性事奉的任何定論背書，也不拿來反對</strong>：經文沒有談她的職分，只談她的家、她的兒女、她的門。那一題請回到哥林多前書講義與提摩太前書講義各自的全卷立場。本講義的全卷立場見議題「作者、收信人與處境：長老、蒙揀選的太太與巡迴教師各是誰？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法對信的核心沒有一點分歧：她是「蒙揀選的」，是長老「誠心所愛的」，而愛她的理由是「這真理存在我們裡面，也必永遠與我們同在」（1:2）。我們不知道她的名字，正好提醒我們：神記得的名字，比教會歷史留下的多得多。</p><p>無論你是一位在家裡開門的姊妹，還是一間小小的家庭教會，長老對你說的都是同一句話：你是被揀選的、被愛的，而且被愛是「在真理和愛心上」（1:3）。這比知道她叫甚麼名字重要得多。</p>"]],"con":[],"say":"本講義的立場：「蒙揀選的太太」三讀並陳——一間教會的擬人、一位姊妹與她的家、人名；本講義傾向教會讀法，不作裁判，三讀都能在講台上用。這一節不替女性事奉的任何定論背書，也不用來反對。本講義的全卷立場見議題「作者、收信人與處境：長老、蒙揀選的太太與巡迴教師各是誰？」。","care":"會眾席上可能有正在家裡開放聚會的姊妹，也可能有在女性事奉的爭論裡受過傷的人。不要用這一節替任何一方加分——聽到「其實太太是教會」，有的姊妹會覺得自己又一次從經文裡被抹掉；聽到「這是一位女領袖」，有的人會覺得講台在推一個立場。牧者可以告訴她：無論哪一讀，長老都稱這一家是「蒙揀選的」、是他誠心所愛的；打開家門接待教會的人，在新約裡一直被記念。不要在講台上把這一題講成性別辯論。"},{"id":"ISS01_2","t":"「作長老的」是誰？為甚麼不稱自己是使徒？","r":"1:1--1；約參 1；彼前 5:1","ch":[1],"why":"約翰二書、三書都只用一個稱呼開頭：「作長老的」。他沒有報名字，也沒有說自己是使徒。這引出兩個問題：寫信的到底是誰？如果是使徒約翰，他為甚麼只稱長老？這一題影響我們怎樣聽這封信的權柄——也提醒講台：分辨的焦點不在這位長老有多大的名望，而在他所指向的那一位「有父又有子」的主。","pos":[["【一】經文問的是甚麼","","<p>信的第一個字是 Ὁ πρεσβύτερος，有冠詞：不是「一位長老」，是「那位長老」。收信的人一看就知道是誰，所以不必報名字。πρεσβύτερος 本來是「年長的人」，也是教會職分的稱呼；徒 20:17 保羅「請教會的長老來」用的就是這個字。約翰三書以幾乎同一句話開頭：「作長老的寫信給親愛的該猶，就是我誠心所愛的。」（約參 1）經文問的是：這位不必報名字的長老是誰？他所說的「長老」，是年紀、職分，還是一個眾人都知道的尊稱？</p>"],["使徒約翰說（教會的傳統讀法）","","<p>從愛任紐起，教會的傳統把約翰二書歸給使徒約翰：他晚年住在以弗所一帶，被各教會敬重為「那位長老」。理由在經文裡：二書的用字與約翰福音、約翰一書幾乎一樣——真理、從起初、彼此相愛、常守、「認耶穌基督是成了肉身來的」。使徒自稱長老也有先例，彼得勸「你們中間與我同作長老的人」（彼前 5:1）。一位見過、聽過、摸過主的老人，用「長老」這個謙卑又帶著年紀的稱呼，十分自然。</p><p><strong>難處：</strong>信裡沒有一個字自稱使徒；面對挨家挨戶要求接待的教師，他也沒有動用使徒的權柄，只是「勸」。約翰三書裡的丟特腓甚至「不接待我們」（約參 9），似乎不太把這位長老放在眼裡。這些都要誠實擺出來。</p>"],["長老約翰說（帕皮亞提到的另一位約翰）","","<p>第二世紀初的帕皮亞說，他向跟過主的人打聽，問使徒們說過甚麼，又問亞里斯丟和「長老約翰」說些甚麼。優西比烏在《教會史》3.39 引了這段話，並且認為名單裡有兩個約翰：一位是使徒，一位是「長老約翰」。這一派主張約翰二書、三書是這位長老約翰寫的——他自稱「作長老的」，正合他的稱號。</p><p><strong>難處：</strong>帕皮亞那段話也可以讀成同一位約翰被提了兩次——先在使徒名單裡，再作為還在世、可以被請教的見證人；「兩個約翰」是優西比烏的解讀。長老約翰除了這段話，在早期文獻裡幾乎沒有自己的面貌，要把書信掛在他名下，根據相當單薄。</p>"],["約翰群體說（一位領袖、一個圈子）","","<p>二十世紀許多學者提出：約翰福音與約翰書信出自一個以使徒約翰的見證為核心的信徒群體，寫二書、三書的是這個群體裡一位受敬重的領袖，大家都叫他「那位長老」。這一說把處境讀得很具體：一個圈子、幾個家庭教會、一條巡迴傳道人來往的路線，正經歷「他們從我們中間出去」（約壹 2:19）的分裂。</p><p><strong>難處：</strong>這個「群體」是從經文反推出來的，成員、地點與歷史都是推論；推論一層疊一層，很容易讓重建出來的圖畫比經文本身說得還多。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義沿用約翰一書講義的議題「作者、年代與處境」：寫信的長老是使徒約翰；長老約翰說與約翰群體說並陳，不裁判。</strong>講台可以寫「長老說」，也可以寫「約翰說」。他不稱使徒，本講義讀成一種牧者的姿態：他「勸」而不是命令（1:5），把自己放進「我們大家要彼此相愛」的「我們」裡。</p><p>但要記得焦點的次序：這封信要人守住的不是長老的名望，而是「常守這教訓的，就有父又有子」（1:9）。無論作者是使徒本人還是他門下的長老，信的信息不因此改變。本講義的全卷立場見議題「作者、收信人與處境：長老、蒙揀選的太太與巡迴教師各是誰？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。約翰二書的權柄不靠作者的頭銜，教會在長期的閱讀裡認出的，是同一位牧者的聲音、同一個基督論的標準。就算我們永遠無法百分之百確定作者是誰，「耶穌基督是成了肉身來的」這句話也不會因此變輕。</p><p>倒是這位長老的姿態值得我們學：他有分量，卻選擇只稱自己是長老；他有權柄，卻說「我現在勸你」。真正有權柄的人，常常不急著拿出頭銜。</p>"]],"con":[],"say":"本講義的立場：沿用約翰一書講義的議題「作者、年代與處境」——長老是使徒約翰，並陳帕皮亞提到的長老約翰說（優西比烏《教會史》3.39）與約翰群體說，不裁判；講台可寫「長老說」「約翰說」，焦點在那位有父又有子的主，不在長老的名望。本講義的全卷立場見議題「作者、收信人與處境：長老、蒙揀選的太太與巡迴教師各是誰？」。","care":"會眾席上可能有人聽過「聖經作者其實不是某某」的說法，心裡從此對整本聖經起了疑問；也可能有人把屬靈權柄完全綁在某位領袖的頭銜上。對前一種人，牧者可以陪他看見：作者的爭議是歷史的問題，信的內容與教會的接納並沒有因此動搖。對後一種人，可以溫柔地指出：連寫這封信的長老都不靠頭銜說話。不要用「你連作者是誰都要懷疑」去責備提問的人。"},{"id":"ISS01_3","t":"「有照……遵行真理的」——只有部分兒女在真理中行嗎？","r":"1:4--4；約參 4","ch":[1],"why":"4 節中文讀起來很溫暖，原文卻藏著一個小介系詞：ἐκ τῶν τέκνων σου，「你的兒女中有些」。這一個「有些」，有人讀成長老暗示其他兒女已經走偏，有人讀成長老只是說他遇見的那幾位。這一題看似文法細節，卻直接碰到會眾席上最痛的一群人——兒女還沒信主、或已經離開信仰的父母。","pos":[["【一】經文問的是甚麼","","<p>和合本譯作「我見你的兒女，有照我們從父所受之命令遵行真理的，就甚歡喜」（1:4）。原文 εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ：ἐκ 加屬格是部分詞，意思是「你的兒女中有些……」，不是「你所有的兒女」。εὕρηκα 是完成式，「我遇見了」，那一刻到今天還在長老心裡；περιπατοῦντας 是現在分詞，在真理中行走是持續的生活樣式。經文問的是：這個「有些」是在暗示其他兒女不在真理中，還是只是長老照實說他所遇見的那幾位？</p>"],["暗示說：只有部分兒女遵行真理","","<p>這一讀認為部分詞是有意的：長老只能為「有些」兒女歡喜，因為另一些已經被迷惑人的帶走了。理由是 7 節緊接著就說「因為世上有許多迷惑人的出來」（1:7），8 節又要他們「要小心」；約翰一書也提到「他們從我們中間出去」（約壹 2:19）。照這一讀，4 節的歡喜裡藏著一份憂慮，整封信是為了保住還在真理中的人。</p><p><strong>難處：</strong>經文本身沒有說其餘的兒女怎樣了；一個介系詞承受不了「其他人都離開了」這麼重的結論。如果長老要說有人走偏，他在 7--11 節完全有機會明說，但他說的是門外來的教師，不是門內的兒女。</p>"],["見證說：長老只說他所遇見的那幾位","","<p>這一讀認為部分詞只是照實陳述：長老在旅途中、或在自己所在的教會裡，遇見了這家的幾個兒女，看見他們在真理中行走，就為此歡喜。他沒有見過全部的人，所以只說「有些」——這是一個誠實的見證人的說法，不是一個隱藏的指控。約翰三書也有同樣的語氣：「我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的。」（約參 4）</p><p><strong>難處：</strong>這一讀可能把 4 節讀得太輕鬆；7 節的「因為」與 8 節的「要小心」確實提醒我們，這一家正在一個有風險的處境裡，長老的歡喜不是沒有掛慮的歡喜。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩讀並陳：經文確定「有些」兒女在真理中行，長老為此甚歡喜；經文沒有說其餘的兒女怎樣了。</strong>講台不由這一個介系詞推論「其他兒女都離開了」，也不把它講成「長老在暗中責備這位母親」。</p><p>更要緊的是：4 節是<strong>長老的歡喜，不是父母的成績單</strong>。長老沒有說「你教得好」，他說「有照我們從父所受之命令遵行真理的」——命令是從父來的，在真理中行走是父的工作在人身上結的果子。兒女走甚麼路，有父母的愛與擺上，也有兒女自己的心，更有神自己的時間。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。4 節留給我們的，是一位屬靈長輩為別人的兒女歡喜的心——這是教會最美的樣子之一：我們不只為自己的孩子禱告，也為別人的孩子在真理中行而歡喜。</p><p>對兒女還沒信主的父母，這一節不是判決書，是一個盼望：今天還在路上的兒女，有一天也可能讓某位長輩「就甚歡喜」。神沒有忘記他們——「即或有忘記的，我卻不忘記你」（賽 49:15）。</p>"]],"con":[],"say":"本講義的立場：ἐκ τῶν τέκνων σου 是部分詞「你的兒女中有些」，暗示說與見證說並陳；經文沒有說其餘的兒女怎樣了，講台不由此推論他們都離開了。4 節是長老的歡喜，不是父母的成績單。","care":"會眾席上一定有為兒女流淚的父母：孩子還沒信主、曾經信了又離開、或正在一段很遠的路上。他們聽到 4 節，最怕的是一句「你的兒女怎麼沒有遵行真理？」不要說這句話，也不要用「教養得好，孩子就會信」去暗示他們做錯了甚麼——兒女的信仰不是父母的分數。牧者可以陪他們為孩子代禱，告訴他們：長老的歡喜是一個盼望，不是一個標準；神比我們更愛我們的孩子。也記得在講台上為這些父母禱告，而不是把他們當作例子。"},{"id":"ISS01_4","t":"「成了肉身來的」用現在分詞——指道成肉身，還是再來？","r":"1:7--7；約壹 4:2","ch":[1],"why":"7 節是全卷的分水嶺：「不認耶穌基督是成了肉身來的」，就是迷惑人的、敵基督的。約翰一書說同一件事時用完成式分詞「已經來了」，約翰二書卻用現在分詞 ἐρχόμενον。這個時態的差別，有人讀成道成肉身，有人讀成將來在肉身中再來。這一題決定分辨的標準落在哪裡——而標準一旦放錯，就很容易把「敵基督」的標籤貼到不該貼的人身上。","pos":[["【一】經文問的是甚麼","","<p>「因為世上有許多迷惑人的出來，他們不認耶穌基督是成了肉身來的；這就是那迷惑人、敵基督的。」（1:7）原文 Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί，ἐρχόμενον 是現在分詞。約翰一書說：「凡靈認耶穌基督是成了肉身來的，就是出於神的」（約壹 4:2），那裡用的是完成式分詞 ἐληλυθότα，「已經來了」。中文兩處都譯成「成了肉身來的」，原文卻換了時態。經文問的是：二書的現在分詞，說的是過去那一次的道成肉身，還是將來的再來，還是一個不帶時間的稱號？</p>"],["道成肉身說（多數解經家）","","<p>這一讀認為二書與約翰一書說的是同一件事：耶穌基督真的成了肉身。現在分詞不是指「正在來」，而是強調「在肉身中來的這一位」是祂持續的身分——祂成了肉身，至今仍是那一位。約翰福音說：「道成了肉身，住在我們中間」（約 1:14）。這一讀最合處境：那些「從我們中間出去」的教師，很可能否認神的兒子真的有血有肉，認為屬靈的基督不可能沾上肉身；長老的標準正對準這一點。</p><p><strong>難處：</strong>它要解釋為甚麼長老不照約翰一書用完成式，而改用現在分詞；「持續的身分」這個說法合理，但仍是解釋，不是文法上唯一的可能。</p>"],["再來說（少數學者）","","<p>這一讀把現在分詞當作帶著將來意味的「要來」：迷惑人的否認的，是耶穌基督將在肉身中再來。新約確實有用現在式說將來的筆法；約翰一書也盼望「主若顯現，我們必要像他」（約壹 3:2）。照這一讀，對手的錯在末世論：他們以為只有一個屬靈的、不再有身體的基督。</p><p><strong>難處：</strong>約翰書信的整體焦點在耶穌是誰——「不認父與子的，這就是敵基督的」（約壹 2:22）——而不在再來的方式；把二書的標準讀成末世論，會讓二書與一書在同一個題目上說兩件不同的事。支持者不多。</p>"],["稱號說（「那在肉身中來者」）","","<p>這一讀把 ἐρχόμενον 看成不帶時間的稱號，像「那將要來的」一樣：「那將要來的是你嗎？還是我們等候別人呢？」（太 11:3）照這一讀，「在肉身中來者」是對耶穌基督身分的總稱，包含祂過去的來、現在的同在與將來的再來。</p><p><strong>難處：</strong>稱號說在神學上很豐富，卻不太容易落在處境裡；長老要會眾在門口分辨一位教師，需要的是一個清楚的標準，而不是一個包羅萬有的稱號。這一讀與道成肉身說其實相去不遠。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義從道成肉身說，並陳再來說與稱號說。</strong>分辨的標準是基督論：耶穌基督是成了肉身來的——祂真的成了人，至今仍是那一位。這也是約翰一書講義的議題「分辨：誰是敵基督、假先知？怎樣試驗諸靈？」的標準，本卷不另立說法。</p><p>7 節的「這就是那迷惑人、敵基督的」是單數帶冠詞，意思是「凡這樣否認的，都屬於那一類」，不是在指認某一位歷史人物。所以本講義<strong>不把「迷惑人的」「敵基督」貼在任何政治人物、國家、宗派或群體身上，也不算日子</strong>。連主耶穌都被祭司長叫作「那誘惑人的」（太 27:63）——貼標籤從來容易，分辨才需要真理與愛。本講義的全卷立場見議題「分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法都同意：耶穌基督是真實的人，也是真實的神；否認這一點，就把整個福音拆掉了。時態的爭論只是在問長老用哪一個角度說這件事。</p><p>對我們最安慰的是：我們所信的不是一個理念，是一位真的來過、有血有肉、至今仍然是「在肉身中來的那一位」的主。祂懂我們的身體、我們的軟弱、我們的眼淚。</p>"]],"con":[],"say":"本講義的立場：1:7 的現在分詞從道成肉身說，並陳再來說與稱號說；分辨的標準是基督論——耶穌基督是成了肉身來的。不把敵基督貼在任何人物、國家、宗派或群體身上，也不算日子。本講義的全卷立場見議題「分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？」。","care":"會眾席上可能有人被「末世預言」嚇過，夜裡睡不著，也可能有人曾因政治立場、宗派背景被弟兄姊妹叫作「敵基督」。不要在講台上點名任何人物、國家或群體，也不要在小組裡流傳「某某就是那個敵基督」的說法；那正是把 7 節最清楚的標準換成了最模糊的猜測。牧者可以陪害怕的人回到 7 節的中心：重點不是誰是敵基督，而是我們所信的那一位真的成了肉身、真的愛我們。"},{"id":"ISS01_5","t":"「不要失去你們所做的工」——基督徒會失去賞賜嗎？","r":"1:8--8；林前 3:14--15","ch":[1],"why":"8 節是全卷最容易讓敏感的良心害怕的一節：「不要失去」聽起來像一個威脅。有人讀成「你若被迷惑，就會失去一切」，有人讀成工作與賞賜的提醒。再加上抄本在「我們／你們所做的工」之間有異文，這一題同時牽涉經文鑑別與救恩的確據，非處理不可。","pos":[["【一】經文問的是甚麼","","<p>「你們要小心，不要失去你們所做的工，乃要得著滿足的賞賜。」（1:8）SBLGNT 作 ἃ εἰργασάμεθα，「我們所做成的」——不要讓使徒們在你們身上的勞苦落空；和合本正文「你們所做的工」照另一個讀法 εἰργάσασθε，和合本註腳：有古卷：我們。μισθός 是工價、賞賜，πλήρης 是「完滿的」。經文問的是兩件事：失去的是誰的工？失去的是甚麼——賞賜，還是救恩本身？</p>"],["異文：「我們所做的」與「你們所做的」","","<p>「我們」的讀法夾在兩個「你們」中間，是較難、也較不整齊的讀法；抄寫的人容易把它改齊成「你們」，這是 SBLGNT 取「我們」的理由。照這一讀，8 節像保羅的口吻：「我為你們害怕，惟恐我在你們身上是枉費了工夫。」（加 4:11）「你們」的讀法則讓整句前後一致：你們要小心，不要失去你們自己的工，好得著你們完滿的賞賜。</p><p><strong>難處：</strong>兩讀都有抄本支持，沒有一讀能完全排除另一讀；RP 甚至把三個動詞都改成「我們」。好在兩讀意思相近——一個說你們自己的工，一個說長老在你們身上的工，都是一場不要被偷走的收成。</p>"],["失去救恩說","","<p>這一讀把 8 節和 9 節連起來看：9 節說越過基督教訓的「就沒有神」，所以 8 節的「失去」就是失去救恩本身；被迷惑人的帶走的人，原本做過的一切都歸於無有。持這一讀的人重視經文的嚴肅：警告是真的，不可以輕看。</p><p><strong>難處：</strong>8 節用的字是「工」與「賞賜」，不是「生命」或「得救」；救恩在新約裡是白白賜下的，不是工價。而 9 節說的是那些越過基督教訓的教師，不是正在小心看守自己的會眾。把兩節合成「你一不小心就會失去救恩」，會把一句愛的提醒講成一個恐嚇。</p>"],["賞賜說（工作的成果與賞賜）","","<p>這一讀認為 8 節講的是工作的成果與賞賜，不是得救本身。保羅作過同樣的分別：「人在那根基上所建造的工程若存得住，他就要得賞賜」（林前 3:14）；工程若被燒了，「自己卻要得救；雖然得救，乃像從火裏經過的一樣」（林前 3:15）。照這一讀，長老怕的是：一家人在真理中多年的勞苦與結果，被迷惑人的教師一兩次講道就拆掉了。</p><p><strong>難處：</strong>這一讀若講得太輕，會讓人以為「反正得救了，賞賜少一點也沒關係」；長老的語氣是嚴肅的，「要小心」不是可有可無的建議。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義從賞賜說：8 節講的是工作的成果與賞賜，不是得救本身；異文兩讀並陳，講台照和合本讀「你們所做的工」。</strong>這沿用約翰一書講義的議題「罪與確據」：確據建立在基督的工作上，賞賜與我們的忠心相關。本講義不製造失去救恩的恐懼，也不教靠工作換賞賜——根基是基督立的：「因為那已經立好的根基就是耶穌基督，此外沒有人能立別的根基。」（林前 3:11）</p><p>「你們要小心」原文是「看顧你們自己」，先看自己，不是先看別人。就像父母說「過馬路要小心」，不是說你已經不是我的孩子，而是因為你是我的孩子。9 節緊接著就把確據交在一位身上：「常守這教訓的，就有父又有子。」（1:9）本講義的全卷立場見議題「賞賜與確據：8 節『不要失去你們所做的工』，是說會失去救恩嗎？」。</p>"],["【四】這件事該不該影響你的信心","","<p>該影響的是我們的警醒，不是我們的確據。我們得救的確據，從來不靠自己做得夠不夠，而是靠那位「成了肉身來的」主做成的工。約翰一書說：「我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。」（約壹 5:13）</p><p>8 節要我們珍惜的，是神在我們身上、在我們家裡、在我們教會裡已經做成的工——那是一份收成，值得好好守著。</p>"]],"con":[],"say":"本講義的立場：8 節講的是工作的成果與賞賜，不是得救本身（林前 3:14--15）；異文「我們／你們所做的工」兩讀並陳，講台照和合本。不製造失去救恩的恐懼，也不教靠工作換賞賜；確據建立在基督身上。本講義的全卷立場見議題「賞賜與確據：8 節『不要失去你們所做的工』，是說會失去救恩嗎？」。","care":"會眾席上可能有良心特別敏感、常常懷疑自己是否真的得救的人，聽到「不要失去」就整夜不安；也可能有曾經在異端團體裡待過、剛剛回來的人，以為自己已經甚麼都失去了。不要用 8 節嚇他們，也不要說「你這樣下去會不得救」。牧者可以陪他們回到 9 節的應許，告訴他們：「愛裡沒有懼怕」（約壹 4:18），守住基督的人就有父又有子；回來的人，父親是「跑去抱著他的頸項」（路 15:20）。"},{"id":"ISS01_6","t":"「越過」是犯界，還是自命進步？「基督的教訓」指甚麼？","r":"1:9--9；約壹 2:22--24","ch":[1],"why":"9 節是全卷的高峰之一：「常守這教訓的，就有父又有子。」可是前半句的「越過」在抄本裡有兩個不同的字，「基督的教訓」又可以讀成「關於基督的」或「基督所教導的」。更要緊的是，這一節常被拿來壓制提問：「你問太多，就是越過了。」所以要弄清楚，長老說的「越過」到底越過了甚麼。","pos":[["【一】經文問的是甚麼","","<p>「凡越過基督的教訓不常守著的，就沒有神；常守這教訓的，就有父又有子。」（1:9）SBLGNT 作 προάγων，「走在前頭、往前帶」；RP 作 παραβαίνων，「越過、犯界」。和合本的「越過」兩讀都容得下。一個冠詞 ὁ 管兩個分詞 προάγων καὶ μὴ μένων：走在前頭與不常守，是同一群人、同一個動作的兩面。τοῦ Χριστοῦ 的屬格又有兩讀。經文問的是：越過的是甚麼樣的界線？「基督的教訓」是關於基督的，還是基督所教的？</p>"],["犯界說（παραβαίνων：越過界線）","","<p>照 RP 的讀法，9 節說的是「越過界線、違犯」：基督的教訓是一條界線，越過它就是犯界。這一讀的好處是意思直接：有一個清楚的範圍，守在裡面就有父又有子，越出去就沒有神。它也和約翰一書的話一致：「凡不認子的，就沒有父；認子的，連父也有了。」（約壹 2:23）</p><p><strong>難處：</strong>這是較晚抄本的讀法，較早的抄本多作 προάγων；而且「界線」的說法若沒有說清楚界線在哪裡，很容易被人拿來把自己的一切看法都畫成界線，誰的意見不同，誰就「越過」了。</p>"],["自命進步說（προάγων：走在前頭）","","<p>照 SBLGNT 的讀法，9 節帶著一點諷刺：那些人自稱「走在前頭」，自以為比使徒的教導更進步、更屬靈、更有知識，結果一往前跨，就離開了原地——「不常守著」。長老在 5、6 節兩次說「從起初」，正是對著這種人：真理的價值不在它多新。自以為得著更多的人，其實「就沒有神」；守在原地的人，反而「有父又有子」。</p><p><strong>難處：</strong>這一讀若講得不小心，會被聽成「一切新的研究、新的理解都是危險的」，好像信仰只能原地踏步；但長老反對的是越過基督，不是在基督裡長進。</p>"],["「基督的教訓」：關於基督的，或基督所教的","","<p>τοῦ Χριστοῦ 可讀成受詞屬格「關於基督的教訓」——耶穌基督是誰、祂成了肉身來；也可讀成主詞屬格「基督所教導的教訓」——主自己的教導，包括彼此相愛的命令。前一讀合 7 節的處境，後一讀合 5、6 節的命令。</p><p><strong>難處：</strong>只取前一讀，容易把信仰縮成一套教義條文；只取後一讀，容易把基督的身分當作次要。其實在約翰的著作裡，基督所教的正是關於祂自己是誰，兩讀互相包含。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義原文從 SBLGNT 的「走在前頭」，並陳「犯界」；「基督的教訓」兩讀並取。</strong>9 節越過的，是基督論的核心——父與子的關係、耶穌基督成了肉身來；不是提問、研究、聖經學的進展、不同的解經意見。<strong>問問題不是越過，離開基督才是。</strong>庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），被稱為賢良。</p><p>本講義也不讓任何人以「我守住純正教訓」壟斷屬靈權柄：9 節要人守住的是一位主，不是某一位教師的全部看法。全卷的分辨標準見議題「分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而該帶來安慰。9 節的翻轉是：不是走得最遠的擁有最多，是住得最穩的擁有一切。你不必追上最新的屬靈潮流，也不必懂得最多，才算「有神」；守住基督，就有父又有子。</p><p>你可以帶著問題來到聖經面前，帶著疑惑來到小組裡。那不是越過，那是在找路回到祂身邊。</p>"]],"con":[],"say":"本講義的立場：1:9 原文從 SBLGNT 的「走在前頭」，並陳 RP 的「犯界」；「基督的教訓」兩讀並取。越過的是基督論的核心——父與子、道成肉身；問問題、研究與不同的解經意見都不是越過。本講義的全卷立場見議題「分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？」。","care":"會眾席上可能有曾經因為提問而被說成「驕傲」「越過」的年輕人，也可能有讀了神學、心裡起了疑問卻不敢說的人。不要用 9 節堵住他們的嘴，也不要說「不要再問了，只要信就好」。牧者可以邀請他們把問題帶出來一起查考，告訴他們：問題不會把你推出去，離開基督才會。也要提醒自己：守住純正教訓的人，最需要的是溫柔，不是權柄。"},{"id":"ISS01_7","t":"「不要接他到家裡，也不要問他的安」——今天怎樣應用？","r":"1:10--11；約參 5--8；路 15:2","ch":[1],"why":"這是約翰二書最常被誤用的兩節。有人拿它叫人不和不信的家人來往、不和離開教會的人打招呼，甚至對鄰居同事冷若冰霜；也有人乾脆說這只是第一世紀的事，今天不適用。兩種讀法都會傷人：一種傷了門外的人，一種讓門內的人失去保護。所以必須回到處境，再落到今天具體的門。","pos":[["【一】經文問的是甚麼","","<p>「若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安；因為問他安的，就在他的惡行上有分。」（1:10--11）ἔρχεται 是現在式，一個正往這家走來的人；φέρει 是「帶來」——巡迴教師帶著信息進門。第一世紀沒有給基督徒住的旅店文化，傳道人靠家庭教會供應吃住、講台與盤纏；「接到家裡」很可能就是接進聚會的家、給他講台。χαίρειν 問安，字面「願你喜樂」，在這裡是當眾的祝福與接納。κοινωνεῖ「有分」與「相交」同字根，接待就是成為同工。經文問的是：這兩節禁止的是甚麼，對象是誰，今天落在哪裡？</p>"],["字面全面說（不接觸、不招呼）","","<p>這一讀照字面最廣地應用：凡信仰不同、教義有錯的人，都不讓他進家門，見面也不打招呼，免得「在他的惡行上有分」。持這一讀的人看重經文的嚴肅，也確實想保護家人不受錯誤的教導影響。</p><p><strong>難處：</strong>它忽略了處境——10 節的人是「到你們那裡」「帶著」教訓來的教師，不是隔壁的鄰居；它也和主自己的樣式相反：法利賽人議論說「這個人接待罪人，又同他們吃飯」（路 15:2）。照這一讀，教會會變成一座沒有窗的堡壘，福音也就傳不出去了。</p>"],["純粹歷史說（只是第一世紀的規矩）","","<p>這一讀認為 10--11 節只屬於第一世紀巡迴教師與家庭教會的特殊處境；今天有旅館、有網路，不再有「接到家裡」這回事，所以這兩節對今天沒有直接的應用。它的優點是認真看待處境，避免把經文硬套在今天的人際關係上。</p><p><strong>難處：</strong>處境變了，門還在。今天的教會一樣會邀請講員、推薦課程、轉發影片、為人背書募款；把這兩節完全留在第一世紀，等於把一個家庭教會需要的保護拿掉了。</p>"],["處境平台說（不給否認基督的教師平台與背書）","","<p>這一讀把處境與應用合在一起：對象是 7、9 節定義的人——否認耶穌基督成了肉身、出去傳揚另一個基督的教師；所禁的是給他平台、講台、住處、背書、推薦與募款的協助；「問安」是公開的祝福與接納，不是街上的點頭。早期的《十二使徒遺訓》第 11 章已經為接待立規矩：來的使徒要接待，只住一天，必要時兩天，住到第三天就是假先知。</p><p><strong>難處：</strong>這一讀需要分辨，而分辨需要智慧；哪些錯算是「不是傳這教訓」，要另外處理（見下一題）。它也要求講台說得很具體，否則會眾仍會把它聽成「不要理那些人」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採處境平台說。</strong>今日的應用要具體：不邀他上講台、不在小組推他的課程、不替他轉發募款、不以教會名義為他背書。<strong>但這兩節不是叫人冷落不信的家人、慕道友、離開教會的弟兄姊妹、別的宗教或不同信念的鄰居同事。</strong>我們照樣可以和他同桌吃飯、在病床旁為他禱告、在街上微笑——主與稅吏罪人一同吃飯；我們學的是祂。</p><p>這兩節必須與約翰三書一起讀。同一位長老稱讚該猶：「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（約參 8）又責備丟特腓「他自己不接待弟兄，有人願意接待，他也禁止」（約參 10）。二書叫人關門，三書叫人開門；標準不是認不認識、喜不喜歡，是傳不傳基督。本講義的全卷立場見議題「接待、問安與界線：10--11 節在第一世紀是甚麼意思，今天該怎樣應用？」；另見議題「約翰一、二、三書的關係：二書關門、三書開門，是同一個標準嗎？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕，該讓你更清楚。長老守門，是因為他愛門裡的「太太和她的兒女」；守門也從來不是為了把人關在外面，而是為了讓這一家在真理和愛心上「喜樂滿足」（1:12）。</p><p>你的門可以為朋友、鄰舍、慕道友、還沒信主的家人敞開；你的講台、你的推薦、你的祝福，則要留給傳基督的人。這兩件事不矛盾——那正是在真理和愛心上。</p>"]],"con":[],"say":"本講義的立場：10--11 節的對象是否認耶穌基督成了肉身、出去傳揚的教師；所禁的是給他講台、平台、背書、推薦與募款協助，不是冷落家人、慕道友、離開教會的人或鄰舍。必須與約翰三書的接待（約參 5--8）合看：二書關門、三書開門，標準是傳不傳基督。本講義的全卷立場見議題「接待、問安與界線：10--11 節在第一世紀是甚麼意思，今天該怎樣應用？」。","care":"會眾席上可能有人曾經被教會教導「不要和離開的人來往」，因此和親人、老朋友斷了聯繫，到今天還在痛；也可能有剛信主的人，正擔心自己要不要和還沒信主的父母保持距離。不要讓這兩節成為切斷關係的理由。牧者可以清楚告訴他們：主與稅吏罪人一同吃飯；你可以繼續愛你的家人、陪你的朋友。需要分辨的是講台與背書，不是餐桌與問候。若有人因過去的誤用而受傷，要先向他道歉，再陪他重新讀這兩節。"},{"id":"ISS01_8","t":"「不是傳這教訓」——錯到甚麼程度才算？","r":"1:10--10；1:7--7；1:9--9；帖前 5:21；猶 22","ch":[1],"why":"10 節的條件句「不是傳這教訓」，是全卷應用的鑰匙：門要關，前提是那人「不是傳這教訓」。可是教會之間在洗禮、聖餐、末世、治理上都有不同；一位講員講錯了一處經文，算不算？這一題若不處理，10 節就會變成「凡和我看法不同的，都不要接」，教會就會因為次要的事彼此關門。","pos":[["【一】經文問的是甚麼","","<p>「若有人到你們那裡，不是傳這教訓……」（1:10）原文 ταύτην τὴν διδαχὴν，「這教訓」有指示代名詞，指的是 9 節剛說的「基督的教訓」；而 7 節已經說明了那教訓的核心：「他們不認耶穌基督是成了肉身來的」（1:7）。經文問的是：「不是傳這教訓」的範圍有多大？是一切教義上的錯誤，還是有一個特定的核心？</p>"],["全面說（凡教義有錯都算）","","<p>這一讀認為「這教訓」就是全部純正的教導；凡在任何教義上與我們不同的教師，都屬於「不是傳這教訓」，都不該接待。持這一讀的人重視教義的純正，也看重保羅的嚴厲：「若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。」（加 1:8）</p><p><strong>難處：</strong>照這一讀，幾乎每一間教會都要對另一間教會關門，因為真誠的信徒在許多事上本來就有不同；它也忽略了 10 節的指示代名詞——「這」教訓是指 7、9 節定義的那一個核心。加拉太書所說的「不同的福音」，同樣是福音核心的偏離，不是枝節。</p>"],["核心說（只限基督論的核心）","","<p>這一讀認為「這教訓」有清楚的範圍：父與子的關係、耶穌基督真的成了肉身來（1:7、9）。否認這一點，就是「不是傳這教訓」；在洗禮的方式、聖餐的理解、末世的時序、教會的治理上有不同，是真誠的信徒彼此有分歧的地方，要「凡事察驗；善美的要持守」（帖前 5:21），卻不是 10 節的標準。</p><p><strong>難處：</strong>這一讀若只停在一句信條上，可能會漏掉那些口裡承認、生活與教導卻把人帶離基督的人；長老在 6 節已經把真理與「照他的命令行」綁在一起。所以「核心」不只是一句口號，也包括那位主所教導的愛。</p>"],["教師與存疑者之分","","<p>還有一個角度：10 節說的是「到你們那裡」「帶著」教訓來的人——一位要在聚會中講道的教師，不是一位正在掙扎、提出疑問的弟兄姊妹。猶大書說：「有些人存疑心，你們要憐憫他們」（猶 22）；保羅也說：「信心軟弱的，你們要接納，但不要辯論所疑惑的事。」（羅 14:1）</p><p><strong>難處：</strong>教師與學生、提問與傳講之間有時界線不清；一個人可能從提問慢慢變成傳講。這需要牧者長期的陪伴與分辨，不能靠一條規則一次解決。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採核心說，並加上教師與存疑者之分。</strong>「不是傳這教訓」指的是否認基督論的核心——父與子、耶穌基督成了肉身來；這樣的教師不給他講台與背書。次要的分歧要彼此尊重、一起查考，不關門；正在疑惑的人要憐憫、要陪伴，不是要拒絕。問問題不是越過，離開基督才是。</p><p>本講義不把「迷惑人的」「敵基督」貼在任何宗派或群體身上；分辨是對著一個教導，不是對著一群人。也不讓任何人以「我守住純正教訓」壟斷屬靈權柄。本講義的全卷立場見議題「分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？」；真理與愛的關係見議題「真理與愛：可以只用一隻手嗎？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一題反而讓我們看見信仰的中心有多清楚：不是一整本厚厚的條文，而是一位「有父又有子」的主。在中心上站穩，在枝節上謙卑——這讓我們能和不同傳統的弟兄姊妹一同敬拜，也讓我們知道哪一扇門必須守住。</p><p>你不必因為和別的教會在某些事上看法不同，就懷疑自己或懷疑他們的得救；守住基督，就守住了最要緊的。</p>"]],"con":[],"say":"本講義的立場：「不是傳這教訓」指否認基督論的核心——父與子、耶穌基督成了肉身來（1:7、9）；這樣的教師不給講台與背書。次要分歧彼此尊重、一起查考，不關門；存疑的人要憐憫、陪伴。本講義的全卷立場見議題「分辨：誰是迷惑人的、敵基督的？基督論的核心在哪裡？」。","care":"會眾席上可能有從別的宗派轉來的人，擔心自己過去的教會是不是「不是傳這教訓」；也可能有家人在另一個傳統裡敬拜，心裡一直不安。不要用 10 節替宗派劃界，也不要讓會眾以為「和我們不一樣的都是錯的」。牧者可以陪他們分清核心與次要，並且提醒：「用溫柔勸戒那抵擋的人」（提後 2:25）；就算真的遇到否認基督的教導，我們拒絕的是那個講台，不是那個人的靈魂。"},{"id":"ISS01_9","t":"「不願意用紙墨」——線上聚會、遠距牧養算不算「當面」？","r":"1:12--12；約參 13--14；民 12:8","ch":[1],"why":"12 節長老說，他不願意用紙墨，盼望當面談論，使喜樂滿足。今天的教會有線上聚會、網路小組、遠距牧養，也有許多因病、因工作、因距離不能到場的弟兄姊妹。這一節常被拿來說「只有實體才算數」，也可能被另一端說成「線上就夠了」。這一題直接碰到許多人每週的信仰生活，必須講清楚。","pos":[["【一】經文問的是甚麼","","<p>「我還有許多事要寫給你們，卻不願意用紙墨寫出來，但盼望到你們那裡，與你們當面談論，使你們的喜樂滿足。」（1:12）χάρτης 是一張莎草紙，這封信大約剛好寫滿一張；「寫出來」是和合本的小字補字。「當面談論」原文 στόμα πρὸς στόμα，直譯「口對口」，這使我們想起神論摩西說「我要與他面對面說話」（民 12:8），七十士譯本那裡作 στόμα κατὰ στόμα，介系詞不同，意思同樣是「口對口」。約翰三書結尾幾乎同一句：「我原有許多事要寫給你，卻不願意用筆墨寫給你」（約參 13）。經文問的是：長老是在貶低紙墨，還是在表達盼望？今天的線上事工落在哪裡？</p>"],["當面優先說（線上是不得已）","","<p>這一讀認為 12 節排出了一個次序：當面是完整的，紙墨是次等的；喜樂要在當面時才「滿足」。照這一讀，線上聚會只是過渡的權宜，信徒應當盡量回到實體聚會。持這一讀的人也會引「你們不可停止聚會」（來 10:25），並且看見道成肉身本身就是神選擇「當面」。</p><p><strong>難處：</strong>長老並沒有說紙墨不算數——他正在用紙墨把最要緊的真理送到：彼此相愛、成了肉身來的基督、守門的智慧。這封信本身就是遠距事工，而且被收進正典。把 12 節讀成「不能到場的人只得到次等的信仰」，就把長老的盼望變成了門檻。</p>"],["媒介中立說（線上就等於當面）","","<p>這一讀認為今天的視訊已經能「口對口」，長老若活在今天，大概會用視訊；所以線上與實體沒有分別，12 節的盼望在線上已經完全成就。它的優點是肯定了許多人在線上真實經歷的團契與牧養。</p><p><strong>難處：</strong>它可能錯過 12 節裡那份對同在的渴望——長老想要的不只是資訊送到，而是人到。道成肉身本身也提醒我們，身體的同在有它不可取代的地方；保羅也盼望「到那時就要面對面了」（林前 13:12）。</p>"],["橋與盼望說","","<p>這一讀把 12 節讀成一條路：紙墨是橋，當面是盼望。長老先用紙墨把真理送到——這不是次等，而是愛的第一步；然後盼望走完最後一段路，親自到他們那裡。喜樂的「滿足」是被動完成式，是神賜下、充滿、而且保持滿足的；它不是只有在某一種場地才發生，而是在真理和愛把人連在一起時，一步一步被充滿。</p><p><strong>難處：</strong>這一讀需要教會同時做兩件事：認真經營線上的團契與牧養，也持續為見面創造機會；若只說「都很好」，可能讓人失去見面的渴望。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採橋與盼望說：紙墨是橋，不是次等；「當面」是盼望與邀請，不是門檻。</strong>長老自己正在用紙墨傳真理，這封信本身就是遠距事工。所以本講義<strong>不用 12 節貶低線上團契、遠距牧養，也不貶低因病、因工作、因距離不能到場的弟兄姊妹</strong>。對國度321空中團契這樣的群體，這一節格外親切：線上把真理送到，見面使喜樂滿足——兩者都是長老走過的路。</p><p>同時，本講義也不把見面講成可有可無。12 節的盼望是真的：能見面的時候，就去見；不能見面的時候，就把紙墨寫好，把螢幕另一端的人當作真實的家人。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」；這封短信對遠距牧養的禮物，另見議題「這封短信為甚麼被收進正典？」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你覺得自己的信仰次一等。你若因病躺在床上、因工作在另一個城市、因距離只能在線上聚會，你所領受的真理，和長老那一張莎草紙上寫的一樣真。主應許「真理的聖靈」要「常與你們同在，也要在你們裡面」（約 14:17）——祂不受距離限制。</p><p>12 節留給你的，是一份盼望：有一天，我們要當面相見，喜樂要滿足。而最終的「面對面」，是我們要見主的面。</p>"]],"con":[],"say":"本講義的立場：1:12 的紙墨是橋，不是次等；「當面」是盼望與邀請，不是門檻。長老自己正在用紙墨傳真理，這封信本身就是遠距事工；不用這一節貶低線上團契、遠距牧養或因病、因工作、因距離不能到場的人，也不把見面講成可有可無。","care":"會眾席上——或螢幕另一端——有臥病在床的長輩、在海外打工的弟兄、照顧孩子出不了門的媽媽，他們最怕聽到的是「線上不算真的聚會」。不要在講台上這樣說，也不要用出席率衡量一個人的屬靈光景。牧者可以讓他們知道：你所在的地方，就是長老那張紙墨送到的地方；教會會想辦法去看你。同時也溫柔地邀請能來的人來——見面是禮物，不是考試。"}],"terrain":{"points":[[0.538,66,1,"就是我誠心所愛的",null],[0.615,80,2,"這真理存在我們裡面",null],[0.692,90,3,"在真理和愛心上","top"],[0.769,74,4,"就甚歡喜",null],[0.923,94,6,"這就是愛","top"],[1.0,10,7,"世上有許多迷惑人的出來","bot"],[1.077,30,8,"不要失去你們所做的工","bot"],[1.154,92,9,"就有父又有子","top"],[1.231,22,10,"不要接他到家裡","bot"],[1.385,98,12,"使你們的喜樂滿足","top"]]},"tracks":[{"gk":"ἀλήθεια","tr":"alētheia","gl":"真理（和合本 1:1 作「誠心」）","code":"G225","root":"ἀλήθεια——真實、真理；字根的意思是「不被遮蓋、沒有隱藏」。前四節出現五次，每一次都和「愛」或「行」綁在一起。1:1 的 ἐν ἀληθείᾳ，和合本譯作「誠心」：長老的愛是「在真理中」的愛","ins":"第一站，真理是愛的所在：長老說「就是我誠心所愛的」，原文是「我在真理中所愛的」（1:1，ἐν ἀληθείᾳ）；同一節又說，愛這一家的不只他一個，「也是一切知道真理之人所愛的」——真理把一群原本不認識的人連成一家。第二站是第一個翻轉：真理不是一套被人背誦的條文，而是一位住進來的：「這真理存在我們裡面，也必永遠與我們同在」（1:2）。μένουσαν 是「住著、留著」，與第 9 節的「常守」同一個字；「永遠與我們同在」使我們想起主說真理的聖靈「永遠與你們同在」（約 14:16--17）。第三站，真理和愛並排成為問安的結語：「在真理和愛心上」（1:3）——恩惠、憐憫、平安就落在這兩樣上。第四站是第二個翻轉：真理被「行」出來——「遵行真理」（1:4），原文是「在真理中行走」（περιπατοῦντας ἐν ἀληθείᾳ）。真理從愛的所在，到住進來的一位，到兩隻手之一，最後變成一條路：被真理找到的人，在真理裡走路。","stops":[["1:1","就是我誠心所愛的……也是一切知道真理之人所愛的",""],["1:2","這真理存在我們裡面，也必永遠與我們同在","top"],["1:3","在真理和愛心上",""],["1:4","有照我們從父所受之命令遵行真理的","top"]]},{"gk":"ἀγάπη／ἀγαπάω／ἐντολή／περιπατέω","tr":"agapē / agapaō / entolē / peripateō","gl":"愛、命令、行（行走）","code":"G26","root":"ἀγάπη／ἀγαπάω——愛；ἐντολή——命令、吩咐；περιπατέω——行走、過日子。這封信把三個字綁成一個結：愛就是照命令行，命令就是在愛裡行","ins":"第一站，愛是長老的動作：「就是我誠心所愛的」（1:1）。第二站，愛成為問安的一隻手：「在真理和愛心上」（1:3）。第三站，「命令」與「行」第一次出現，落在兒女身上：「有照我們從父所受之命令遵行真理的」（1:4）——命令是從父來的，行是兒女做的。第四站，愛被說成命令：「我們大家要彼此相愛。這並不是我寫一條新命令給你，乃是我們從起初所受的命令」（1:5）——這使我們想起主在最後的晚上說「我賜給你們一條新命令，乃是叫你們彼此相愛」（約 13:34）；長老說它不新，因為從起初就在。第五站是全卷樞紐，三個字繞成一個圈：「我們若照他的命令行，這就是愛」——愛被命令定義；「你們從起初所聽見當行的，就是這命令」——命令又被愛定義（1:6；原文的「當行的」指回「愛」）。愛不是一種感覺，是照祂的話走路；命令不是一條鞭子，是彼此相愛。兩句互為鏡像，誰也離不開誰。","stops":[["1:1","就是我誠心所愛的",""],["1:3","在真理和愛心上",""],["1:4","有照我們從父所受之命令遵行真理的",""],["1:5","我們大家要彼此相愛……乃是我們從起初所受的命令","top"],["1:6","我們若照他的命令行，這就是愛……就是這命令","top"]]},{"gk":"μένω／διδαχή","tr":"menō / didachē","gl":"存在、常守（住）；教訓","code":"G3306","root":"μένω——住下、留下、持守，約翰最愛的字之一（約翰一書二十多次）；διδαχή——教訓、所教導的內容。2 節是真理「住」在我們裡面，9 節是我們「住」在教訓裡；中間夾著一群不肯住下、要「走在前頭」的人","ins":"第一站，主詞是真理：「這真理存在我們裡面」（1:2，τὴν μένουσαν ἐν ἡμῖν）——在任何人「守」以前，真理已經先住下來了。第二站，主詞換成人，而且是反面：「凡越過基督的教訓不常守著的，就沒有神」（1:9）——προάγων 是「走在前頭」，有一群人自以為走得比使徒更遠，結果是不肯住下；他們以為自己得著了更多，其實「沒有神」。第三站是翻轉：「常守這教訓的，就有父又有子」（1:9）——不是走得最遠的人得著最多，是住得最穩的人擁有一切。同一個字，從「真理住在我們裡面」到「我們住在教訓裡面」：守住，不是咬緊牙關，是住進一個已經先住進你裡面的真理裡。第四站把它帶到家門口：「若有人到你們那裡，不是傳這教訓」（1:10）——分辨的標準不是口才、熱情或新鮮感，是「這教訓」，也就是關於基督、也出於基督的教訓。這使我們想起約翰一書「務要將那從起初所聽見的，常存在心裡」（約壹 2:24）。","stops":[["1:2","這真理存在我們裡面","top"],["1:9","凡越過基督的教訓不常守著的，就沒有神",""],["1:9","常守這教訓的，就有父又有子","top"],["1:10","不是傳這教訓",""]]},{"gk":"χαίρω／χαρά","tr":"chairō / chara","gl":"歡喜、問安（願你喜樂）、喜樂","code":"G5463","root":"χαίρω——歡喜；它的不定詞 χαίρειν 是希臘人見面、寫信時的問安語，字面是「願你喜樂」；χαρά——喜樂。中文把它譯成「歡喜」「問安」「喜樂」三個詞，原文卻是同一個字根：問安本來就是在祝福人喜樂","ins":"第一站是長老自己的喜樂：「我見你的兒女……遵行真理的，就甚歡喜」（1:4，Ἐχάρην λίαν）——一位屬靈的長輩最大的歡喜，是看見孩子在真理裡走路（這使我們想起約參 4）。第二站是一個禁令：「也不要問他的安」（1:10）——χαίρειν αὐτῷ μὴ λέγετε，字面是「不要對他說『願你喜樂』」。第三站說明原因：「因為問他安的，就在他的惡行上有分」（1:11）——問安是祝福，祝福是背書；你的「願你喜樂」是有分量的，不可蓋在否認基督的教訓上。這不是叫人冷漠，而是說祝福有重量。第四站是翻轉，也是全卷的終點：「使你們的喜樂滿足」（1:12）——長老不肯把「願你喜樂」隨便給迷惑人的，是因為他要守住真正的喜樂；那份喜樂要在「當面」相見時才滿足。中文讀不出來的這條線，把 10 節的關門和 12 節的見面接在一起：守門是為了喜樂，喜樂是在見面時滿足。","stops":[["1:4","就甚歡喜",""],["1:10","也不要問他的安",""],["1:11","因為問他安的，就在他的惡行上有分",""],["1:12","使你們的喜樂滿足","top"]]}],"lesson":{"1":{"no":1,"vol":"《321約翰二書講義》第一課·約翰二書第一章","title":"在真理和愛心上——紙墨、門口、喜樂","chars":5154,"min":60,"deep":8,"dchars":1655,"tchars":1543,"blocks":[["h","一、一封寫滿一張紙就停筆的信"],["p","弟兄姊妹平安。你最後一次收到一封真正的手寫信，是甚麼時候？不是訊息，不是電郵，是一張紙，上面有一個人的字跡，有劃掉又重寫的地方，也有寫到最後字越擠越小、只好轉到背面的那幾行。手寫信很慢，要一個人坐下來，把心裡的話一個字一個字放到紙上。"],["p","秀琴姊住在檳城，七十二歲，是我們空中團契的姊妹，每個主日都在手機上和大家一起聚會。她的兒子在墨爾本工作，十幾年沒有回來過年，也還沒有信主。每年聖誕節，她都寄一封手寫信過去。去年那一封，她寫滿了一張信紙，寫到最下面就停了筆，只加上一行：其他的話，等你回來，我們當面說。她跟我說：有些話寫在紙上會變硬，當面說，才是軟的。"],["p","新約裡也有一封信，寫滿一張紙就停筆了：「我還有許多事要寫給你們，卻不願意用紙墨寫出來，但盼望到你們那裡，與你們當面談論，使你們的喜樂滿足。」（1:12）這就是約翰二書。一章，十三節，大約剛好寫滿一張標準尺寸的莎草紙。為甚麼這位長老寫到第十二節就不想再寫了？這一課，我們一起把答案找出來。"],["p","這封信裡有三種人。寫信的長老，在真理中愛一個家，為兒女歡喜，為所愛的守門，盼望見面。收信的是蒙揀選的太太和她的兒女，一個家庭教會，門口不斷有人敲門。還有門外的人：有的是為主名出外的弟兄，有的是否認基督的教師。信本身走三步：真、愛、守。這一課，我們用三個詞把它教一遍：紙墨、門口、喜樂。"],["h","二、真：一個被真理找到的家"],["p","「作長老的寫信給蒙揀選的太太和她的兒女，就是我誠心所愛的」（1:1）。「作長老的」原文有冠詞，是那位長老，收信的人一看就知道是誰；本系列沿用約翰一書講義的立場：使徒約翰。蒙揀選的太太是誰？和合本註腳說：太太，或譯：教會。可以是一間地方教會，可以是一位姊妹和她的家，也有人說是人名。本講義傾向教會的讀法，但不裁判，也不拿這一節替女性事奉的任何立場背書或反對。不論哪一讀，被愛的都是一群被真理找到的人。"],["p","「誠心」原文是在真理中。長老的愛是真誠的，也是在真理裡的，兩樣都要。而且「不但我愛，也是一切知道真理之人所愛的。」（1:1）這些人多半彼此叫不出名字，把他們連成一家的，是同一個真理。我們散在好幾個國家，靠的也是同一位。"],["p","「愛你們是為真理的緣故，這真理存在我們裡面，也必永遠與我們同在。」（1:2）次序要聽清楚：不是我們先抓住了真理，是真理先住進來。"],["p","第三節是本課的題目：「恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在！」（1:3）保羅的問安原文沒有動詞，中文常補作願；長老寫的是必，原文 ἔσται（estai）是未來式直說語氣：這是應許，不是祝願。中間的憐憫，原文 ἔλεος（eleos），在約翰的著作裡只出現這一次。一封等一下要人守門的信，問安裡先放了憐憫；忘了自己也是蒙憐憫的人，守門就會變成審查。還有兩個「從」並排：從父神，也從他兒子。子與父同為恩典的源頭，這一句已經在回答門外那些否認基督的人了。"],["p","「我見你的兒女，有照我們從父所受之命令遵行真理的，就甚歡喜。」（1:4）「遵行」原文是行走：第二節真理住進來，第四節真理走出去。原文是你的兒女中有些：長老只說他遇見的那幾位，其餘的經文沒有說；他也沒有一句責備那位母親的話。這是長老的歡喜，不是父母的成績單。秀琴姊讀到這一節，曾經哭過。等一下，我們會回來陪她。"],["d",["「蒙揀選的太太」到底是一位姊妹，還是一間教會？這會影響我怎麼讀這封信嗎？","有三種讀法。第一，一間地方教會的擬人：第十三節問安的是姊妹的兒女，姊妹本人沒有出聲，最像一間姊妹教會在問候另一間；彼得也把教會稱作在巴比倫與你們同蒙揀選的（彼前 5:13）。第二，一位姊妹與她的家：字面最自然，她的家就是聚會的地方，這使我們想起腓利門書那句在你家的教會。第三，人名 Κυρία 或 Ἐκλέκτη；若是後者，第十三節的姊妹也得同名。本講義傾向第一種，但三讀都能在講台上用，不裁判；也不拿這一節替女性事奉的任何定論背書或反對。不論哪一讀，焦點都在把她和一切知道真理之人連在一起的那個真理。"]],["d",["第四節說「有照我們從父所受之命令遵行真理的」，是不是表示那個家裡有些孩子已經離開了？","原文 ἐκ τῶν τέκνων σου（ek tōn teknōn sou）是部分詞，意思是你的兒女中有些。有人認為這暗示有些兒女已經被迷惑，有人認為長老只是說他遇見的那幾位。經文沒有說其餘的兒女怎樣了，本講義兩讀並陳，不由這一個介系詞推論其他兒女都走開了。更要緊的是長老的語氣：他沒有一句責備那位母親的話，只說他甚歡喜。如果你家裡也有還在路上的孩子，這一節不是在給你打分數，是給你一個盼望。這一週，把孩子的名字寫在你的禱告本第一頁。"]],["h","三、愛與守：照他的命令行，所以要守門"],["p","「太太啊，我現在勸你，我們大家要彼此相愛。這並不是我寫一條新命令給你，乃是我們從起初所受的命令。」（1:5）「勸」原文 ἐρωτῶ（erōtō），是平輩之間的請求。長老能命令，卻開口求；他說我們大家，把自己也放進這條命令底下。真理不是越新越好。"],["p","接著是全卷的樞紐：「我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令。」（1:6）原文有兩個「這就是」，像一面鏡子照過來又照過去：愛就是照命令行，命令就是在愛裡行。愛有形狀，它的形狀是照祂的命令行；命令有溫度，它的溫度是彼此相愛。有真理沒有愛，是一把刀；有愛沒有真理，是一團霧。"],["p","第七節的第一個字是因為：「因為世上有許多迷惑人的出來，他們不認耶穌基督是成了肉身來的；這就是那迷惑人、敵基督的。」（1:7）為甚麼要照命令行？因為有人正在把人帶錯路。所以後面的守門不是愛的反面，是愛的延伸。分辨的標準是基督論：所傳的耶穌基督，是不是那一位真的成了肉身的神的兒子？長老說許多，卻沒有點任何人的名字；他給的是一把尺，不是一份名單。"],["p","「你們要小心，不要失去你們所做的工，乃要得著滿足的賞賜。」（1:8）「要小心」原文是看顧你們自己：守門以前，先守心。這裡講的是工作的成果和賞賜，不是得救本身；救恩建立在基督已經完成的工作上，沒有人需要帶著失去救恩的恐懼回家。"],["p","「凡越過基督的教訓不常守著的，就沒有神；常守這教訓的，就有父又有子。」（1:9）門外的人說自己走在前頭，懂得更深。長老很冷靜：往前越過了基督，不是多得了甚麼，是就沒有神。越過的是父與子、道成肉身這個核心；問問題不是越過，離開基督才是。"],["p","然後是全卷最容易講錯的兩節：「若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安；」（1:10）「因為問他安的，就在他的惡行上有分。」（1:11）先看門外是誰：一位否認耶穌基督成了肉身、出去傳另一個基督的巡迴教師。當時家就是聚會的地方。接他進家，就是給他講台、住處、盤纏和推薦；問安是當眾祝福、送行，等於背書。「有分」原文 κοινωνεῖ（koinōnei），和相交同一個字根：接待一位教師，就是成了他的夥伴。"],["p","所以這兩節不是叫人冷落沒信主的家人、慕道的朋友、離開教會的人，或信念不同的鄰居同事。主耶穌被人議論說：「這個人接待罪人，又同他們吃飯。」（路 15:2）同一張餐桌，主開給罪人；長老關上的，是講台。同一位長老在另一封信裡，是叫人開門的：「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（約參 1:8）二書關門，三書開門；標準不是認不認識、是不是同一掛，是他傳的是不是基督。今天落在哪裡？不邀他上講台，不在小組推他的課程，不替他轉發募款，不以教會名義為他背書。"],["d",["今天要怎樣分辨一位講員，是不是第七節說的迷惑人的？","長老給的尺很短，只量一件事：他所傳的耶穌基督，是不是那一位真的成了肉身來的神的兒子。約翰一書說得更直接：「凡靈認耶穌基督是成了肉身來的，就是出於神的」（約壹 4:2）。所以可以問兩個問題：他講的耶穌，是不是真的成為人、真的死、真的復活？他是把人帶到基督面前，還是說自己走在基督前頭？講道風格、政治立場、宗派，都不是這把尺。不要一個人憑印象下結論，也不要在群組裡公開點名；兩三位同工一起帶著禱告分辨。分辨的目的不是抓人，是保護所愛的羊。"]],["d",["第八節說「不要失去你們所做的工」，是在說得救的人也可能失去救恩嗎？","不是。第八節講的是工作的成果和賞賜，不是得救本身。長老擔心的是：這個家多年的服事，不要因為接了錯的人而被拆掉。保羅也作同樣的分別：人的工程若被燒了，他要受虧損，他自己卻要得救（林前 3:15）。救恩是白白賜下的，確據建立在基督已經完成的工作上，本系列約翰一書講義的議題「罪與確據」講過這一點。也不要反過來把這一節讀成用工作換賞賜：賞賜是主的恩典加在忠心之上，不是交易。沒有人需要帶著失去救恩的恐懼回家。"]],["h","四、原文亮光：願你喜樂、住下來、口對口"],["p","回到開場的問題：長老為甚麼寫到第十二節就停筆？請和我一起拆三個原文，答案就藏在裡面。"],["p","第一個字：χαίρειν（chairein）。第十節「問他的安」，原文就是這個字，是當時見面和寫信的問候語，字面意思是願你喜樂。它和第四節「甚歡喜」的 Ἐχάρην（Echarēn）、第十二節「喜樂」的 χαρὰ（chara），是同一個字根。中文讀不出來，原文卻是一條線：長老看見兒女在真理中行走，就甚歡喜；不要對否認基督的教師說願你喜樂；最後，「使你們的喜樂滿足」（1:12）。長老不是吝嗇喜樂，他是把喜樂留給真理，留到見面那一天，滿滿地給。最後一節的問安換了一個字 ἀσπάζεται（aspazetai），出聲的是另一家的兒女：「你那蒙揀選之姊妹的兒女都問你安。」（1:13）"],["p","第二個字：μένω（menō），住下來。第二節「這真理存在我們裡面」的存在，原文是 μένουσαν（menousan）；第九節「常守這教訓的」常守，原文是 μένων（menōn），同一個字。門外的人用的動詞是 προάγων（proagōn），走在前頭；長老用的動詞是住下來。屬靈的進步不是往前越過，是往裡住進。不是走得最遠的擁有最多，是住得最穩的擁有一切：就有父又有子。還有一層安慰：我們能住在真理裡，是因為真理先住在我們裡面。守，不靠我的手勁，是回應一位已經住下來的。"],["p","第三個詞：στόμα πρὸς στόμα（stoma pros stoma），和合本譯作當面談論，直譯是口對口。這使我們想起民 12:8，神說到摩西，要與他面對面說話；希臘文舊約那裡也作口對口，那是神與人最親近的說話。長老要去，不是去開會、去審查，是去說話，近到看得見對方的臉。「紙墨」的紙，原文 χάρτης（chartēs），新約只在這裡出現，就是一張莎草紙。紙寫滿了；有些話，當面說才帶得出眼淚和笑容。"],["p","可是請聽清楚：這一節不是在貶低紙墨。長老自己正在用紙墨傳真理，這封信本身就是一份遠距的牧養，把一到十一節的真理一字不漏地送到那個家。紙墨是橋，不是次等。對國度321空中團契來說，這一節特別親切：線上把真理送到，見面使喜樂滿足。因病、因工作、因距離不能到場的人，沒有少得真理，也沒有被關在喜樂外面；當面是盼望與邀請，不是門檻。"],["p","所以答案是：長老寫到第十二節就停筆，因為他要說的最後一件事，不是紙裝得下的。守門不是終點，見面才是。喜樂滿足的滿足，原文是完成式被動：被充滿，而且一直滿著。喜樂不是我們擠出來的，是被賜下的。"],["d",["我喜歡問問題，也讀神學，這會不會就是第九節說的越過？","不會。第九節越過的是基督論的核心：父與子、道成肉身。原文 προάγων（proagōn）是走在前頭，指那些自稱進步、超越使徒教導、把基督留在後頭的人。問問題不是越過，離開基督才是。查考、研究、不同的解經意見，都不是越過。真正要留意的，是問題把你帶往哪裡：越問越深地住進基督裡，還是越問越覺得不需要祂了。也沒有人可以拿我守住了純正教訓來壟斷權柄、壓住別人的追問。守住的是基督，不是某個人的立場。"]],["d",["我們是線上團契，第十二節說要當面談論，我們的聚會還算數嗎？","算數。長老自己正在用紙墨傳真理：這封信本身就是一份遠距事工，把真理一字不漏地送到那個家。紙墨是橋，不是次等。第十二節的當面，原文是口對口，是盼望與邀請，不是門檻：因病、因工作、因距離不能到場的人，沒有少得真理，也沒有被關在喜樂外面。線上把真理送到，見面使喜樂滿足。所以可以做一件具體的事：這個月，替小組裡一位只在線上見過的弟兄姊妹，安排一次探訪或一通長長的電話。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是先講 321 的讓耶穌作王、建立屬神的體系，再拿這封信當一堂建立界線的管理課來作插圖。次序是先有真理住進來，先有從父和子來的恩惠、憐憫、平安，321 才在末端認出它；焦點在有父又有子的那一位，不在長老的辨識力。"],["p","第二個偏差，是錯拿第十節叫人冷落不信的家人、慕道友、離開教會的人，或別的宗教、不同信念的鄰居同事。第十節的對象是否認基督成了肉身的巡迴教師，所禁的是講台、住處和背書；主與罪人一同吃飯，約翰三書還要人接待為主名出外的弟兄。"],["p","第三個偏差，是錯把迷惑人的、敵基督，貼在某位政治人物、某個國家、宗派或群體身上，或拿第七節來算日子。長老給的是一把基督論的尺，不是一份名單；連主耶穌都曾被人叫作那誘惑人的（太 27:63）。"],["p","第四個偏差，是只用一隻手：以為守住真理就可以不要愛，對人的眼淚冷著臉；或以為愛就是甚麼都點頭，誰都可以上台。也不可拿第八節製造失去救恩的恐懼；第八節講賞賜，確據在基督身上。"],["p","第五個偏差，是錯拿第九節壓住提問，說人一提問就是驕傲、就是越過；或拿第四節責備兒女還沒信主的父母；或拿第十二節貶低線上團契和不能到場的人。越過的是基督論的核心，第四節是長老的歡喜，紙墨是橋。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：年節回家，家裡的長輩拜拜。除夕回到老家，阿公阿嬤在神明桌前上香，一家人等著圍爐。有人拿第十節說：不要接他到家裡，也不要問他的安，所以我連那張桌都不該上，見了長輩也不必拜年。這是把經文用錯了地方。第十節的對象是在聚會裡要講台、要背書的否認基督的教師，不是養你長大的長輩。基督徒可以不拿香、不跪拜，這是對真理的忠心；同時坐上那張桌子，替長輩夾菜，向長輩拜年說平安，這是愛。真理和愛心兩隻手，可以在同一張圓桌上。"],["p","第二個問題：兒女不信主的父母。秀琴姊讀到第四節的就甚歡喜，心裡一陣刺痛：長老為別人的兒女歡喜，那我呢？華人父母很容易把兒女的信仰當成自己的成績單。經文沒有這樣說。第四節是長老的歡喜，不是父母的成績單；長老只說他遇見了幾位在真理中行走的，沒有一句責備那位母親的話。信仰不是父母遺傳的，是神親自去找人；父母能做的，是愛、是活出來、是代禱，結果在神手裡。秀琴姊信紙的最後一行，寫的不是你要信主，是等你回來，我們當面說。紙墨是橋，盼望在橋的那一頭。"],["d",["除夕回老家，長輩在神明桌前上香，我還能坐上那張年夜飯的桌子嗎？","可以，而且應該。第十節所禁的，是給否認基督的巡迴教師講台、住處和公開背書，不是叫你和養你長大的長輩斷了往來。長輩不是到你家聚會裡要講台的教師，是你在真理和愛心上要愛的家人。具體可以這樣做：一，事先溫和地說清楚，我不拿香、不跪拜，不是不孝；二，用別的方式盡孝，早一點回家幫忙備菜，替長輩夾菜、敬茶、說吉祥話，紅包照樣包；三，長輩上香時，可以在旁邊安靜為他們禱告，不吵架，也不在桌上講道。真理那隻手守住敬拜只歸給神，愛心那隻手把整頓飯吃完。"]],["h","七、活出321——兩隻手、一扇門"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：「他們不認耶穌基督是成了肉身來的」（1:7）。榜樣不是一個理念，是一位真的來過、會累會餓、有血有肉的人；真理和愛心這兩隻手，最先是在祂身上同時握住的。"],["p","聖經是我的準則：「乃是我們從起初所受的命令」（1:5）。準則是從起初的，不是新發明的；聽見誰說他有更新更深的道，先拿從起初的話來量。"],["p","聖靈是我的引導：「這真理存在我們裡面，也必永遠與我們同在」（1:2）。這使我們想起主應許那位永遠同在的真理的聖靈（約 14:16--17）。經文沒有直接說聖靈；可是引導我們分辨的，不是我們的眼力，是住在裡面的那一位。"],["p","讓耶穌作王：「常守這教訓的，就有父又有子」（1:9）。讓祂作王，是不站到基督前面去定義神，也不坐上門口裁判的位子，憑自己的好惡決定誰該被冷落。"],["p","讓耶穌得到一切的榮耀：「從父神和他兒子耶穌基督」（1:3），兩個從並排。榮耀不歸給看得最準的長老，歸給與父同為恩典源頭的子。"],["p","建立屬神的體系：兩個蒙揀選的家彼此問安（1:1、13）。體系是家與家之間的網絡，它的考驗是那扇門：接待誰，替誰背書。國度321空中團契散在各國，也是這樣一張網：用紙墨、用螢幕把真理送到，再盼望當面相見。"],["h","八、四種心，常放下哪一隻手"],["p","驕傲型的心，最愛穿進步的衣服：覺得從起初的太淺，想走在前頭；或者反過來，拿我守得住來證明自己比別人強，看誰都像門外的人。第九節對兩種人說同一句話：你守住的是一位，不是你的眼力。常守的人有父又有子，沒有理由驕傲，只有理由感恩。"],["p","恐懼型的心，怕被騙，所以每一個提問的人、每一位意見不同的弟兄都像威脅；又怕得罪人，所以誰傳來的連結都轉。請你聽第三節的那個必：恩惠、憐憫、平安必常與我們同在。你不是靠自己的辨識力存活的；門可以和同工一起守，也可以慢一點守。"],["p","羞恥型的心，也許曾被更深的道吸引過，替不該推的人轉發過，甚至自己就曾站在門外。請你記得，長老在問安裡先放了憐憫。被帶錯路的羊，門外仍有回家的路；你今天回到從起初的命令，長老會甚歡喜。"],["p","受傷型的心，也許曾被人用守住真理的名義趕出去，提問被說成驕傲；也許是為走遠的孩子流淚的父母，或因病只能在螢幕上聚會，覺得自己不算在場。那些話本來就不是這封信的意思。第四節沒有給你打分數，第十二節沒有把你關在喜樂外面。若心裡的重擔已經壓得睡不著，請找一位信得過的人陪你，必要時尋求專業協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:1–3 一次，讀到必常與我們同在就停下來，向主說：謝謝你先住進我裡面，不是我先抓住你。"],["p","第二，打開手機，翻一翻這個月轉發或收藏過的課程、講員、募款連結，挑三則問：它傳的是那位真的成了肉身、為我死而復活的基督嗎？不確定的先不轉，星期日以前私下問組長或牧者；不在群組公開點名任何人。"],["p","第三，傳一則訊息給一位信念不同、或離開了教會的家人朋友，不為說服他，只約一個時間喝杯茶。守一扇門，也開一扇門。"],["p","第四，寫一封手寫信，一張紙就好，給一位你在真理裡愛著的人；如果你是為孩子流淚的父母，可以寫給孩子，不寫你要信主，只寫你愛他、你為他禱告。"],["p","第五，這個月為小組裡一位只能在線上聚會的人，安排一次見面或探訪；真的去不了，就寄一張手寫卡片。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：真理先住進我裡面，也必永遠與我同在；我守住的，是有父又有子的那一位。"],["p","我宣告：我要在真理和愛心上過日子，兩隻手，不放下任何一隻。"],["p","我宣告：我的講台不給否認基督的教訓，我的餐桌向每一個人敞開。"],["p","我宣告：我的喜樂不靠人數，也不靠在不在場；主要使我們的喜樂滿足。"],["d",["群組裡有人轉發一門「比教會講得更深」的課，我這一週具體該怎麼回應？","可以照四步走。第一，先不按讚、不轉發，也不在群組裡公開批評，免得把轉發的弟兄姊妹當成敵人；第二，自己先查：這位老師講的耶穌，是不是真的成了肉身、真的死、真的復活？他是把人帶到基督面前，還是說自己走在使徒前頭？第三，星期日以前，把連結私下帶給組長或牧者，兩三位同工一起帶著禱告分辨；確定沒有問題的，就放心推薦。第四，不論結果如何，私下去關心那位轉發的人，告訴他你們一起分辨的理由。守門的那隻手不交出講台，愛心的那隻手伸向弟兄。"]],["h","十、結語"],["p","這一課從一封寫滿一張紙的信開始。長老寫到第十二節就停筆，不是話說完了，是他要說的最後一件事，要當面說。秀琴姊的兒子今年還沒有回來，她的信還在寄。可是她現在讀約翰二書，讀到的不再是一張成績單，而是一個盼望：喜樂要滿足，不在紙上，在見面那一天。"],["p","這一課的焦點，不在長老的辨識力有多準，也不在我們守門守得多嚴，焦點在「常守這教訓的，就有父又有子」（1:9）的那一位。是真理先住進來（1:2），恩惠、憐憫、平安必常同在（1:3），我們才照祂的命令彼此相愛（1:6），才為所愛的守門（1:10），也才盼望當面相見、喜樂滿足（1:12）。請你不要更佩服長老，請你更愛那位真的成了肉身來的主。"],["p","我們一起低頭禱告。天父，謝謝你，在我們抓住真理以前，真理已經先住進我們裡面；謝謝你的恩惠、憐憫、平安，必常與我們同在。求你教我們用兩隻手過日子：守住你的兒子，也不冷落任何一個人。求你安慰為兒女流淚的父母，親自去找那些走遠的孩子；求你使因病、因工作、因距離只能在線上相聚的弟兄姊妹，知道自己沒有被關在喜樂外面。也求你讓我們有一天當面相見，使我們的喜樂滿足。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰守得最嚴，也不比誰最包容，是讓每一個人說出自己比較常放下哪一隻手、門口最近有誰在敲門，和這一週要寫的一封信；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是紙墨、門口、喜樂。席上可能有為孩子流淚的父母、只能在線上參加的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：真理先住進來，愛被命令定義；第十節關上的是否認基督的教師的講台與背書，不是家人的餐桌；守門是為了當面相見、喜樂滿足。"],["n","1. ★ 你最後一次收到或寫出一封手寫信，是甚麼時候、寫給誰？那封信裡有沒有一句話，是你寧可當面說的？"],["n","2. ★★★ 請用自己的話說：「我們若照他的命令行，這就是愛」（1:6）。愛有形狀、命令有溫度，各是甚麼意思？舉一個你生活裡只用了一隻手的例子。"],["n","3. ★★ 第十節的接他到家裡和問他的安，在第一世紀是甚麼意思？為甚麼它不是叫我們冷落不信的家人？同一位長老在約翰三書叫人接待誰？"],["n","4. ★★ 問安原文就是願你喜樂，和第四、十二節的喜樂同一個字根。長老把喜樂留給誰、留到甚麼時候？這怎樣改變你對守門的感覺？"],["m","帶領提醒：蒙揀選的太太是誰、越過的異文，這些問題一句指向講義的議題頁，不在組裡辯論；不點名任何講員、群體或組裡的人是迷惑人的。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己比較常放下哪一隻手、門口最近有誰在敲門，並說出這一週要走的一小步。"],["t","【看】看見自己"],["n","5. ★★★ 在這封信的三種人裡，你最像哪一個：掛念著一些人的長老、門口常有人敲門的那一家，還是曾經站在門外、走錯過路的人？說出最近一件事。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:1–3 兩遍。哪一個詞讓你停下來：存在、必、憐憫，還是在真理和愛心上？"],["t","【想】想通關卡"],["n","7. ★★★ 你比較容易放下哪一隻手？放下真理，常是怕得罪人；放下愛心，常是怕被騙、覺得自己是對的。你卡在哪裡？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：真理先住進我裡面，恩惠、憐憫、平安必常與我同在。下一位只回一句：必常與你同在，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一小步：哪一天、對哪一個人、做哪一件事，是守門的一步還是開門的一步。若你正為一個孩子心碎，這一步可以只是找一位信得過的人一起為他禱告。"],["m","帶領提醒：這一化可能碰到家庭傷害、兒女離開信仰、曾被人以守住真理為名推出門外的傷，以及長期無望感。不追問細節，不要求任何人原諒誰，也不要求和好，不對正在流淚的人說「你要有信心」，也不說孩子不信是你沒做好。不在組裡處理，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一則連結、一張餐桌、一封信、一位 920 的「2」、一位朋友。"],["n","10. ★★ 說出一則你這個月轉發或收藏過、心裡不太確定的課程、講員或募款連結（不必說講員名字）。這一週星期幾以前，你要私下拿去問哪一位組長或牧者？"],["n","11. ★★ 這一週或下一個節日，你要坐上哪一張有不信的家人或朋友的餐桌？說出時間、地點，和你要對誰說平安。"],["n","12. ★ 這一週你要寫一封手寫信給誰？一張紙就好。說出他的名字和你哪一天寫。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，也許是一位離開了教會的朋友，或一位還在路上的孩子。當場說出來，可以說名字，也可以只用代稱（例如「我的大兒子」「一位老同學」）。說出這一週哪一天、用甚麼方式（電話、見面、手寫信）向他分享這一課。若那一位曾經傷害過你，這一週只為他禱告就好。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一位老人寫信給一個家，寫滿一張紙就停筆，說剩下的話要當面說。第二句，他在信裡說，真正的愛有形狀，要守住那一位真的成了人的耶穌，卻從不冷落任何人。第三句，我也在學著兩隻手一起用，並且盼望和我愛的人當面相見。說出這位朋友是誰、哪一天說，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收我會多包容這類答案。920 的那一位可以只用代稱，不強迫說出名字，尤其不強迫說出曾經傷害自己的人。碰到家庭傷害、兒女離開信仰或長期無望感時，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要寫的那一封信，和要坐上去的那一張餐桌。"],["p","然後彼此代禱，為三種人指名禱告：一位兒女還沒信主、或已經離開信仰的父母，求主安慰他，也親自去找那個孩子；一位因病、因工作、因距離只能在線上相聚的弟兄姊妹，求主使他知道自己沒有被關在喜樂外面；一位正被更新更深的說法吸引的朋友，求主用憐憫帶他回來。"],["p","最後由組長慢慢讀一遍：「恩惠、憐憫、平安從父神和他兒子耶穌基督在真理和愛心上必常與我們同在！」（1:3）"]]}}}</script>

<script>/* ===== 321約翰二書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.2jn.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}

function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 1;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 單章十點：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="約翰二書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">真 · 愛 · 守</p></div>`;
}

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');

/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */

    const el = $('#lesDl' + n); if (!el) return;

  });
}

/* ═══════ ① 真人語音 ═══════ */
const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"], link[rel="icon"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '朗讀中',
      artist: '321約翰二書講義',
      album: '國度321空中團契',
      artwork: ic ? [{ src: ic, sizes:'180x180', type:'image/png' }] : [],
    });
    navigator.mediaSession.setActionHandler('play',  () => { if (SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopSpeak());
    navigator.mediaSession.setActionHandler('previoustrack', () => spkStep(-1));
    navigator.mediaSession.setActionHandler('nexttrack',     () => spkStep(1));
    navigator.mediaSession.setActionHandler('seekbackward',  () => spkStep(-1));
    navigator.mediaSession.setActionHandler('seekforward',   () => spkStep(1));
  } catch(e){}
}
/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3) plFetch(k);
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if ((PL.try[k] || 0) >= 3){              // 這一段真的抓不到，跳過去，不要卡住整課
      PL.i = k; SPK.i = k; return plPlay(k + 1);
    }
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  a.src = URL.createObjectURL(b);
  a.onended = () => {
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}
    PL.cur = 1 - PL.cur;
    plPlay(k + 1);
  };
  a.onerror = () => { if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];
  if (nb){ const nx = els[1 - PL.cur];
    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  playSegs(chunks.map(t => ({ t })), title);
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function stopSpeak(){
  SPK.tok++; SPK.on = false; SPK.pause = false; SPK.buffering = false;
  PL = null;
  try { audioPair().forEach(a => { a.pause(); a.onended = null; a.onerror = null; }); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  spkClear();
  drawBar();
}
function plCurEl(){ const els = audioPair(); return els[PL ? PL.cur : 0]; }
function togglePause(){
  const a = plCurEl();
  if (SPK.pause){ const p = a.play(); if (p && p.catch) p.catch(() => {}); SPK.pause = false; }
  else { a.pause(); SPK.pause = true; }
  drawBar();
}
/* 往前／往後跳一句 */
function spkStep(d){
  if (!PL) return;
  const k = Math.max(0, Math.min(PL.segs.length - 1, PL.i + d));
  try { plCurEl().pause(); plCurEl().onended = null; } catch(e){}
  PL.i = k; SPK.pause = false;
  plPump(); plPlay(k);
}
function drawBar(){
  let el = $('#spkbar');
  if (!SPK.on){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'spkbar'; el.className = 'spkbar';
    document.body.appendChild(el);
  }
  const st = SPK.buffering ? `<span class="pv">緩衝中…</span>`
    : SPK.total ? `<span class="pv">${(SPK.i || 0) + 1}/${SPK.total}</span>` : '';
  const follow = PL && PL.lesson
    ? `<button class="${S.set.follow === 0 ? '' : 'on'}" title="自動捲動"
         onclick="toggleFollow()">${S.set.follow === 0 ? '⇕' : '⇳'}</button>` : '';
  el.innerHTML = `<span class="dot"></span><b>${esc(SPK.title)}</b>${st}
    <button onclick="spkStep(-1)" title="上一句">⏮</button>
    <button onclick="togglePause()">${SPK.pause ? '▶' : '⏸'}</button>
    <button onclick="spkStep(1)" title="下一句">⏭</button>${follow}
    <button onclick="stopSpeak()">✕</button>`;
}
function toggleFollow(){
  S.set.follow = S.set.follow === 0 ? 1 : 0; save(); drawBar();
  if (S.set.follow && PL) spkMark(PL.segs[PL.i]);
  toast(S.set.follow ? '朗讀時自動捲動' : '不自動捲動，畫面由你控制');
}

/* ── 標示正在讀的那一句，並且捲到它 ── */
let SPK_LAST = [];
function spkClear(){
  document.querySelectorAll('.spk-now').forEach(e => e.classList.remove('spk-now'));
  SPK_LAST = [];
}
function spkMark(seg){
  if (!seg || !PL || !PL.lesson) return;
  if (R.tab !== 'course' || R.ch !== PL.lesson || R.sub !== 'lesson') return;  // 不在這一頁就不動畫面
  spkClear();
  const n = PL.lesson;
  const els = [];
  if (seg.js && seg.js.length){
    seg.js.forEach(j => {
      const e = document.querySelector(`.les .mks[data-k="l|${n}|${seg.i}|${seg.part}|${j}"]`);
      if (e) els.push(e);
    });
  }
  if (!els.length){
    const blk = document.getElementById(`lb${n}_${seg.i}`);
    if (blk) els.push(blk);
  }
  if (!els.length) return;
  /* 想更深是收起來的，讀到它就打開 */
  const dt = els[0].closest('details.deeper');
  if (dt && !dt.open) dt.open = true;
  els.forEach(e => e.classList.add('spk-now'));
  SPK_LAST = els;
  if (S.set.follow === 0) return;
  if (Date.now() < (SPK.holdScroll || 0)) return;      // 使用者剛剛自己捲過，先別搶
  SPK.autoScrolling = true;
  clearTimeout(SPK.asT);
  SPK.asT = setTimeout(() => { SPK.autoScrolling = false; }, 900);
  try { els[0].scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){ els[0].scrollIntoView(); }
}
/* 使用者自己動手捲動時，先讓畫面歸他，六秒後再接手 */
(function(){
  const hold = () => { if (SPK.on) SPK.holdScroll = Date.now() + 6000; };
  ['wheel', 'touchstart', 'touchmove', 'pointerdown'].forEach(ev =>
    window.addEventListener(ev, hold, { passive:true }));
  window.addEventListener('keydown', e => {
    if (/^(Arrow|Page)|^(Home|End|Space)$/.test(e.key || '')) hold();
  });
})();

/* ═══════ ② 畫線與領受 ═══════ */
/* key 格式：  v|8:1          一節經文
              x|8:1|exp|3     某段解經的第 3 段
              l|8|41|t|2      第 8 課講義第 41 個區塊、第 2 句
                              （part：t 本文／q 想更深的問題／a 想更深的回答）*/
const mkHas = k => Object.prototype.hasOwnProperty.call(S.mk, k);
const mkNote = k => (S.mk[k] && S.mk[k].n) || '';
const mkColor = k => (S.mk[k] && S.mk[k].c) || '';
/* 七種顏色，與《321領導力》同一組 */
const HL_COLORS = [
  { k:'green',    label:'翠綠' }, { k:'blue',   label:'湛藍' },
  { k:'pink',     label:'粉紅' }, { k:'purple', label:'紫羅蘭' },
  { k:'maroon',   label:'酒紅' }, { k:'brown',  label:'土褐' },
  { k:'charcoal', label:'炭灰' },
];
function mkTap(k, el){
  if (mkHas(k)) return mkSheet(k);
  S.mk[k] = { n:'', at:Date.now(), c:(S.set.hlc || '') }; save();
  if (el && el.classList){ el.classList.add('hl'); if (S.set.hlc) el.setAttribute('data-c', S.set.hlc); }
  else render();
  toast('已畫線　·　再點一下換顏色或寫領受');
}
function mkSheet(k){
  const cur = mkNote(k), src = mkText(k);
  sheet(`<h4>✍️ 這一句</h4>
    <div class="mkq" id="mkq">${esc(src).slice(0, 300)}</div>
    <div class="hlrow"><span class="lb">畫線顏色</span>
      <button class="hlsw${mkColor(k) ? '' : ' on'}" style="background:var(--hl-gold)"
        title="金" onclick="mkSetColor('${k}','')"></button>
      ${HL_COLORS.map(c => `<button class="hlsw${mkColor(k) === c.k ? ' on' : ''}"
        style="background:var(--hl-${c.k})" title="${c.label}"
        onclick="mkSetColor('${k}','${c.k}')"></button>`).join('')}
    </div>
    <textarea class="note" id="mkin" placeholder="聖靈在這句話上對你說了什麼？">${esc(cur)}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn pri" onclick="mkSave('${k}')">儲存</button>
      <button class="btn" onclick="askXz(mkText('${k}'), '領受：' + (document.getElementById('mkin')||{}).value)">✨ 問小智</button>
    </div>
    <div class="row" style="margin-top:8px">
      ${cur ? `<button class="btn danger" onclick="mkDrop('${k}')">🗑 刪除領受</button>` : ''}
      <button class="btn danger" onclick="mkDel('${k}')">🗑 刪除畫線</button>
    </div>`);
  setTimeout(() => { const i = $('#mkin'); if (i) i.focus(); }, 60);
}
/* 只刪領受，畫線留著 */
function mkDrop(k){
  if (!mkHas(k)) return;
  S.mk[k].n = ''; save();
  const sh = $('#sheet'); if (sh) sh.classList.remove('on');
  mkKeep(k, render); toast('領受已刪除');
}
/* 改完之後畫面停在原位：以那一句為錨，重畫後把它挪回同一個位置 */
function mkKeep(k, fn){
  const sel = '[data-k="' + k + '"]';
  const before = document.querySelector(sel);
  const top = before ? before.getBoundingClientRect().top : null;
  fn();
  if (top === null) return;
  const after = document.querySelector(sel);
  if (!after) return;
  const now = after.getBoundingClientRect().top;
  if (Math.abs(now - top) > 1) window.scrollBy(0, now - top);
}
/* 選色：記在這一處畫線上，也記成下一次的預設色 */
function mkSetColor(k, c){
  if (!mkHas(k)) S.mk[k] = { n:'', at:Date.now() };
  S.mk[k].c = c; S.set.hlc = c; save();
  const box = $('#sheet');
  if (box) box.querySelectorAll('.hlsw').forEach((b, i) => {
    const want = i === 0 ? '' : HL_COLORS[i - 1].k;
    b.classList.toggle('on', want === c);
  });
  document.querySelectorAll('.mks,.mkp').forEach(el => {
    if (el.dataset.k !== k) return;
    el.classList.add('hl');
    if (c) el.setAttribute('data-c', c); else el.removeAttribute('data-c');
  });
}
function mkSave(k){
  const v = ($('#mkin') || {}).value || '';
  const c = mkColor(k);
  S.mk[k] = { n:v.trim(), at:Date.now(), c:c }; save();
  $('#sheet').classList.remove('on'); mkKeep(k, render); toast('領受已存');
}
/* 刪掉畫線：畫面停在原位，不讓下一段跳上來 */
function mkDel(k){
  const sel = '[data-k="' + k + '"]';
  const before = document.querySelector(sel);
  const top = before ? before.getBoundingClientRect().top : null;
  const y = window.scrollY;
  delete S.mk[k]; save();
  const sh = $('#sheet'); if (sh) sh.classList.remove('on');
  render();
  const after = document.querySelector(sel);
  if (after && top !== null){
    const now = after.getBoundingClientRect().top;
    if (Math.abs(now - top) > 1) window.scrollBy(0, now - top);
  } else { window.scrollTo(0, y); }
  toast('已刪除畫線');
}
function mkText(k){
  const p = k.split('|');
  if (p[0] === 'v'){
    const [c, v] = p[1].split(':'); const full = (D.txt[c] || [])[+v - 1] || '';
    if (p.length < 3) return full;
    const s = splitHTML(esc(full))[+p[2]] || '';
    return s.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').trim();
  }
  if (p[0] === 'c'){
    const m = meta(+p[1].split(':')[0]) || {};
    return (m.card || [])[+p[3]] || '';
  }
  if (p[0] === 'l'){                                   // 教學講義
    const raw = lesRaw(+p[1], +p[2], p[3]);
    const s = splitHTML(esc(raw))[+p[4]] || '';
    return s.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').trim();
  }
  const b = VMAP[p[1]]; if (!b) return '';
  const s = sentsOf(b[p[2]] || '')[+p[3]] || '';
  return s.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}
/* 依句號切句；HTML 標籤不會被切斷，句末的引號跟著前一句走 */
const EN_SENT = false;
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;

/* ===== 全螢幕模式：講台提詞機 ＋ 小組帶領 ===== */
let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // 教學講義逐字稿
    const s = (D.lesson || {})[n];
    // 「想更深」是備而不用的問答，不上提詞機
    F.pages = s ? telePages(s.blocks.filter(b => b[0] !== 'd')) : outlinePages(n);
    F.total = (s ? s.min : 40) * 60;
    F.left = F.total;
    // 標題列只放主標題，副標題太長會擠成兩行
    $('#ftitle').textContent = '《' + (s ? s.title.split('——')[0] : meta(n).t) + '》';
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = '《' + meta(n).t + '》';
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = '第' + n + '章 · 小組';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}
function fClose(){
  F = null; clearInterval(FT); FT = null;
  document.documentElement.setAttribute('data-tele', '0');
  $('#full').classList.remove('on'); keepAwake(false);
}
async function keepAwake(on){
  try {
    if (on && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen');
    else if (WAKE) { WAKE.release(); WAKE = null; }
  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // 稿中的停頓 ＝ 換頁
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', '經文　' + p[1]], ['p', p[2]]] }));
  ps.push({ blocks:[['h','結論'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'① 破冰　10 分鐘', q:m.grp[0], tip:'讓每個人都說一句。組長先說自己的。' });
  ps.push({ sec:900, ttl:'② 經文共讀　15 分鐘', q:'「' + m.mv.t + '」　' + m.mv.r,
            tip:'逐人讀本章核心經文。讀完，先安靜三十秒，不急著解釋。' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'③ 討論　第 ' + (i + 2) + ' 題', q,
    tip: i === 1 ? '這是最深的一題。組長先說自己的。不要追問細節；若有人哭，停下來為他禱告，不要接著問下一題。'
       : i === 3 ? '請小組成員在第七天問他一次。' : '' }));
  ps.push({ sec:900, ttl:'④ 操練與代禱　15 分鐘', q:m.prac.main,
            tip:'一人只選一項。彼此指定第七天要問的同伴，然後為彼此禱告。' });
  return ps;
}
function fDraw(){
  if (!F) return;
  const p = F.pages[F.i], b = $('#fbody');
  if (F.tele){
    b.className = 'fbody tele';
    b.innerHTML = p.blocks.map(x =>
      x[0] === 'h' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 's' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 't' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'm' ? `<p class="pause">${esc(x[1])}</p>` :
      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">停　<b>${x[1]}</b>　秒</p>` :
      `<p>${esc(x[1])}</p>`).join('');
  } else {
    b.className = 'fbody live';
    b.innerHTML = `<h5>${esc(p.ttl)}</h5><p class="qq">${esc(p.q)}</p>` +
      (p.tip ? `<div class="tipbox"><b>💡 帶領提醒</b><br>${esc(p.tip)}</div>` : '');
    F.left = p.sec;
  }
  b.scrollTop = 0;
  $('#frail').style.width = ((F.i + 1) / F.pages.length * 100) + '%';
  $('#fplay').textContent = F.run ? '暫停' : '繼續';
  fClock();
}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('已經是最後一段'); return; }
  F.i = i; fDraw();
}
$('#fx').onclick = () => { if (confirm('結束這個模式嗎？')) fClose(); };
$('#fprev').onclick = () => fGo(-1);
$('#fnext').onclick = () => fGo(1);
$('#fplay').onclick = () => { F.run = !F.run; $('#fplay').textContent = F.run ? '暫停' : '繼續'; };
$('#fA').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); };

document.addEventListener('keydown', e => {
  if (!F) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fGo(1); }
  if (e.key === 'ArrowLeft') fGo(-1);
  if (e.key === 'Escape') fClose();
});

function vSearch(){
  setTitle('搜尋', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">搜尋</p>
    <input class="sbox" id="sq" placeholder="經節、原文、關鍵字…（例：1:6、喜樂、ἀλήθεια）" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">搜尋全卷講義、教學講義逐字稿、重點節解經、原文軌跡與爭議地圖。</p></div>`;
  if (q.length >= 1){
    const hit = (t) => t && t.indexOf(q) >= 0;
    const mk = (t) => esc(t).split(esc(q)).join('<mark>' + esc(q) + '</mark>');
    let r = '';
    // 經節
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">經文　${vs.length}</h3>`;
      vs.slice(0, 15).forEach(v => r += `<button class="chrow" onclick="openV('${v[0]}')">
        <span class="chn">${esc(v[0])}</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(v[1])}</b></span></button>`);
      if (vs.length > 15) r += `<p class="xs muted">（只顯示前 15 筆）</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">我的畫線　${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 40))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 30))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">解經　${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 38))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 章
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(hit) || c.grp.some(hit) || c.safe.some(hit) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">講義　${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // 教學講義逐字稿
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // 想更深是一問一答
        const p = parts.find(hit);
        if (p) { ls.push([k, p]); break; }
      }
    });
    if (ls.length){ r += `<h3 class="sec">教學講義　${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">
        <span class="chn">${String(x[0]).padStart(2,'0')}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(x[1].slice(0, 44))}${x[1].length > 44 ? '…' : ''}</b></span></button>`);
      if (ls.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 軌跡
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">原文軌跡　${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">原</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)}　·　${mk(t.ins)}</span></span></button>`); }
    // 爭議
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">爭議　${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">約貳 ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">找不到「${esc(q)}」。試試經節（1:6）、原文（ἀλήθεια）或關鍵字（真理、彼此相愛、喜樂）。</p>`;
  }
  return h;
}

    };
    const el = $('#MF');
    if (el) el.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
  } catch(e){}

  // 啟動畫面：至少停留一會兒，讓 logo 被看見
  const s = $('#splash');
  if (s){
    const off = () => { s.classList.add('gone'); setTimeout(() => { try { s.remove(); } catch(e){} }, 500); };
    setTimeout(off, 1100);
    if (s.addEventListener) s.addEventListener('click', off);
  }
 } catch(e){}
})();
</script>

<script>
/* Service Worker：離線可用。只在 http(s) 下註冊，file:// 直接開不受影響。 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
